<svg width="100%" viewBox="0 0 900 1100" role="img" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="white"/>
<title>Transaction state machine — loan lifecycle</title>
<desc>Loan lifecycle state machine with happy path, rejection, and default branches.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ─── LAYOUT PLAN ─────────────────────────────────────────────
  Centre happy path:  cx=450  box w=210  x=345..555
  Left reject column: cx=130  box w=150  x=55..205
  Right default col:  cx=760  box w=170  x=675..845

  Transition labels RIGHT of centre: x=570 (start of label)
  Transition labels LEFT  of centre: x=330 (end, text-anchor=end)
  Right-column labels: x=860 (end, text-anchor=end) — but that clips at 900,
    so use x=848 text-anchor=end or x=570+ depending on content.

  Failure arrow routes:
    KYC fail:    left edge of PENDING_KYC (x=345,y=149) → x=260 → down → REJECTED right (x=205)
    Limit fail:  left edge of PENDING_LIMIT (x=345,y=214) → x=245 → down
    Reject:      left edge of PENDING_APPROVAL (x=345,y=344) → x=230 → down
    All terminate at right edge of REJECTED (x=205, y=430)

  Right-column arrows:
    ACTIVE → DEFAULTED:  right edge ACTIVE (x=555,y=409) → x=675
    DEFAULTED → ACTIVE:  left edge DEFAULTED (x=675,y=475) → x=600 → up → right edge ACTIVE
    DEFAULTED → LIQUIDATED: straight down
    LIQUIDATED → CLOSED: left edge LIQUIDATED (x=675,y=544) → x=570 → up → bottom CLOSED
─────────────────────────────────────────────────────────────── -->

<!-- ══ TITLE ══ -->
<text x="450" y="28" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#111">Transaction State Machine (Loan Lifecycle)</text>

<!-- ══ INITIAL DOT ══ -->
<circle cx="450" cy="52" r="10" fill="#222"/>
<line x1="450" y1="62" x2="450" y2="78" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ DRAFT  y=79 ══ -->
<g>
  <rect x="345" y="79" width="210" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="450" y="101" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">DRAFT</text>
</g>
<text x="572" y="115" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Borrower submits</text>
<line x1="450" y1="123" x2="450" y2="139" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ PENDING_KYC  y=140 ══ -->
<g>
  <rect x="345" y="140" width="210" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="450" y="162" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">PENDING_KYC</text>
</g>
<text x="572" y="178" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">KYC ok</text>
<line x1="450" y1="184" x2="450" y2="200" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ PENDING_LIMIT  y=201 ══ -->
<g>
  <rect x="345" y="201" width="210" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="450" y="223" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">PENDING_LIMIT</text>
</g>
<text x="572" y="239" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Limit ok</text>
<line x1="450" y1="245" x2="450" y2="261" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ PENDING_SCORE  y=262 ══ -->
<g>
  <rect x="345" y="262" width="210" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="450" y="284" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">PENDING_SCORE</text>
</g>
<text x="572" y="300" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">ML committed</text>
<line x1="450" y1="306" x2="450" y2="322" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ PENDING_APPROVAL  y=323 ══ -->
<g>
  <rect x="345" y="323" width="210" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="450" y="345" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">PENDING_APPROVAL</text>
</g>

<!-- ── FAILURE PATHS → REJECTED ──────────────────────────────
  All route out left edge of centre boxes, collect at x=255,
  then run straight down to the right edge of REJECTED (x=205, y=430 mid).
  Labels sit to the LEFT, ending at x=338 text-anchor=end.
─────────────────────────────────────────────────────────── -->

<!-- KYC fails label + path -->
<text x="334" y="153" text-anchor="end" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">KYC fails</text>
<path d="M345 162 L265 162 L265 432 L206 432" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>

<!-- Borrowing-limit fail label + path -->
<text x="334" y="211" text-anchor="end" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Borrowing-limit fail</text>
<path d="M345 223 L275 223 L275 442 L206 442" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>

<!-- Approver rejects label + path -->
<text x="334" y="335" text-anchor="end" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Approver rejects</text>
<path d="M345 345 L285 345 L285 452 L206 452" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>

<!-- ══ REJECTED  y=415 ══ -->
<g>
  <rect x="55" y="415" width="150" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="130" y="437" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">REJECTED</text>
</g>

<!-- ── APPROVE → ACTIVE ── -->
<text x="572" y="360" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Approver approves</text>
<text x="572" y="376" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">+ reveal</text>
<line x1="450" y1="367" x2="450" y2="393" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ ACTIVE  y=394 ══ -->
<g>
  <rect x="345" y="394" width="210" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="450" y="416" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">ACTIVE</text>
</g>

<!-- processInstallment self-loop: arc out right side and back -->
<text x="572" y="406" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">processInstallment(N)</text>
<path d="M555 408 Q610 403 610 416 Q610 429 555 424" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

<!-- ── final installment paid → CLOSED ── -->
<text x="334" y="460" text-anchor="end" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Final installment paid</text>
<line x1="450" y1="438" x2="450" y2="518" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ── missed beyond grace → DEFAULTED ── -->
<text x="572" y="455" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Missed beyond grace</text>
<path d="M555 418 L640 418 L640 458 L674 458" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ DEFAULTED  y=449 ══ -->
<g>
  <rect x="675" y="449" width="170" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="760" y="471" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">DEFAULTED</text>
</g>

<!-- cure within window: DEFAULTED → ACTIVE (dashed, L-bend back left) -->
<text x="572" y="500" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Cure within window</text>
<path d="M675 462 L628 462 L628 416 L556 416" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>

<!-- LiquidationEngine seizes → LIQUIDATED -->
<text x="572" y="520" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">LiquidationEngine seizes</text>
<line x1="760" y1="493" x2="760" y2="523" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ LIQUIDATED  y=524 ══ -->
<g>
  <rect x="675" y="524" width="170" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="760" y="546" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">LIQUIDATED</text>
</g>

<!-- recovery distributed → CLOSED: L-bend left then up -->
<text x="572" y="572" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Recovery distributed</text>
<path d="M675 546 L556 546 L556 540" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ CLOSED  y=519 ══ -->
<g>
  <rect x="345" y="519" width="210" height="44" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="0.5"/>
  <text x="450" y="541" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">CLOSED</text>
</g>

<!-- arrow CLOSED → final state -->
<line x1="450" y1="563" x2="450" y2="589" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ FINAL STATE (bullseye) ══ -->
<circle cx="450" cy="600" r="13" fill="none" stroke="#222" stroke-width="1.8"/>
<circle cx="450" cy="600" r="7" fill="#222"/>

<!-- ══════════════════════════════════
     LEGEND  (left box)   y=635
══════════════════════════════════ -->
<rect x="44" y="632" width="280" height="168" rx="6" fill="none" stroke="#ccc" stroke-width="0.8"/>
<text x="60" y="656" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">Legend</text>

<circle cx="76" cy="682" r="9" fill="#222"/>
<text x="96" y="682" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Initial state</text>

<rect x="64" y="700" width="22" height="16" rx="3" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="96" y="708" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">State</text>

<line x1="64" y1="730" x2="100" y2="730" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="112" y="730" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Successful transition</text>

<line x1="64" y1="754" x2="100" y2="754" stroke="#999" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="112" y="754" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Failure / alternate transition</text>

<circle cx="76" cy="778" r="11" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="76" cy="778" r="6" fill="#222"/>
<text x="96" y="778" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">Final state</text>

<!-- ══════════════════════════════════
     DESIGN PRINCIPLES  (right box)   y=635
══════════════════════════════════ -->
<rect x="356" y="632" width="500" height="168" rx="6" fill="none" stroke="#ccc" stroke-width="0.8"/>
<text x="372" y="656" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111">Design principles</text>
<text x="372" y="682" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">• All state transitions are guarded by CEI-ordered</text>
<text x="372" y="700" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">  contract functions.</text>
<text x="372" y="726" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">• Every transition emits an indexed event</text>
<text x="372" y="744" text-anchor="start" dominant-baseline="central" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#111">  for auditability.</text>

</svg>