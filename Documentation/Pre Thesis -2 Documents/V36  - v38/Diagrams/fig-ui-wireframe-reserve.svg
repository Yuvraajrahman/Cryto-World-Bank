    <text x="96" y="626" font-size="10" fill="#a3a3a3">Kenya National Bank</text>
    <rect x="280" y="612" width="310" height="18" rx="6" fill="rgba(59,130,246,0.75)"/>
    <text x="710" y="626" font-size="11" fill="#93c5fd" font-family="ui-monospace, monospace">3.10M</text>

    <text x="96" y="660" font-size="10" fill="#a3a3a3">Vietnam National Bank</text>
    <rect x="280" y="646" width="250" height="18" rx="6" fill="rgba(34,197,94,0.75)"/>
    <text x="710" y="660" font-size="11" fill="#86efac" font-family="ui-monospace, monospace">2.50M</text>

    <text x="96" y="694" font-size="10" fill="#a3a3a3">Unallocated reserve</text>
    <rect x="280" y="680" width="170" height="18" rx="6" fill="rgba(255,255,255,0.15)"/>
    <text x="710" y="694" font-size="11" fill="#d4d4d4" font-family="ui-monospace, monospace">2.65M</text>

    <!-- Reserve ratio gauge -->
