  <text x="358" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">PostgreSQL</text>
  <text x="358" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Relational</text>
  <text x="358" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Database</text>
  <!-- FastAPI ML -->
  <rect x="431" y="398" width="100" height="82" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="481" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">FastAPI</text>
  <text x="481" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">ML Scoring</text>
  <text x="481" y="444" text-anchor="middle" font-size="10" fill="#555">Service</text>
  <!-- Chainlink Oracle -->
  <rect x="544" y="398" width="110" height="82" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="599" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Chainlink</text>
  <text x="599" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Oracle</text>
  <text x="599" y="444" text-anchor="middle" font-size="10" fill="#555">Integration</text>
  <!-- Event Listener -->
  <rect x="667" y="398" width="78" height="82" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="706" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Event</text>
  <text x="706" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Listener</text>
  <text x="706" y="448" text-anchor="middle" font-size="10" fill="#555">(Indexer)</text>

  <!-- Key Technologies - layer 3 -->
  <rect x="985" y="382" width="105" height="115" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="1038" y="402" text-anchor="middle" font-size="10" fill="#333">Node.js, Express.js,</text>
  <text x="1038" y="416" text-anchor="middle" font-size="10" fill="#333">PostgreSQL, FastAPI,</text>
  <text x="1038" y="430" text-anchor="middle" font-size="10" fill="#333">Redis, WebSockets</text>

  <!-- Vertical connector between layers 3 and 4 -->
  <line x1="450" y1="497" x2="450" y2="514" stroke="#333" stroke-width="2"/>
  <polygon points="446,514 450,522 454,514" fill="#333"/>
  <polygon points="446,497 450,489 454,497" fill="#333"/>

