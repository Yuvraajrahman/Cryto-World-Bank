    <text x="360" y="572" font-size="11" font-weight="600" fill="#d4d4d4">SHAP feature attribution</text>
    <rect x="360" y="582" width="508" height="148" rx="12" fill="rgba(0,0,0,0.30)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <text x="376" y="608" font-size="10" fill="#a3a3a3">Income stability</text>
    <rect x="500" y="596" width="120" height="14" rx="4" fill="#22c55e" opacity="0.85"/>
    <text x="630" y="608" font-size="10" fill="#86efac">+0.14</text>

    <text x="376" y="632" font-size="10" fill="#a3a3a3">Credit history</text>
    <rect x="500" y="620" width="96" height="14" rx="4" fill="#22c55e" opacity="0.75"/>
    <text x="630" y="632" font-size="10" fill="#86efac">+0.09</text>

    <text x="376" y="656" font-size="10" fill="#a3a3a3">Loan amount</text>
