    <rect x="88" y="442" width="216" height="68" rx="12" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.45)" stroke-width="1.4"/>
    <text x="104" y="466" font-size="12" font-weight="600" fill="#fafafa">AML-2041</text>
    <text x="104" y="484" font-size="11" fill="#fca5a5">High risk | 0x9f2a...4c11</text>
    <text x="104" y="500" font-size="10" fill="#a3a3a3">2 min ago</text>

    <rect x="88" y="518" width="216" height="56" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="104" y="542" font-size="12" fill="#d4d4d4">AML-2036</text>
    <text x="104" y="560" font-size="10" fill="#737373">Medium | Loan #1038</text>

    <rect x="88" y="582" width="216" height="56" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="104" y="606" font-size="12" fill="#d4d4d4">AML-2029</text>
    <text x="104" y="624" font-size="10" fill="#737373">Low | Income mismatch</text>

    <rect x="88" y="688" width="216" height="44" rx="10" fill="rgba(37,99,235,0.12)" stroke="rgba(59,130,246,0.28)" stroke-width="1"/>
