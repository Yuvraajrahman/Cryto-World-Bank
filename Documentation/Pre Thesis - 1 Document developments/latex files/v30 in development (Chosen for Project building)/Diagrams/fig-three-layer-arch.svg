  <!-- LAYER 4: CHAINLINK INFRASTRUCTURE LAYER -->
  <!-- ============================================================ -->
  <rect x="10" y="524" width="130" height="90" rx="4" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
