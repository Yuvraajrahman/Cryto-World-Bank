  <text x="233" y="574" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Chainlink</text>
  <text x="233" y="588" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Functions</text>
  <text x="233" y="600" text-anchor="middle" font-size="9" fill="#555">(Off-Chain Compute)</text>

  <rect x="312" y="558" width="130" height="48" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="377" y="574" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Chainlink</text>
  <text x="377" y="588" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Automation</text>
  <text x="377" y="600" text-anchor="middle" font-size="9" fill="#555">(Scheduled Tasks)</text>

  <rect x="456" y="558" width="130" height="48" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="521" y="574" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Chainlink</text>
  <text x="521" y="588" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Price Feeds</text>
  <text x="521" y="600" text-anchor="middle" font-size="9" fill="#555">(Market Data)</text>

  <rect x="600" y="558" width="135" height="48" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="668" y="574" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Chainlink</text>
  <text x="668" y="588" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Proof of Reserve</text>
  <text x="668" y="600" text-anchor="middle" font-size="9" fill="#555">(Reserve Verification)</text>

  <!-- Key Technologies - layer 4 -->
  <rect x="985" y="524" width="105" height="90" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="1038" y="546" text-anchor="middle" font-size="10" fill="#333">Chainlink Functions,</text>
  <text x="1038" y="560" text-anchor="middle" font-size="10" fill="#333">Automation, Price</text>
  <text x="1038" y="574" text-anchor="middle" font-size="10" fill="#333">Feeds, Proof of</text>
  <text x="1038" y="588" text-anchor="middle" font-size="10" fill="#333">Reserve</text>
