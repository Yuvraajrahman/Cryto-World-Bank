  <text x="150" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">pause multisig</text>
  <text x="150" y="165" text-anchor="middle" font-size="11" fill="#333">(WB admin, NB rep,</text>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#333">security reviewer)</text>

  <rect x="55" y="245" width="190" height="80" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
