<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="458" fill="white" stroke="#cccccc" stroke-width="1"/>

  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">TreasurySwap — Oracle-Priced, Atomic</text>
  <text x="410" y="55" text-anchor="middle" font-size="13" font-style="italic" fill="#333">Reserve-eligible asset swap priced by Chainlink; multisig required above 1M USDC</text>

  <!-- Bank wallet A -->
  <rect x="60" y="100" width="220" height="80" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="170" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Bank Wallet</text>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333">Asset A</text>
  <text x="170" y="166" text-anchor="middle" font-size="10.5" fill="#555">reserve ratio ≥ 20% required</text>

  <!-- Bank wallet B -->
  <rect x="540" y="100" width="220" height="80" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="650" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Bank Wallet</text>
  <text x="650" y="150" text-anchor="middle" font-size="12" fill="#333">Asset B</text>
  <text x="650" y="166" text-anchor="middle" font-size="10.5" fill="#555">reserve ratio ≥ 20% required</text>

  <!-- Chainlink oracle -->
  <rect x="330" y="80" width="160" height="60" rx="6" fill="#e7f0ea" stroke="#3d7a52" stroke-width="1.4"/>
  <text x="410" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4d30">Chainlink Feed</text>
  <text x="410" y="122" text-anchor="middle" font-size="11" fill="#1f4d30">price + 5–10 bps fee</text>

  <polyline points="410,150 410,158 310,158 310,235" fill="none" stroke="#3d7a52" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="310" y="250" text-anchor="middle" font-size="10.5" fill="#3d7a52">prices the swap</text>

  <!-- Swap arrows -->
  <line x1="280" y1="150" x2="530" y2="150" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow5)"/>
  <text x="410" y="176" text-anchor="middle" font-size="12" fill="#111">atomic swap: A ⇄ B</text>

  <!-- Multisig gate -->
  <rect x="260" y="270" width="300" height="80" rx="6" fill="#fdf5e6" stroke="#c9a96a" stroke-width="1.4"/>
  <text x="410" y="298" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5a4520">Multisig Gate</text>
  <text x="410" y="317" text-anchor="middle" font-size="11.5" fill="#5a4520">swaps &gt; 1,000,000 USDC require</text>
  <text x="410" y="333" text-anchor="middle" font-size="11.5" fill="#5a4520">2 signatures before submission</text>

  <line x1="410" y1="192" x2="410" y2="265" stroke="#8a6d2f" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow5)"/>

  <!-- Footer -->
  <text x="410" y="420" text-anchor="middle" font-size="12" fill="#222">Both legs of the swap settle atomically: either both asset transfers succeed, or the whole transaction reverts.</text>
</svg>
