  <!-- L1 -->
  <rect x="1140" y="105" width="220" height="340" rx="14" fill="#e8f1fa" stroke="#1f5f9a" stroke-width="1.4"/>
  <circle cx="1250" cy="150" r="28" fill="#0e6ebd"/>
  <text x="1250" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">L1</text>
  <text x="1250" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1f3864">Smart Contract</text>
  <text x="1250" y="228" text-anchor="middle" font-size="13" fill="#334e68">ReentrancyGuard</text>
  <text x="1250" y="250" text-anchor="middle" font-size="12" fill="#5a738c">CEI / OZ RBAC</text>
  <text x="1250" y="272" text-anchor="middle" font-size="12" fill="#5a738c">role expiry / UUPS</text>
  <text x="1250" y="294" text-anchor="middle" font-size="12" fill="#5a738c">pause · Foundry tests</text>
  <text x="1250" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#0e6ebd">Stops</text>
  <text x="1250" y="352" text-anchor="middle" font-size="12" fill="#1565a0">reentrancy</text>
