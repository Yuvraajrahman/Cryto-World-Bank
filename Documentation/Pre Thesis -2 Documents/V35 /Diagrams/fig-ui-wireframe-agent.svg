<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#120a06"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="48" y="48" width="1304" height="804" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <ellipse cx="1180" cy="120" rx="320" ry="220" fill="url(#glowOrange)"/>
  <ellipse cx="180" cy="760" rx="280" ry="200" fill="url(#glowBlue)"/>
  <ellipse cx="700" cy="450" rx="420" ry="280" fill="url(#glowOrange)" opacity="0.35"/>

  <g clip-path="url(#screenClip)">
    <!-- Top navigation -->
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="none" stroke="rgba(234,88,12,0.25)" stroke-width="1"/>

    <circle cx="88" cy="80" r="20" fill="url(#orangeAccent)"/>
    <text x="88" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">C</text>
    <text x="118" y="78" font-size="22.5" font-weight="700" fill="#fafafa">Crypto World Bank</text>
    <text x="118" y="98" font-size="11" fill="#a3a3a3">AI banking assistant</text>

    <rect x="360" y="66" width="96" height="28" rx="14" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="408" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Assistant</text>
    <text x="480" y="84" font-size="12" fill="#737373">Loans</text>
    <text x="540" y="84" font-size="12" fill="#737373">Messages</text>
    <text x="620" y="84" font-size="12" fill="#737373">Profile</text>

    <rect x="1040" y="64" width="148" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="1060" cy="80" r="5" fill="#22c55e"/>
    <text x="1074" y="84" font-size="11" fill="#d4d4d4">0x7a3f...9c2e</text>

    <rect x="1200" y="62" width="132" height="36" rx="18" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="1266" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect Wallet</text>

    <!-- Agent banner -->
    <rect x="48" y="128" width="1304" height="52" rx="14" fill="rgba(37,99,235,0.10)" stroke="rgba(59,130,246,0.28)" stroke-width="1.2"/>
    <circle cx="82" cy="154" r="12" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="82" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd">AI</text>
    <text x="106" y="150" font-size="13" font-weight="600" fill="#93c5fd">Banking assistant online - actions need your confirmation</text>
    <text x="106" y="166" font-size="11" fill="#60a5fa">Answers questions and can submit loans after you approve</text>
    <rect x="1188" y="142" width="148" height="24" rx="12" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="1262" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Status: Online</text>

    <!-- Page header -->
    <text x="72" y="218" font-size="11" letter-spacing="3" fill="#ea580c" font-weight="600">ASSISTANT</text>
    <text x="72" y="248" font-size="28" font-weight="700" fill="#fafafa">Banking Agent</text>
    <text x="72" y="272" font-size="13" fill="#a3a3a3">Conversational help with confirmation-gated write actions</text>

    <!-- Main chat panel -->
    <rect x="72" y="296" width="820" height="556" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="72" y="296" width="820" height="4" rx="18" fill="url(#orangeAccent)"/>

    <!-- Chat header -->
    <rect x="96" y="316" width="772" height="44" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="118" cy="338" r="14" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="118" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#93c5fd">AI</text>
    <text x="142" y="334" font-size="13" font-weight="600" fill="#fafafa">CWB Assistant</text>
    <text x="142" y="350" font-size="10" fill="#737373">Always here to help with your banking</text>
    <rect x="792" y="326" width="68" height="24" rx="12" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
    <circle cx="806" cy="338" r="4" fill="#22c55e"/>
    <text x="816" y="342" font-size="10" font-weight="600" fill="#86efac">Online</text>

    <!-- Bot message 1 -->
    <rect x="96" y="376" width="420" height="52" rx="16" fill="rgba(0,0,0,0.32)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="112" y="398" font-size="10" fill="#ea580c">AGENT</text>
    <text x="112" y="416" font-size="12" fill="#e5e5e5">Hi Amina! Ask me about limits, loans, or KYC.</text>

    <!-- User message -->
    <rect x="448" y="440" width="420" height="44" rx="16" fill="rgba(234,88,12,0.35)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="658" y="466" text-anchor="middle" font-size="12" fill="#fafafa">I want to apply for 1,500 USDC for 6 months</text>

    <!-- Bot message 2 - loan summary -->
    <rect x="96" y="496" width="520" height="80" rx="16" fill="rgba(0,0,0,0.32)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="112" y="518" font-size="10" fill="#ea580c">AGENT</text>
    <text x="112" y="536" font-size="12" fill="#e5e5e5">You are requesting 1,500 USDC for 6 months at 8.0% APR.</text>
    <text x="112" y="554" font-size="12" fill="#d4d4d4">Monthly installment: 260.00 USDC. Shall I proceed?</text>
    <text x="112" y="570" font-size="10" fill="#737373">Ready to submit your loan application</text>

    <!-- Confirmation gate -->
    <rect x="96" y="592" width="772" height="96" rx="14" fill="rgba(234,88,12,0.12)" stroke="rgba(249,115,22,0.40)" stroke-width="1.4"/>
    <text x="112" y="616" font-size="11" font-weight="600" fill="#fdba74">CONFIRMATION REQUIRED</text>
    <text x="112" y="636" font-size="12" fill="#fde68a">This will submit a loan request on your behalf. You must approve before anything is sent.</text>
    <rect x="112" y="648" width="168" height="32" rx="16" fill="url(#btnGreen)"/>
    <text x="196" y="668" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Confirm Submit Loan</text>
    <rect x="292" y="648" width="100" height="32" rx="16" fill="url(#btnRed)" opacity="0.92"/>
    <text x="342" y="668" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Cancel</text>

    <!-- Suggested prompts -->
    <rect x="96" y="696" width="772" height="44" rx="12" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="108" y="708" width="148" height="22" rx="11" fill="rgba(234,88,12,0.15)" stroke="rgba(249,115,22,0.35)" stroke-width="1"/>
    <text x="182" y="723" text-anchor="middle" font-size="10" fill="#fdba74">My borrowing limit?</text>
    <rect x="268" y="708" width="130" height="22" rx="11" fill="rgba(234,88,12,0.15)" stroke="rgba(249,115,22,0.35)" stroke-width="1"/>
    <text x="333" y="723" text-anchor="middle" font-size="10" fill="#fdba74">Next installment</text>
    <rect x="410" y="708" width="120" height="22" rx="11" fill="rgba(234,88,12,0.15)" stroke="rgba(249,115,22,0.35)" stroke-width="1"/>
    <text x="470" y="723" text-anchor="middle" font-size="10" fill="#fdba74">Explain KYC</text>

    <!-- Chat input -->
    <rect x="96" y="752" width="640" height="44" rx="12" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="112" y="779" font-size="12" fill="#737373">Ask about limits, loans, banks, policy...</text>
    <rect x="748" y="752" width="120" height="44" rx="12" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="808" y="779" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Send</text>

    <!-- Context panel -->
    <rect x="916" y="296" width="412" height="268" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="940" y="334" font-size="10" letter-spacing="2" fill="#a3a3a3">LIVE CONTEXT</text>
    <text x="940" y="360" font-size="18" font-weight="700" fill="#fafafa">Client snapshot</text>

    <rect x="940" y="376" width="364" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="400" font-size="12" fill="#a3a3a3">Credit Passport</text>
    <text x="1288" y="400" text-anchor="end" font-size="13" font-weight="600" fill="#fdba74">Gold (682)</text>

    <rect x="940" y="422" width="364" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="446" font-size="12" fill="#a3a3a3">Open loans</text>
    <text x="1288" y="446" text-anchor="end" font-size="13" font-weight="600" fill="#fafafa">0 / 2</text>

    <rect x="940" y="468" width="364" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="492" font-size="12" fill="#a3a3a3">KYC level</text>
    <text x="1288" y="492" text-anchor="end" font-size="13" font-weight="600" fill="#86efac">Level 2</text>

    <rect x="940" y="514" width="364" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="538" font-size="12" fill="#a3a3a3">Max borrow</text>
    <text x="1288" y="538" text-anchor="end" font-size="13" font-weight="600" fill="#fafafa">1,000 USDC</text>

    <!-- Quick actions panel -->
    <rect x="916" y="580" width="412" height="272" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="940" y="618" font-size="10" letter-spacing="2" fill="#a3a3a3">QUICK ACTIONS</text>
    <text x="940" y="644" font-size="18" font-weight="700" fill="#fafafa">Things I can help with</text>

    <rect x="940" y="660" width="364" height="36" rx="10" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.30)" stroke-width="1"/>
    <text x="1122" y="683" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">View My Account</text>

    <rect x="940" y="704" width="364" height="36" rx="10" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.30)" stroke-width="1"/>
    <text x="1122" y="727" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">Check Loan Status</text>

    <rect x="940" y="748" width="364" height="36" rx="10" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.30)" stroke-width="1"/>
    <text x="1122" y="771" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">What Documents Do I Need?</text>

    <rect x="940" y="792" width="364" height="36" rx="10" fill="rgba(234,88,12,0.16)" stroke="rgba(249,115,22,0.45)" stroke-width="1.2"/>
    <text x="1122" y="815" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Apply for a Loan</text>

    <rect x="940" y="836" width="364" height="36" rx="10" fill="rgba(234,88,12,0.16)" stroke="rgba(249,115,22,0.45)" stroke-width="1.2"/>
    <text x="1122" y="859" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Pay an Installment</text>
  </g>

  <text x="700" y="24" text-anchor="middle" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.35)" font-weight="600">BANKING AGENT WIREFRAME</text>
</svg>
