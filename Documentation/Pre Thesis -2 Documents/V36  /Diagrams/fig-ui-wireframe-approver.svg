    <rect x="360" y="762" width="508" height="54" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="376" y="782" font-size="9" font-weight="600" fill="#737373">FEATURE</text>
    <text x="500" y="782" font-size="9" font-weight="600" fill="#737373">EXPECTED</text>
    <text x="610" y="782" font-size="9" font-weight="600" fill="#737373">ACTUAL</text>
    <text x="720" y="782" font-size="9" font-weight="600" fill="#737373">DEVIATION</text>
    <line x1="376" y1="788" x2="852" y2="788" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
