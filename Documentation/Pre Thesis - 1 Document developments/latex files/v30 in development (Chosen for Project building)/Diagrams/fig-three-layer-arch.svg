  <text x="1038" y="58" text-anchor="middle" font-size="10" fill="#333">React 18, TypeScript,</text>
  <text x="1038" y="72" text-anchor="middle" font-size="10" fill="#333">Wagmi, Viem,</text>
  <text x="1038" y="86" text-anchor="middle" font-size="10" fill="#333">Ethers.js</text>

