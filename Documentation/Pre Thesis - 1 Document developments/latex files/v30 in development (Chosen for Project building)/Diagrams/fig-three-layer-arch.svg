  <text x="225" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Express.js</text>
  <text x="225" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">REST API</text>
  <text x="225" y="448" text-anchor="middle" font-size="10" fill="#555">(Node.js)</text>
  <!-- PostgreSQL -->
