<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#120a06"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="btnOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="48" y="48" width="1304" height="804" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <ellipse cx="1180" cy="120" rx="320" ry="220" fill="url(#glowOrange)"/>
  <ellipse cx="180" cy="760" rx="280" ry="200" fill="url(#glowBlue)"/>
  <ellipse cx="700" cy="450" rx="420" ry="280" fill="url(#glowOrange)" opacity="0.35"/>

  <g clip-path="url(#screenClip)">
    <!-- Top navigation -->
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="none" stroke="rgba(234,88,12,0.25)" stroke-width="1"/>

    <circle cx="88" cy="80" r="20" fill="url(#orangeAccent)"/>
    <text x="88" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">C</text>
    <text x="118" y="78" font-size="22.5" font-weight="700" fill="#fafafa">Crypto World Bank</text>
    <text x="118" y="98" font-size="11" fill="#a3a3a3">Mobile-first responsive layout</text>

    <rect x="360" y="66" width="120" height="28" rx="14" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="420" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Breakpoints</text>
    <text x="500" y="84" font-size="12" fill="#737373">Components</text>
    <text x="600" y="84" font-size="12" fill="#737373">Navigation</text>

    <!-- Section: breakpoints -->
    <text x="72" y="148" font-size="11" letter-spacing="3" fill="#ea580c" font-weight="600">RESPONSIVE BREAKPOINTS</text>
    <text x="72" y="168" font-size="13" fill="#a3a3a3">React layout adapts navigation and content density across screen widths</text>

    <g filter="url(#softShadow)">
      <rect x="72" y="188" width="1256" height="56" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Mobile zone -->
      <rect x="80" y="196" width="300" height="40" rx="10" fill="rgba(234,88,12,0.15)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
      <text x="230" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#fdba74">Mobile</text>
      <text x="230" y="228" text-anchor="middle" font-size="10" fill="#a3a3a3">&lt; 640 px - bottom tab bar</text>
      <!-- Tablet zone -->
      <rect x="392" y="196" width="420" height="40" rx="10" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.35)" stroke-width="1"/>
      <text x="602" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#93c5fd">Tablet</text>
      <text x="602" y="228" text-anchor="middle" font-size="10" fill="#a3a3a3">640 - 1024 px - collapsible side menu</text>
      <!-- Desktop zone -->
      <rect x="824" y="196" width="496" height="40" rx="10" fill="rgba(34,197,94,0.10)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
      <text x="1072" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#86efac">Desktop</text>
      <text x="1072" y="228" text-anchor="middle" font-size="10" fill="#a3a3a3">&gt; 1024 px - top horizontal navigation</text>
    </g>

    <!-- Phone mockup -->
    <text x="200" y="278" text-anchor="middle" font-size="11" letter-spacing="2" fill="#ea580c" font-weight="600">MOBILE</text>
    <g filter="url(#softShadow)">
      <rect x="88" y="292" width="224" height="448" rx="28" fill="#0a0a0a" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <rect x="168" y="306" width="64" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
      <!-- Phone header -->
      <rect x="100" y="324" width="200" height="44" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <circle cx="118" cy="346" r="10" fill="url(#orangeAccent)"/>
      <text x="118" y="350" text-anchor="middle" font-size="8" font-weight="700" fill="#0a0a0a">C</text>
      <text x="136" y="342" font-size="11" font-weight="700" fill="#fafafa">CWB</text>
      <text x="136" y="354" font-size="8" fill="#737373">Borrower</text>
      <rect x="248" y="334" width="44" height="24" rx="12" fill="url(#btnBlue)"/>
      <text x="270" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">Wallet</text>
      <!-- Phone content -->
      <text x="112" y="396" font-size="10" fill="#a3a3a3">My loans</text>
      <text x="112" y="418" font-size="16" font-weight="700" fill="#fafafa">Dashboard</text>
      <rect x="112" y="432" width="176" height="72" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="124" y="452" font-size="8" fill="#a3a3a3">Credit Passport</text>
      <text x="124" y="472" font-size="14" font-weight="700" fill="#fafafa">Gold - 682</text>
      <text x="124" y="490" font-size="8" fill="#ea580c">Eligible to borrow</text>
      <rect x="112" y="516" width="176" height="56" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="124" y="536" font-size="8" fill="#a3a3a3">Open balance</text>
      <text x="124" y="556" font-size="13" font-weight="700" fill="#fafafa">0 USDC</text>
      <rect x="112" y="584" width="176" height="32" rx="16" fill="url(#btnGreen)"/>
      <text x="200" y="604" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Apply for Loan</text>
      <!-- Bottom tab bar -->
      <rect x="100" y="684" width="200" height="48" rx="0" fill="rgba(10,10,10,0.95)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="100" y="684" width="200" height="1" fill="rgba(234,88,12,0.3)"/>
      <text x="120" y="714" text-anchor="middle" font-size="8" font-weight="600" fill="#fdba74">Home</text>
      <circle cx="120" cy="700" r="3" fill="#f97316"/>
      <text x="160" y="714" text-anchor="middle" font-size="8" fill="#737373">Loans</text>
      <text x="200" y="714" text-anchor="middle" font-size="8" fill="#737373">Pay</text>
      <text x="240" y="714" text-anchor="middle" font-size="8" fill="#737373">Agent</text>
      <text x="280" y="714" text-anchor="middle" font-size="8" fill="#737373">Profile</text>
    </g>

    <!-- Tablet mockup -->
    <text x="520" y="278" text-anchor="middle" font-size="11" letter-spacing="2" fill="#ea580c" font-weight="600">TABLET</text>
    <g filter="url(#softShadow)">
      <rect x="352" y="292" width="336" height="448" rx="20" fill="#0a0a0a" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
