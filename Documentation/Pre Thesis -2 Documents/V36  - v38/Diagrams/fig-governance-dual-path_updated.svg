  <text x="645" y="320" text-anchor="middle" font-size="12" fill="#222">yes</text>

  <line x1="780" y1="270" x2="880" y2="345" stroke="#555" stroke-width="1.3" marker-end="url(#a34)"/>
  <text x="868" y="320" text-anchor="middle" font-size="12" fill="#222">no</text>

  <rect x="600" y="350" width="220" height="70" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="710" y="378" text-anchor="middle" font-size="13" fill="#111">48h TimelockController</text>
