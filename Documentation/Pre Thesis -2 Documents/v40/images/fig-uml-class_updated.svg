<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="inherit24" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="white" stroke="#2b2b2b" stroke-width="1"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="698" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">UML Class Diagram — Institutional Hierarchy &amp; Loan Services</text>

  <!-- Institution (abstract) -->
  <rect x="370" y="45" width="260" height="80" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <line x1="370" y1="82" x2="630" y2="82" stroke="#2b2b2b" stroke-width="1"/>
  <text x="500" y="61" text-anchor="middle" font-size="10.5" font-style="italic" fill="#333">«abstract»</text>
  <text x="500" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Institution</text>
  <text x="380" y="98" font-size="12" fill="#222">+institutionId: PK</text>
  <text x="380" y="114" font-size="12" fill="#222">+institutionType: enum</text>

  <!-- Row 2: three subclasses -->
  <rect x="30" y="150" width="260" height="80" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="30" y1="176" x2="290" y2="176" stroke="#2b2b2b" stroke-width="1"/>
  <text x="160" y="169" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">WorldBankReserve</text>
  <text x="40" y="192" font-size="11.5" fill="#222">+allocateCapital(bank, amt)</text>
  <text x="40" y="208" font-size="11.5" fill="#222">+registerNationalBank(addr)</text>

  <rect x="370" y="150" width="260" height="80" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="370" y1="176" x2="630" y2="176" stroke="#2b2b2b" stroke-width="1"/>
  <text x="500" y="169" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">NationalBank</text>
  <text x="380" y="192" font-size="11.5" fill="#222">+registerLocalBank(addr)</text>
  <text x="380" y="208" font-size="11.5" fill="#222">+allocateToLocal(bank, amt)</text>

  <rect x="710" y="150" width="260" height="80" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="710" y1="176" x2="970" y2="176" stroke="#2b2b2b" stroke-width="1"/>
  <text x="840" y="169" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">LocalBank</text>
  <text x="720" y="192" font-size="11.5" fill="#222">+onboardClient(wallet)</text>
  <text x="720" y="208" font-size="11.5" fill="#222">+freezeAccount(clientId)</text>

  <!-- Inheritance arrows to Institution -->
  <line x1="160" y1="150" x2="470" y2="126" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#inherit24)"/>
  <line x1="500" y1="150" x2="500" y2="126" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#inherit24)"/>
  <line x1="840" y1="150" x2="545" y2="126" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#inherit24)"/>

  <!-- capital flow arrows -->
  <line x1="220" y1="230" x2="440" y2="150" stroke="#555" stroke-width="1.1" marker-end="url(#a24)"/>
  <text x="330" y="250" text-anchor="middle" font-size="10.5" fill="#333">downward capital</text>
  <line x1="600" y1="230" x2="780" y2="150" stroke="#555" stroke-width="1.1" marker-end="url(#a24)"/>
  <text x="670" y="250" text-anchor="middle" font-size="10.5" fill="#333">downward capital</text>

  <!-- Borrower (under LocalBank) -->
  <rect x="710" y="260" width="260" height="100" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="710" y1="286" x2="970" y2="286" stroke="#2b2b2b" stroke-width="1"/>
  <text x="840" y="279" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Borrower</text>
  <text x="720" y="302" font-size="11.5" fill="#222">+borrowerId: UUID</text>
  <text x="720" y="317" font-size="11.5" fill="#222">+walletAddress: address</text>
  <text x="720" y="332" font-size="11.5" fill="#222">+kycLevel: int</text>
  <text x="720" y="347" font-size="11.5" fill="#222">+registeredLocalBankId: FK</text>

  <line x1="840" y1="230" x2="840" y2="258" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a24)"/>
  <text x="855" y="248" font-size="11" fill="#222">retail service</text>

  <!-- LoanService (independent, upper left services branch) -->
  <rect x="370" y="260" width="260" height="80" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="370" y1="286" x2="630" y2="286" stroke="#2b2b2b" stroke-width="1"/>
  <text x="500" y="279" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">LoanService</text>
  <text x="380" y="302" font-size="11.5" fill="#222">+submitApplication(dto)</text>
  <text x="380" y="318" font-size="11.5" fill="#222">+getAuthorityBrief(loanId)</text>

  <!-- LoanRequest (under Borrower) -->
  <rect x="710" y="390" width="260" height="120" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="710" y1="416" x2="970" y2="416" stroke="#2b2b2b" stroke-width="1"/>
  <text x="840" y="409" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">LoanRequest</text>
  <text x="720" y="432" font-size="11.5" fill="#222">+requestId: UUID</text>
  <text x="720" y="447" font-size="11.5" fill="#222">+status: enum</text>
  <text x="720" y="462" font-size="11.5" fill="#222">+oracleState: enum</text>
  <text x="720" y="477" font-size="11.5" fill="#222">+amount: decimal</text>
  <text x="720" y="494" font-size="11.5" font-style="italic" fill="#222">+submitApplication()</text>

  <line x1="840" y1="360" x2="840" y2="388" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a24)"/>
  <text x="855" y="378" font-size="11" fill="#222">submits (1 → 0..*)</text>

  <!-- ScoringService (independent, lower left) -->
  <rect x="30" y="390" width="260" height="90" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="30" y1="416" x2="290" y2="416" stroke="#2b2b2b" stroke-width="1"/>
  <text x="160" y="409" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">ScoringService</text>
  <text x="40" y="432" font-size="11.5" fill="#222">+score(features): float</text>
  <text x="40" y="448" font-size="11.5" font-style="italic" fill="#222">+explain(loanId): SHAPVector</text>

  <!-- LoanController (under LoanRequest) -->
  <rect x="680" y="540" width="290" height="120" rx="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <line x1="680" y1="566" x2="970" y2="566" stroke="#2b2b2b" stroke-width="1"/>
  <text x="825" y="559" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">LoanController</text>
  <text x="690" y="582" font-size="11.5" fill="#222">+commitRiskScore(hash)</text>
  <text x="690" y="597" font-size="11.5" fill="#222">+revealRiskScore(score, nonce)</text>
  <text x="690" y="612" font-size="11.5" fill="#222">+approveLoan(requestId)</text>
  <text x="690" y="627" font-size="11.5" fill="#222">+disburseLoan(loanId)</text>
  <text x="690" y="642" font-size="11.5" fill="#222">+processInstallment(loanId, n)</text>

  <line x1="840" y1="510" x2="840" y2="538" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a24)"/>
  <text x="855" y="528" font-size="11" fill="#222">mirrored on-chain (1 → 0..1)</text>

  <!-- Dashed connectors LoanService -> LoanController / ScoringService -->
  <line x1="560" y1="340" x2="700" y2="565" stroke="#555" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#a24)"/>
  <text x="670" y="450" text-anchor="middle" font-size="10.5" fill="#333">calls via API</text>

  <line x1="420" y1="340" x2="230" y2="388" stroke="#555" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#a24)"/>
  <text x="350" y="392" text-anchor="middle" font-size="10.5" fill="#333">POST /v1/score</text>

  <text x="500" y="686" text-anchor="middle" font-size="12" fill="#222">Capital cascades top-down through the institutional hierarchy; loan records mirror on-chain via LoanController.</text>
</svg>
