  <circle cx="145" cy="258" r="9" fill="none" stroke="#1f3864" stroke-width="2"/>
  <circle cx="145" cy="258" r="3" fill="#1f3864"/>
  <text x="168" y="258" font-size="18" font-weight="700" fill="#1f3864">Application Services</text>
  <text x="168" y="278" font-size="12" fill="#1565a0">Express.js / FastAPI / MCP tool server / Event listener</text>

  <rect x="125" y="295" width="200" height="60" rx="10" fill="#ffffff" stroke="#2b6cb0"/>
  <circle cx="155" cy="325" r="14" fill="#e3f2fd"/>
  <circle cx="155" cy="325" r="6" fill="none" stroke="#1565a0" stroke-width="1.5"/>
  <path d="M155 319 v12 M149 325 h12" stroke="#1565a0" stroke-width="1.4"/>
  <text x="180" y="320" font-size="13" font-weight="700" fill="#1565a0">REST API</text>
  <text x="180" y="338" font-size="11" fill="#5a738c">auth / loans</text>

  <rect x="345" y="295" width="230" height="60" rx="10" fill="#e3f2fd" stroke="#1f3864" stroke-width="1.8"/>
  <circle cx="375" cy="325" r="14" fill="#0e6ebd"/>
