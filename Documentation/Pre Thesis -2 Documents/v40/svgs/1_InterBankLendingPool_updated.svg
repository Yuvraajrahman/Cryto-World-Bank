<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="458" fill="white" stroke="#cccccc" stroke-width="1"/>

  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">InterBankLendingPool — Same-Tier Liquidity</text>
  <text x="410" y="55" text-anchor="middle" font-size="13" font-style="italic" fill="#333">Same-tier bank-to-bank lending pool, flexible 1 / 7 / 30-day terms</text>

  <!-- Bank A -->
  <rect x="40" y="180" width="180" height="80" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="130" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Bank A</text>
  <text x="130" y="235" text-anchor="middle" font-size="12" fill="#333">(Tier N)</text>

  <!-- Bank B -->
  <rect x="600" y="180" width="180" height="80" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="690" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Bank B</text>
  <text x="690" y="235" text-anchor="middle" font-size="12" fill="#333">(Tier N)</text>

  <!-- Pool contract -->
  <rect x="320" y="150" width="180" height="150" rx="6" fill="#f3f6fc" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="410" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">IBLP Pool</text>
  <text x="410" y="196" text-anchor="middle" font-size="11" fill="#333">(per-tier contract,</text>
  <text x="410" y="210" text-anchor="middle" font-size="11" fill="#333">e.g. IBLP_NB / IBLP_LB)</text>
  <line x1="340" y1="222" x2="480" y2="222" stroke="#999" stroke-width="1"/>
  <text x="410" y="242" text-anchor="middle" font-size="12" fill="#111">term: 1 / 7 / 30 days</text>
  <text x="410" y="260" text-anchor="middle" font-size="11" fill="#333">rate &amp; limit per bank</text>
  <text x="410" y="275" text-anchor="middle" font-size="11" fill="#333">config</text>

  <!-- Arrows Bank A <-> Pool -->
  <line x1="220" y1="205" x2="315" y2="205" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="267" y="197" text-anchor="middle" font-size="12" fill="#111">contribute</text>

  <line x1="315" y1="245" x2="220" y2="245" stroke="#555" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="267" y="262" text-anchor="middle" font-size="12" fill="#333">withdraw + interest</text>

  <!-- Arrows Pool <-> Bank B -->
  <line x1="505" y1="205" x2="595" y2="205" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="550" y="197" text-anchor="middle" font-size="12" fill="#111">loan (rate r)</text>

  <line x1="595" y1="245" x2="505" y2="245" stroke="#555" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="550" y="262" text-anchor="middle" font-size="11.5" fill="#333">repay principal + interest</text>

  <!-- Footer note -->
  <rect x="60" y="350" width="700" height="70" rx="6" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
  <text x="410" y="374" text-anchor="middle" font-size="12" fill="#222">A separate pool instance is deployed per tier (IBLP_NB for National Banks, IBLP_LB</text>
  <text x="410" y="392" text-anchor="middle" font-size="12" fill="#222">for Local Banks, …). Lending is bounded by per-counterparty limits and</text>
  <text x="410" y="410" text-anchor="middle" font-size="12" fill="#222">tier-controlled interest-rate ranges.</text>
</svg>
