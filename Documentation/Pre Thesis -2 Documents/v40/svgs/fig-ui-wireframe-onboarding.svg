<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#120a06"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="48" y="48" width="1304" height="804" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <ellipse cx="1180" cy="120" rx="320" ry="220" fill="url(#glowOrange)"/>
  <ellipse cx="180" cy="760" rx="280" ry="200" fill="url(#glowBlue)"/>
  <ellipse cx="700" cy="450" rx="420" ry="280" fill="url(#glowOrange)" opacity="0.35"/>

  <g clip-path="url(#screenClip)">
    <!-- Top navigation -->
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="none" stroke="rgba(234,88,12,0.25)" stroke-width="1"/>

    <circle cx="88" cy="80" r="20" fill="url(#orangeAccent)"/>
    <text x="88" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">C</text>
    <text x="118" y="78" font-size="22.5" font-weight="700" fill="#fafafa">Crypto World Bank</text>
    <text x="118" y="98" font-size="11" fill="#a3a3a3">Client onboarding portal</text>

    <rect x="360" y="66" width="104" height="28" rx="14" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="412" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Onboard</text>
    <text x="490" y="84" font-size="12" fill="#737373">Profile</text>
    <text x="560" y="84" font-size="12" fill="#737373">Help</text>

    <rect x="1040" y="64" width="148" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="1060" cy="80" r="5" fill="#22c55e"/>
    <text x="1074" y="84" font-size="11" fill="#d4d4d4">0x7a3f...9c2e</text>

    <rect x="1200" y="62" width="132" height="36" rx="18" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="1266" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect Wallet</text>

    <!-- Progress banner -->
    <rect x="48" y="128" width="1304" height="52" rx="14" fill="rgba(37,99,235,0.10)" stroke="rgba(59,130,246,0.28)" stroke-width="1.2"/>
    <text x="106" y="150" font-size="13" font-weight="600" fill="#93c5fd">Stage 3 of 5 - KYC verification in progress</text>
    <text x="106" y="166" font-size="11" fill="#60a5fa">Document capture and automated checks - estimated 2-5 minutes</text>
    <rect x="1188" y="142" width="148" height="24" rx="12" fill="rgba(59,130,246,0.18)" stroke="rgba(96,165,250,0.4)" stroke-width="1"/>
    <text x="1262" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">60% complete</text>

    <!-- Page header -->
    <text x="72" y="218" font-size="11" letter-spacing="3" fill="#ea580c" font-weight="600">ONBOARDING</text>
    <text x="72" y="248" font-size="28" font-weight="700" fill="#fafafa">Verify your identity</text>
    <text x="72" y="272" font-size="13" fill="#a3a3a3">Complete KYC to unlock loan limits and banking features</text>

  </g>

  <!-- Five-stage funnel stepper -->
  <g>
    <rect x="72" y="296" width="1256" height="88" rx="16" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#softShadow)"/>

    <!-- Stage connectors -->
    <line x1="220" y1="340" x2="310" y2="340" stroke="rgba(34,197,94,0.6)" stroke-width="2"/>
    <line x1="430" y1="340" x2="520" y2="340" stroke="rgba(34,197,94,0.6)" stroke-width="2"/>
    <line x1="640" y1="340" x2="730" y2="340" stroke="rgba(249,115,22,0.5)" stroke-width="2"/>
    <line x1="850" y1="340" x2="940" y2="340" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <line x1="1060" y1="340" x2="1150" y2="340" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <!-- Stage 1 - done -->
    <circle cx="180" cy="340" r="18" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-width="2"/>
    <path d="M 174 340 L 177 343 L 186 334" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
    <text x="180" y="372" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Browse</text>
    <text x="180" y="384" text-anchor="middle" font-size="9" fill="#737373">Stage 1</text>

    <!-- Stage 2 - done -->
    <circle cx="370" cy="340" r="18" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-width="2"/>
    <path d="M 364 340 L 367 343 L 376 334" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
    <text x="370" y="372" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Account</text>
    <text x="370" y="384" text-anchor="middle" font-size="9" fill="#737373">Stage 2</text>

    <!-- Stage 3 - active -->
    <circle cx="580" cy="340" r="22" fill="rgba(234,88,12,0.25)" stroke="#f97316" stroke-width="2.5"/>
    <text x="580" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#fdba74">3</text>
    <text x="580" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74">KYC</text>
    <text x="580" y="384" text-anchor="middle" font-size="9" fill="#ea580c">Current</text>

    <!-- Stage 4 - pending -->
    <circle cx="790" cy="340" r="18" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="790" y="345" text-anchor="middle" font-size="12" fill="#737373">4</text>
    <text x="790" y="372" text-anchor="middle" font-size="10" fill="#737373">First loan</text>
    <text x="790" y="384" text-anchor="middle" font-size="9" fill="#525252">Stage 4</text>

    <!-- Stage 5 - pending -->
    <circle cx="1000" cy="340" r="18" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="1000" y="345" text-anchor="middle" font-size="12" fill="#737373">5</text>
    <text x="1000" y="372" text-anchor="middle" font-size="10" fill="#737373">Power user</text>
    <text x="1000" y="384" text-anchor="middle" font-size="9" fill="#525252">Stage 5</text>
  </g>

  <g clip-path="url(#screenClip)">
    <!-- Stat cards -->
    <g filter="url(#softShadow)">
      <rect x="72" y="404" width="290" height="72" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="92" y="428" font-size="10" fill="#a3a3a3">Current KYC level</text>
      <text x="92" y="452" font-size="20" font-weight="700" fill="#fafafa">Level 1</text>
      <text x="92" y="468" font-size="11" fill="#737373">Upgrading to Level 2</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="378" y="404" width="290" height="72" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="398" y="428" font-size="10" fill="#a3a3a3">Home Local Bank</text>
      <text x="398" y="452" font-size="18" font-weight="700" fill="#fafafa">Dhaka Local</text>
      <text x="398" y="468" font-size="11" fill="#737373">Assigned at Stage 2</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="684" y="404" width="290" height="72" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="704" y="428" font-size="10" fill="#a3a3a3">Loan cap after KYC</text>
      <text x="704" y="452" font-size="20" font-weight="700" fill="#fdba74">1,000 USDC</text>
      <text x="704" y="468" font-size="11" fill="#ea580c">Level 2 Gold tier</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="990" y="404" width="338" height="72" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="1010" y="428" font-size="10" fill="#a3a3a3">Verification status</text>
      <text x="1010" y="452" font-size="20" font-weight="700" fill="#fafafa">In review</text>
      <text x="1010" y="468" font-size="11" fill="#737373">Automated + officer check</text>
    </g>

    <!-- Main KYC form panel -->
    <rect x="72" y="496" width="820" height="332" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="72" y="496" width="820" height="4" rx="18" fill="url(#orangeAccent)"/>

    <text x="96" y="534" font-size="11" letter-spacing="2" fill="#a3a3a3">DOCUMENT CAPTURE</text>
    <text x="96" y="556" font-size="16" font-weight="700" fill="#fafafa">Government ID and selfie</text>

    <text x="96" y="586" font-size="11" font-weight="600" fill="#d4d4d4">Government ID (NID / passport)</text>
    <rect x="96" y="594" width="360" height="72" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="112" y="626" font-size="12" fill="#a3a3a3">Drop file or tap to upload</text>
    <text x="112" y="648" font-size="10" fill="#737373">PDF, JPG, PNG - hashed on-chain only</text>
    <rect x="380" y="612" width="64" height="28" rx="14" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="412" y="630" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Uploaded</text>

    <text x="488" y="586" font-size="11" font-weight="600" fill="#d4d4d4">Live selfie verification</text>
    <rect x="488" y="594" width="360" height="72" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="504" y="626" font-size="12" fill="#a3a3a3">Take photo or upload selfie</text>
    <text x="504" y="648" font-size="10" fill="#737373">Matched against ID portrait</text>

    <text x="96" y="696" font-size="11" font-weight="600" fill="#d4d4d4">Income proof (Level 2 upgrade)</text>
    <rect x="96" y="704" width="752" height="44" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="112" y="731" font-size="12" fill="#a3a3a3">Payslip or bank statement (optional for Level 2)</text>

    <rect x="96" y="762" width="752" height="36" rx="10" fill="rgba(234,88,12,0.10)" stroke="rgba(249,115,22,0.30)" stroke-width="1"/>
    <text x="112" y="785" font-size="11" fill="#fdba74">Only document hashes are stored on-chain - raw files stay off-chain</text>

    <!-- KYC levels panel -->
    <rect x="916" y="496" width="412" height="332" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="940" y="534" font-size="10" letter-spacing="2" fill="#a3a3a3">KYC LEVELS</text>
    <text x="940" y="560" font-size="18" font-weight="700" fill="#fafafa">Unlock limits</text>

    <rect x="940" y="576" width="364" height="48" rx="10" fill="rgba(34,197,94,0.10)" stroke="rgba(34,197,94,0.30)" stroke-width="1"/>
    <text x="956" y="598" font-size="11" font-weight="600" fill="#86efac">Level 1 - ID + selfie</text>
    <text x="956" y="614" font-size="10" fill="#a3a3a3">Bronze / Silver - up to 250 USDC</text>
    <circle cx="1280" cy="600" r="8" fill="#22c55e"/>

    <rect x="940" y="632" width="364" height="48" rx="10" fill="rgba(234,88,12,0.14)" stroke="rgba(249,115,22,0.45)" stroke-width="1.4"/>
    <text x="956" y="654" font-size="11" font-weight="600" fill="#fdba74">Level 2 - income proof</text>
    <text x="956" y="670" font-size="10" fill="#a3a3a3">Gold - up to 1,000 USDC</text>
    <circle cx="1280" cy="656" r="8" fill="#f97316"/>

    <rect x="940" y="688" width="364" height="48" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="710" font-size="11" font-weight="600" fill="#d4d4d4">Level 3 - enhanced</text>
    <text x="956" y="726" font-size="10" fill="#737373">Platinum / Diamond - group lending</text>

    <line x1="940" y1="752" x2="1304" y2="752" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <circle cx="952" cy="772" r="5" fill="#22c55e"/>
    <text x="966" y="776" font-size="11" fill="#d4d4d4">Stage 4 unlocks first loan application</text>
    <circle cx="952" cy="798" r="5" fill="#ea580c"/>
    <text x="966" y="802" font-size="11" fill="#d4d4d4">Stage 5 enables group lending and power features</text>

    <!-- Action buttons -->
    <rect x="96" y="812" width="180" height="40" rx="20" fill="url(#btnGreen)" filter="url(#softShadow)"/>
    <text x="186" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Submit KYC</text>

    <rect x="292" y="812" width="120" height="40" rx="20" fill="url(#btnRed)" opacity="0.92"/>
    <text x="352" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Cancel</text>

    <rect x="428" y="812" width="156" height="40" rx="20" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
    <text x="506" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#fdba74">Save Progress</text>

    <rect x="948" y="812" width="168" height="40" rx="20" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="1032" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Back to Stage 2</text>
  </g>

  <text x="700" y="24" text-anchor="middle" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.35)" font-weight="600">CLIENT ONBOARDING WIREFRAME</text>
</svg>
