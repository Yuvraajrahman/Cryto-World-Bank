<svg viewBox="0 0 1000 665" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="1" y="1" width="998" height="663" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="500" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Use-Case Diagram — Crypto World Bank</text>

  <!-- system boundary -->
  <rect x="370" y="48" width="260" height="580" rx="4" fill="none" stroke="#555" stroke-width="1.3"/>
  <text x="500" y="66" text-anchor="middle" font-size="12" fill="#333">Crypto World Bank (system boundary)</text>

  <!-- use case ovals -->
  <g font-size="12" fill="#111">
    <ellipse cx="500" cy="95" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="99" text-anchor="middle">Register &amp; KYC</text>

    <ellipse cx="500" cy="145" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="149" text-anchor="middle">Submit loan application</text>

    <ellipse cx="500" cy="195" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="199" text-anchor="middle">Pay installment</text>

    <ellipse cx="500" cy="245" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="249" text-anchor="middle">View credit passport</text>

    <ellipse cx="500" cy="305" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="309" text-anchor="middle">Approve / reject loan</text>

    <ellipse cx="500" cy="355" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="359" text-anchor="middle">Freeze account</text>

    <ellipse cx="500" cy="405" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="409" text-anchor="middle">Generate SAR</text>

    <ellipse cx="500" cy="460" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="464" text-anchor="middle">Set rates &amp; caps</text>

    <ellipse cx="500" cy="510" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="514" text-anchor="middle">Allocate capital</text>

    <ellipse cx="500" cy="560" rx="105" ry="21" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="564" text-anchor="middle">Audit reserves (public)</text>

    <ellipse cx="500" cy="600" rx="105" ry="18" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="500" y="604" text-anchor="middle" font-size="11">Provide price / score feed</text>
  </g>

  <!-- left actors -->
  <g font-size="11.5">
    <rect x="30" y="70" width="180" height="46" rx="4" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="120" y="88" text-anchor="middle" font-weight="bold">A1 Retail Client</text>
    <text x="120" y="103" text-anchor="middle" font-size="10.5">(KYC L1/L2/L3)</text>

    <rect x="30" y="175" width="180" height="34" rx="4" fill="white" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="120" y="196" text-anchor="middle">A8 Blockchain Validator</text>

    <rect x="30" y="228" width="180" height="46" rx="4" fill="white" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="120" y="246" text-anchor="middle" font-weight="bold">A5 AI Agent</text>
    <text x="120" y="261" text-anchor="middle" font-size="10.5">(Phase III, gated)</text>

    <rect x="30" y="320" width="180" height="34" rx="4" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="120" y="341" text-anchor="middle">A2 Local Bank Admin</text>

    <rect x="30" y="440" width="180" height="34" rx="4" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="120" y="461" text-anchor="middle">A3 National Bank Admin</text>

    <rect x="30" y="495" width="180" height="34" rx="4" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.3"/>
    <text x="120" y="516" text-anchor="middle">A4 World Bank Admin</text>

    <rect x="30" y="582" width="180" height="34" rx="4" fill="white" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="120" y="603" text-anchor="middle">A7 Chainlink DON</text>
  </g>

  <!-- right actors -->
  <g font-size="11.5">
    <rect x="790" y="388" width="180" height="34" rx="4" fill="white" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="880" y="409" text-anchor="middle">A6 Regulatory Authority</text>

    <rect x="790" y="543" width="180" height="34" rx="4" fill="white" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="880" y="564" text-anchor="middle">A9 External Auditor</text>
  </g>

  <!-- connections: left actors -->
  <g stroke="#333" stroke-width="1" fill="none">
    <line x1="210" y1="88" x2="395" y2="95"/>
    <line x1="210" y1="95" x2="395" y2="145"/>
    <line x1="210" y1="103" x2="395" y2="195"/>

    <line x1="210" y1="192" x2="395" y2="195"/>

    <line x1="210" y1="337" x2="395" y2="305"/>
    <line x1="210" y1="337" x2="395" y2="355"/>
    <line x1="210" y1="337" x2="395" y2="405"/>

    <line x1="210" y1="457" x2="395" y2="460"/>
    <line x1="210" y1="457" x2="395" y2="510"/>

    <line x1="210" y1="512" x2="395" y2="510"/>
    <line x1="210" y1="512" x2="395" y2="560"/>

    <line x1="210" y1="599" x2="395" y2="600"/>
  </g>

  <!-- gated AI agent dotted lines -->
  <g stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,3">
    <line x1="210" y1="246" x2="395" y2="145"/>
    <line x1="210" y1="251" x2="395" y2="195"/>
    <line x1="210" y1="256" x2="395" y2="245"/>
  </g>
  <text x="255" y="220" font-size="9.5" fill="#555">gated</text>
  <text x="255" y="238" font-size="9.5" fill="#555">gated</text>
  <text x="255" y="256" font-size="9.5" fill="#555">read</text>

  <!-- connections: right actors -->
  <g stroke="#333" stroke-width="1" fill="none">
    <line x1="605" y1="405" x2="790" y2="405"/>
    <line x1="605" y1="560" x2="790" y2="560"/>
  </g>

  <text x="500" y="650" text-anchor="middle" font-size="11" fill="#222">Nine actor roles interacting with eleven core use cases across the four-tier hierarchy.</text>
</svg>
