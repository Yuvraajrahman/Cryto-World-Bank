      <rect x="364" y="308" width="312" height="40" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="376" y="320" width="18" height="3" rx="1.5" fill="#fdba74"/>
      <rect x="376" y="326" width="18" height="3" rx="1.5" fill="#fdba74"/>
      <rect x="376" y="332" width="18" height="3" rx="1.5" fill="#fdba74"/>
      <circle cx="418" cy="328" r="10" fill="url(#orangeAccent)"/>
      <text x="418" y="332" text-anchor="middle" font-size="8" font-weight="700" fill="#0a0a0a">C</text>
      <text x="436" y="326" font-size="12" font-weight="700" fill="#fafafa">Crypto World Bank</text>
      <text x="436" y="338" font-size="8" fill="#737373">Local borrower portal</text>
      <rect x="596" y="318" width="68" height="22" rx="11" fill="url(#btnBlue)"/>
      <text x="630" y="333" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">Connect</text>
