  <text x="450" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">React 18 + TypeScript Web Application</text>
  <line x1="165" y1="70" x2="735" y2="70" stroke="#ccc" stroke-width="0.5"/>
  <text x="450" y="90" text-anchor="middle" font-size="11" fill="#333">Pages • Components • State Management</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#333">Wagmi / Viem • Wallet Integration</text>

  <!-- Bidirectional arrow between core and optional in layer 1 -->
  <line x1="745" y1="100" x2="770" y2="100" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="770,96 778,100 770,104" fill="#555"/>
  <polygon points="745,96 737,100 745,104" fill="#555"/>

  <!-- Optional Add-on box -->
  <rect x="770" y="38" width="200" height="130" rx="4" fill="#f9f9f9" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="870" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">AI Agent Interface</text>
  <text x="870" y="74" text-anchor="middle" font-size="10" fill="#333">(Qwen3-8B)</text>
