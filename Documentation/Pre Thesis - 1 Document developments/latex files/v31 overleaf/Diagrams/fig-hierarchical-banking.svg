<svg width="100%" viewBox="0 0 960 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Four-Tier Capital Flow Diagram</title>
  <desc>A four-tier banking hierarchy showing capital disbursement downward and repayment upward, with interbank lending pools and upward surplus repatriation facility.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background tier bands -->
  <rect x="0" y="0" width="960" height="190" fill="#f8f8f8" rx="0"/>
  <rect x="0" y="190" width="960" height="170" fill="#ffffff" rx="0"/>
  <rect x="0" y="360" width="960" height="170" fill="#f8f8f8" rx="0"/>
  <rect x="0" y="530" width="960" height="150" fill="#ffffff" rx="0"/>

  <!-- Tier Labels on Left -->
  <text font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" x="18" y="78">Tier 1</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#444" x="18" y="94">World Bank</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#444" x="18" y="108">Reserve</text>

  <text font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" x="18" y="265">Tier 2</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#444" x="18" y="281">National</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#444" x="18" y="295">Banks</text>

  <text font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" x="18" y="435">Tier 3</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#444" x="18" y="451">Local</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#444" x="18" y="465">Banks</text>

  <text font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" x="18" y="600">Tier 4</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#444" x="18" y="616">Customers</text>

  <!-- Divider lines between tiers -->
  <line x1="0" y1="190" x2="960" y2="190" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="530" x2="960" y2="530" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== TIER 1: World Bank Reserve Box ===== -->
  <rect x="130" y="28" width="280" height="134" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111" x="270" y="52" text-anchor="middle">World Bank Reserve (Tier 1)</text>
  <line x1="148" y1="60" x2="392" y2="60" stroke="#888" stroke-width="0.8"/>
  <circle cx="148" cy="78" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="82">Holds global reserves and capital</text>
  <circle cx="148" cy="98" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="102">Lends to National Banks (Tier 2)</text>

  <!-- ===== TIER 2: National Banks Box ===== -->
  <rect x="130" y="205" width="280" height="134" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111" x="270" y="229" text-anchor="middle">National Banks (Tier 2)</text>
  <line x1="148" y1="237" x2="392" y2="237" stroke="#888" stroke-width="0.8"/>
  <circle cx="148" cy="255" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="259">Aggregate capital from Tier 1</text>
  <circle cx="148" cy="275" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="279">Lend to Local Banks (Tier 3)</text>
  <circle cx="148" cy="295" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="299">Interbank lending within Tier 2</text>

  <!-- ===== TIER 3: Local Banks Box ===== -->
  <rect x="130" y="375" width="280" height="134" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111" x="270" y="399" text-anchor="middle">Local Banks (Tier 3)</text>
  <line x1="148" y1="407" x2="392" y2="407" stroke="#888" stroke-width="0.8"/>
  <circle cx="148" cy="425" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="429">Aggregate capital from Tier 2</text>
  <circle cx="148" cy="445" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="449">Lend to Customers (Tier 4)</text>
  <circle cx="148" cy="465" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="469">Interbank lending within Tier 3</text>

  <!-- ===== TIER 4: Customers Box ===== -->
  <rect x="130" y="545" width="280" height="100" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111" x="270" y="569" text-anchor="middle">Customers (Tier 4)</text>
  <line x1="148" y1="577" x2="392" y2="577" stroke="#888" stroke-width="0.8"/>
  <circle cx="148" cy="595" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="599">Borrow from Local Banks</text>
  <circle cx="148" cy="615" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#333" x="158" y="619">Repay principal + interest</text>

  <!-- ===== Vertical Arrows between main boxes ===== -->
  <!-- Capital Disbursement: Tier1 → Tier2 (solid, down arrow) -->
  <line x1="200" y1="162" x2="200" y2="203" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="176" text-anchor="middle">Capital</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="189" text-anchor="middle">Disbursement</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="202" text-anchor="middle">($)</text>

  <!-- Repayment Tier2 → Tier1 (solid, up arrow) -->
  <line x1="228" y1="203" x2="228" y2="164" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="346" y="176" text-anchor="middle">Repayment</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="346" y="189" text-anchor="middle">+ Interest</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#444" font-style="italic" x="346" y="202" text-anchor="middle">(r_down)</text>

  <!-- Capital Disbursement: Tier2 → Tier3 (solid, down arrow) -->
  <line x1="200" y1="339" x2="200" y2="373" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="348" text-anchor="middle">Capital</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="361" text-anchor="middle">Disbursement</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="374" text-anchor="middle">($)</text>

  <!-- Repayment Tier3 → Tier2 (solid, up arrow) -->
  <line x1="228" y1="373" x2="228" y2="341" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="346" y="348" text-anchor="middle">Repayment</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="346" y="361" text-anchor="middle">+ Interest</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#444" font-style="italic" x="346" y="374" text-anchor="middle">(r_down)</text>

  <!-- Capital Disbursement: Tier3 → Tier4 (solid, down arrow) -->
  <line x1="200" y1="509" x2="200" y2="543" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="518" text-anchor="middle">Capital</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="531" text-anchor="middle">Disbursement</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="108" y="544" text-anchor="middle">($)</text>

  <!-- Repayment Tier4 → Tier3 (solid, up arrow) -->
  <line x1="228" y1="543" x2="228" y2="511" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="346" y="518" text-anchor="middle">Repayment</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="346" y="531" text-anchor="middle">+ Interest</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#444" font-style="italic" x="346" y="544" text-anchor="middle">(r_down)</text>

  <!-- ===== InterBankLendingPool Tier 2 ===== -->
  <rect x="455" y="205" width="200" height="130" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111" x="555" y="228" text-anchor="middle">InterBankLendingPool</text>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333" x="555" y="244" text-anchor="middle">(Tier 2)</text>
  <line x1="470" y1="251" x2="638" y2="251" stroke="#888" stroke-width="0.8"/>
  <circle cx="470" cy="267" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="480" y="271">Peer-to-peer lending</text>
  <circle cx="470" cy="285" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="480" y="289">Collateralized</text>
  <circle cx="470" cy="303" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="480" y="307">Rate: r_peer (same-tier)</text>

  <!-- Tier2 ← InterBankPool2 dashed arrow (same-tier lending) -->
  <line x1="453" y1="262" x2="412" y2="262" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>

  <!-- ===== InterBankLendingPool Tier 3 ===== -->
  <rect x="455" y="375" width="200" height="130" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111" x="555" y="398" text-anchor="middle">InterBankLendingPool</text>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333" x="555" y="414" text-anchor="middle">(Tier 3)</text>
  <line x1="470" y1="421" x2="638" y2="421" stroke="#888" stroke-width="0.8"/>
  <circle cx="470" cy="437" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="480" y="441">Peer-to-peer lending</text>
  <circle cx="470" cy="455" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="480" y="459">Collateralized</text>
  <circle cx="470" cy="473" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="480" y="477">Rate: r_peer (same-tier)</text>

  <!-- Tier3 ← InterBankPool3 dashed arrow -->
  <line x1="453" y1="432" x2="412" y2="432" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>

  <!-- ===== UpwardDepositFacility Box (Tier 1 right side) ===== -->
  <rect x="680" y="22" width="255" height="158" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111" x="807" y="46" text-anchor="middle">UpwardDepositFacility</text>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#555" x="807" y="62" text-anchor="middle">(Surplus from lower tiers)</text>
  <line x1="695" y1="70" x2="922" y2="70" stroke="#888" stroke-width="0.8"/>
  <circle cx="695" cy="86" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="705" y="90">Holds upward surplus</text>
  <circle cx="695" cy="106" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="705" y="110">Pays r_up to depositors</text>
  <circle cx="695" cy="126" r="3" fill="#444"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="705" y="130">Repatriates to higher tier</text>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="716" y="146">on demand/trigger</text>

  <!-- Upward Surplus Repatriation arrow from UpwardDepositFacility → World Bank Reserve -->
  <!-- Arrow goes left from UDF to the top of World Bank box -->
  <line x1="678" y1="65" x2="413" y2="65" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-dashed)"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="548" y="50" text-anchor="middle">Upward Surplus</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#333" x="548" y="62" text-anchor="middle">Repatriation (r_up)</text>

  <!-- Dashed upward surplus flow arrows going right from main boxes toward UDF -->
  <!-- Tier2 → UDF (dashed right arrow) -->
  <path d="M 412 240 L 660 240 L 660 130 L 678 130" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arrow-dashed)"/>

  <!-- Tier3 → UDF (via longer path rightward) -->
  <path d="M 412 410 L 650 410 L 650 140 L 678 140" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arrow-dashed)"/>

  <!-- ===== LEGEND ===== -->
  <rect x="680" y="220" width="255" height="175" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111" x="807" y="241" text-anchor="middle">Legend</text>
  <line x1="695" y1="248" x2="922" y2="248" stroke="#888" stroke-width="0.8"/>

  <!-- Legend item 1: Capital Disbursement (solid arrow down) -->
  <line x1="700" y1="265" x2="738" y2="265" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="745" y="269">Capital Disbursement (Downward)</text>

  <!-- Legend item 2: Repayment (solid arrow left) -->
  <line x1="738" y1="288" x2="700" y2="288" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="745" y="292">Repayment + Interest (Upward)</text>

  <!-- Legend item 3: Same-Tier Interbank (dashed arrow left) -->
  <line x1="738" y1="311" x2="700" y2="311" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="745" y="315">Same-Tier Interbank Lending</text>

  <!-- Legend item 4: Upward Surplus (dashed arrow right) -->
  <line x1="700" y1="334" x2="738" y2="334" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#333" x="745" y="338">Upward Surplus Flow</text>

  <!-- ===== Asymmetric Rate Structure Box ===== -->
  <rect x="680" y="415" width="255" height="165" rx="6" fill="#333" stroke="#111" stroke-width="1.5"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" x="807" y="437" text-anchor="middle">Asymmetric Rate Structure (On-Chain)</text>
  <line x1="695" y1="445" x2="922" y2="445" stroke="#777" stroke-width="0.8"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#ddd" x="695" y="463">r_up  = Upward surplus deposit rate</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#bbb" x="725" y="477">(paid by higher tier)</text>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#ddd" x="695" y="495">r_down = Downward lending rate</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#bbb" x="725" y="509">(charged to lower-tier)</text>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#ddd" x="695" y="527">&#948;    = Spread / Compliance Buffer</text>
  <line x1="695" y1="535" x2="922" y2="535" stroke="#777" stroke-width="0.8"/>
  <text font-family="Arial, sans-serif" font-size="10.5" fill="#ccc" x="807" y="549" text-anchor="middle">Enforced Constraint:</text>
  <text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" x="807" y="572" text-anchor="middle">r_up &lt; r_down &#8722; &#948;</text>

  <!-- ===== CASCADING REPAYMENT BOX at bottom ===== -->
  <rect x="70" y="672" width="830" height="90" rx="8" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111" x="485" y="697" text-anchor="middle">Cascading Repayment (Upward Flow)</text>
  <line x1="85" y1="705" x2="882" y2="705" stroke="#888" stroke-width="0.8"/>

  <!-- Cascading flow boxes -->
  <rect x="85" y="712" width="148" height="36" rx="5" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#222" x="159" y="727" text-anchor="middle">Customers</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#444" x="159" y="741" text-anchor="middle">Repay Local Banks</text>

  <line x1="233" y1="730" x2="258" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="712" width="160" height="36" rx="5" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#222" x="340" y="727" text-anchor="middle">Local Banks</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#444" x="340" y="741" text-anchor="middle">Repay National Banks</text>

  <line x1="420" y1="730" x2="445" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="447" y="712" width="172" height="36" rx="5" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#222" x="533" y="727" text-anchor="middle">National Banks</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#444" x="533" y="741" text-anchor="middle">Repay World Bank Reserve</text>

  <line x1="619" y1="730" x2="644" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="646" y="712" width="216" height="36" rx="5" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#222" x="754" y="727" text-anchor="middle">World Bank Reserve</text>
  <text font-family="Arial, sans-serif" font-size="10" fill="#444" x="754" y="741" text-anchor="middle">Final Settlement</text>

</svg>
