  <!-- ============================================================ -->
  <rect x="10" y="195" width="130" height="160" rx="4" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <text x="75" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
