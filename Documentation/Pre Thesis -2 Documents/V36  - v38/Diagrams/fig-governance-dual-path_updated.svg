  <line x1="710" y1="420" x2="710" y2="450" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a34)"/>

  <rect x="605" y="455" width="210" height="60" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="710" y="490" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Execute change</text>

  <text x="500" y="535" text-anchor="middle" font-size="12" fill="#222">Emergency actions bypass the timelock to pause quickly; routine changes require quorum and a 48h delay.</text>
