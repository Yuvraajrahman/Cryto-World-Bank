<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="920" viewBox="0 0 680 920" role="img"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>CWB system overview — four-tier capital hierarchy and technology stack (monochrome)</title>
<desc>Unified monochrome diagram: four-tier institutional hierarchy with allocateCapital, InterBankLendingPool, and UpwardDepositFacility flows; six on-chain banking functions; and four-layer technology stack.</desc>
<defs>
