<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>WorldBankReserve — Capital, held in the open.</title>
    <meta
      name="description"
      content="A four-tier, on-chain reserve banking platform. World → National → Local → Client, with every balance verifiable."
    />
    <script>
      (function () {
        try {
          var key = "wbr-theme-pref";
          var pref = localStorage.getItem(key) || "system";
          var system = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
          var resolved = pref === "light" || pref === "dark" ? pref : system;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
