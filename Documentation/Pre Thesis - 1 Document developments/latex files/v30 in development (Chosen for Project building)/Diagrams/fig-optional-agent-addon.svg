<svg width="100%" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="14.6485">
  <title>Optional Conversational Agent Add-on</title>
  <rect width="820" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="19.5312" font-weight="bold" fill="#111">Optional Conversational Agent Add-on</text>

  <!-- ====== Real UI box (top-left) ====== -->
  <rect x="50" y="70" width="180" height="75" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="140" y="103" text-anchor="middle" font-size="17.0899" font-weight="bold" fill="#111">Real UI</text>
  <text x="140" y="121" text-anchor="middle" font-size="13.4277" fill="#555">(Primary Path)</text>

  <!-- Arrow and label from Real UI to Express.js API -->
  <line x1="230" y1="107" x2="370" y2="200" stroke="#333" stroke-width="1.5"/>
  <polygon points="366,198 374,204 370,192" fill="#333"/>
  <text x="280" y="148" text-anchor="middle" font-size="12.207" fill="#555">Same</text>
  <text x="280" y="162" text-anchor="middle" font-size="12.207" fill="#555">Express.js API</text>

  <!-- ====== MCP Agent box (bottom-left, dashed) ====== -->
  <rect x="50" y="200" width="180" height="75" rx="6" fill="#f9f9f9" stroke="#555" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="140" y="230" text-anchor="middle" font-size="17.0899" font-weight="bold" fill="#333">MCP Agent</text>
  <text x="140" y="248" text-anchor="middle" font-size="13.4277" fill="#666">(Alternate Path)</text>

  <!-- Arrow and label from MCP Agent to Express.js API -->
  <line x1="230" y1="237" x2="370" y2="220" stroke="#555" stroke-width="1.5" stroke-dasharray="7,4"/>
  <polygon points="366,218 374,224 370,212" fill="#555"/>
  <text x="282" y="247" text-anchor="middle" font-size="12.207" fill="#777">Same</text>
  <text x="282" y="261" text-anchor="middle" font-size="12.207" fill="#777">Express.js API</text>

  <!-- ====== Express.js API box (center) ====== -->
  <rect x="375" y="170" width="175" height="75" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="462" y="202" text-anchor="middle" font-size="17.0899" font-weight="bold" fill="#111">Express.js API</text>
  <text x="462" y="220" text-anchor="middle" font-size="13.4277" fill="#555">(Backend)</text>

  <!-- Arrow from Express.js API to Smart Contracts -->
  <line x1="550" y1="207" x2="615" y2="207" stroke="#333" stroke-width="1.5"/>
  <polygon points="611,203 619,207 611,211" fill="#333"/>

  <!-- ====== Smart Contracts box (right) ====== -->
  <rect x="620" y="170" width="175" height="75" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="707" y="202" text-anchor="middle" font-size="17.0899" font-weight="bold" fill="#111">Smart Contracts</text>
  <text x="707" y="220" text-anchor="middle" font-size="13.4277" fill="#555">(On-chain)</text>

  <!-- ====== Note box (bottom, dashed) ====== -->
  <rect x="50" y="320" width="745" height="80" rx="6" fill="#f9f9f9" stroke="#555" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="422" y="345" text-anchor="middle" font-size="13.4277" font-weight="bold" fill="#111">Note:</text>
  <text x="422" y="363" text-anchor="middle" font-size="12.8174" fill="#333">Both paths (Real UI and MCP Agent) use the same Express.js API and interact with the same</text>
  <text x="422" y="381" text-anchor="middle" font-size="12.8174" fill="#333">smart contracts. The agent does not gate core banking operations.</text>
</svg>
