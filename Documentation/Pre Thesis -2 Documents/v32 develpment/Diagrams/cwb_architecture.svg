  <text class="ts" x="380" y="662" dominant-baseline="central">· PII, KYC documents</text>
  <text class="ts" x="380" y="680" dominant-baseline="central">· SHAP JSON audit logs</text>
  <text class="ts" x="380" y="698" dominant-baseline="central">· ML model outputs &amp; history</text>
  <text class="ts" x="380" y="716" dominant-baseline="central">· Installments, market data</text>
  <text class="ts" x="380" y="734" dominant-baseline="central">· Agent session logs (optional)</text>
  <text class="ts" x="380" y="752" dominant-baseline="central">· Indexed chain events</text>

