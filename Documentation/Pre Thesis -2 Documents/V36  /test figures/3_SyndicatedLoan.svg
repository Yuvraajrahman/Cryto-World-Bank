<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="518" fill="white" stroke="#cccccc" stroke-width="1"/>

  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">SyndicatedLoan — Single-Name Exposure &gt; Ceiling</text>
  <text x="410" y="55" text-anchor="middle" font-size="13" font-style="italic" fill="#333">One lead bank registers the loan; co-lenders join and share interest pro-rata</text>

  <!-- Lead Arranger -->
  <rect x="320" y="85" width="200" height="70" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="420" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Lead Arranger (LB)</text>
  <text x="420" y="133" text-anchor="middle" font-size="11.5" fill="#333">registers loan, holds ≥ 90% commit</text>

  <!-- Co-lenders -->
  <rect x="60" y="215" width="180" height="65" rx="6" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="150" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Co-Lender 1</text>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#333">joins pro-rata</text>

  <rect x="620" y="215" width="180" height="65" rx="6" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="710" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Co-Lender 2</text>
  <text x="710" y="260" text-anchor="middle" font-size="11" fill="#333">joins pro-rata</text>

  <!-- Syndicate pool -->
  <rect x="330" y="215" width="180" height="80" rx="6" fill="#f3f6fc" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="420" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Syndicate</text>
  <text x="420" y="263" text-anchor="middle" font-size="11" fill="#333">contribution registry</text>
  <text x="420" y="279" text-anchor="middle" font-size="11" fill="#333">(commitment ledger)</text>

  <!-- Borrower -->
  <rect x="320" y="420" width="200" height="70" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="420" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Borrower</text>
  <text x="420" y="468" text-anchor="middle" font-size="11.5" fill="#333">receives funds via Lead Arranger</text>

  <!-- Lead to syndicate -->
  <line x1="420" y1="155" x2="420" y2="210" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow3)"/>
  <text x="470" y="185" text-anchor="middle" font-size="11.5" fill="#111">≥ 90% commit</text>

  <!-- Co-lenders to syndicate -->
  <line x1="240" y1="247" x2="325" y2="247" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="282" y="238" text-anchor="middle" font-size="11" fill="#111">pro-rata</text>

  <line x1="620" y1="247" x2="515" y2="247" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="567" y="238" text-anchor="middle" font-size="11" fill="#111">pro-rata</text>

  <!-- Syndicate/Lead/Colenders to borrower -->
  <line x1="150" y1="280" x2="380" y2="418" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <line x1="420" y1="295" x2="420" y2="416" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow3)"/>
  <line x1="710" y1="280" x2="460" y2="418" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="420" y="365" text-anchor="middle" font-size="12" fill="#111">disbursement (pooled)</text>

  <!-- Footer -->
  <text x="410" y="510" text-anchor="middle" font-size="12" fill="#222">Interest and principal repayments flow back through the Lead Arranger, split pro-rata by contribution share.</text>
</svg>
