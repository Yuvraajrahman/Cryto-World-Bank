    <text x="180" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">View On-Chain Proof</text>

    <rect x="280" y="812" width="188" height="40" rx="20" fill="url(#btnGreen)" filter="url(#softShadow)"/>
    <text x="374" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Allocate Capital</text>

    <rect x="484" y="812" width="140" height="40" rx="20" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
    <text x="554" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Export Report</text>

    <rect x="948" y="812" width="148" height="40" rx="20" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.45)" stroke-width="1.2"/>
    <text x="1022" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#fca5a5">Governor Only</text>
  </g>

  <text x="700" y="24" text-anchor="middle" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.35)" font-weight="600">RESERVE TRANSPARENCY WIREFRAME</text>
</svg>
