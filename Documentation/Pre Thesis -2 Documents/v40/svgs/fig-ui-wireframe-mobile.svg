      <rect x="364" y="356" width="88" height="372" rx="0" fill="rgba(234,88,12,0.08)" stroke="rgba(249,115,22,0.25)" stroke-width="1"/>
      <rect x="376" y="372" width="64" height="24" rx="12" fill="rgba(234,88,12,0.2)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
      <text x="408" y="388" text-anchor="middle" font-size="8" font-weight="600" fill="#fdba74">Home</text>
      <text x="408" y="412" text-anchor="middle" font-size="8" fill="#737373">Loans</text>
      <text x="408" y="436" text-anchor="middle" font-size="8" fill="#737373">Payments</text>
      <text x="408" y="460" text-anchor="middle" font-size="8" fill="#737373">Assistant</text>
      <text x="408" y="484" text-anchor="middle" font-size="8" fill="#737373">Profile</text>
      <!-- Tablet main content -->
      <text x="472" y="384" font-size="10" fill="#a3a3a3">REQUEST</text>
      <text x="472" y="404" font-size="14" font-weight="700" fill="#fafafa">Loan application</text>
      <rect x="472" y="418" width="120" height="56" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="484" y="436" font-size="8" fill="#a3a3a3">Amount</text>
      <text x="484" y="456" font-size="12" font-weight="700" fill="#fafafa">500 USDC</text>
      <rect x="604" y="418" width="60" height="56" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="634" y="436" text-anchor="middle" font-size="8" fill="#a3a3a3">Term</text>
      <text x="634" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#fafafa">12 mo</text>
      <rect x="472" y="488" width="192" height="80" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="484" y="508" font-size="8" fill="#a3a3a3">Purpose</text>
      <text x="484" y="528" font-size="10" fill="#d4d4d4">Small business inventory</text>
      <text x="484" y="548" font-size="8" fill="#737373">Collateral-free retail tier</text>
      <rect x="472" y="584" width="92" height="28" rx="14" fill="url(#btnGreen)"/>
      <text x="518" y="602" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Submit</text>
      <rect x="572" y="584" width="92" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="618" y="602" text-anchor="middle" font-size="9" fill="#a3a3a3">Save draft</text>
    </g>

    <!-- Component library sheet -->
    <text x="1040" y="278" text-anchor="middle" font-size="11" letter-spacing="2" fill="#ea580c" font-weight="600">COMPONENT SHEET</text>
    <g filter="url(#softShadow)">
      <rect x="728" y="292" width="624" height="448" rx="16" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="728" y="292" width="624" height="448" rx="16" fill="none" stroke="rgba(234,88,12,0.2)" stroke-width="1"/>

      <text x="752" y="324" font-size="12" font-weight="600" fill="#fafafa">Shared UI components</text>
      <text x="752" y="342" font-size="10" fill="#a3a3a3">Buttons, cards, badges, and navigation pills used across portals</text>

      <!-- Buttons row -->
      <text x="752" y="372" font-size="9" letter-spacing="2" fill="#737373">BUTTONS</text>
      <rect x="752" y="384" width="108" height="32" rx="16" fill="url(#btnBlue)"/>
      <text x="806" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Primary</text>
      <rect x="872" y="384" width="108" height="32" rx="16" fill="url(#btnGreen)"/>
      <text x="926" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Confirm</text>
      <rect x="992" y="384" width="108" height="32" rx="16" fill="url(#btnRed)"/>
      <text x="1046" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Cancel</text>
      <rect x="1112" y="384" width="108" height="32" rx="16" fill="url(#btnOrange)"/>
      <text x="1166" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Escalate</text>
      <rect x="1232" y="384" width="108" height="32" rx="16" fill="rgba(234,88,12,0.12)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
      <text x="1286" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">Outline</text>

      <!-- Cards -->
      <text x="752" y="444" font-size="9" letter-spacing="2" fill="#737373">GLASS CARDS</text>
      <rect x="752" y="456" width="180" height="72" rx="12" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="768" y="478" font-size="9" fill="#a3a3a3">Stat card</text>
      <text x="768" y="500" font-size="16" font-weight="700" fill="#fafafa">1,000 USDC</text>
      <text x="768" y="518" font-size="9" fill="#ea580c">Max borrow</text>
      <rect x="948" y="456" width="180" height="72" rx="12" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="964" y="478" font-size="9" fill="#a3a3a3">Alert card</text>
      <text x="964" y="500" font-size="12" font-weight="600" fill="#fafafa">Review required</text>
      <text x="964" y="518" font-size="9" fill="#737373">AML queue item</text>
      <rect x="1144" y="456" width="180" height="72" rx="12" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
      <text x="1160" y="478" font-size="9" fill="#86efac">Status banner</text>
      <text x="1160" y="500" font-size="12" font-weight="600" fill="#bbf7d0">KYC verified</text>
      <text x="1160" y="518" font-size="9" fill="#86efac">Eligible to apply</text>

      <!-- Badges and pills -->
      <text x="752" y="556" font-size="9" letter-spacing="2" fill="#737373">BADGES AND NAV PILLS</text>
      <rect x="752" y="568" width="72" height="22" rx="11" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
      <text x="788" y="583" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">Active</text>
      <rect x="836" y="568" width="72" height="22" rx="11" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.35)" stroke-width="1"/>
      <text x="872" y="583" text-anchor="middle" font-size="9" font-weight="600" fill="#93c5fd">Online</text>
      <rect x="920" y="568" width="88" height="22" rx="11" fill="rgba(234,88,12,0.2)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
      <text x="964" y="583" text-anchor="middle" font-size="9" font-weight="600" fill="#fdba74">Nav active</text>
      <rect x="1020" y="568" width="88" height="22" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="1064" y="583" text-anchor="middle" font-size="9" fill="#737373">Nav idle</text>
      <rect x="1120" y="568" width="100" height="22" rx="11" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.35)" stroke-width="1"/>
      <text x="1170" y="583" text-anchor="middle" font-size="9" font-weight="600" fill="#fca5a5">High risk</text>

      <!-- Form inputs -->
      <text x="752" y="618" font-size="9" letter-spacing="2" fill="#737373">FORM INPUTS</text>
      <rect x="752" y="630" width="280" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="768" y="652" font-size="10" fill="#737373">Loan amount (USDC)</text>
      <rect x="1048" y="630" width="140" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(234,88,12,0.4)" stroke-width="1.2"/>
      <text x="1064" y="652" font-size="10" fill="#fafafa">500</text>
      <rect x="1200" y="630" width="140" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="1216" y="652" font-size="10" fill="#737373">Select term</text>

      <!-- Wallet chip -->
      <text x="752" y="692" font-size="9" letter-spacing="2" fill="#737373">WALLET CHIP</text>
      <rect x="752" y="704" width="148" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="768" cy="718" r="4" fill="#22c55e"/>
      <text x="780" y="722" font-size="10" fill="#d4d4d4">0x7a3f...9c2e</text>
    </g>

    <!-- Desktop nav strip (mini preview) -->
    <text x="72" y="778" font-size="11" letter-spacing="2" fill="#ea580c" font-weight="600">DESKTOP TOP NAV (PREVIEW)</text>
    <g filter="url(#softShadow)">
      <rect x="72" y="792" width="1256" height="52" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="100" cy="818" r="14" fill="url(#orangeAccent)"/>
      <text x="100" y="822" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">C</text>
      <text x="124" y="814" font-size="14" font-weight="700" fill="#fafafa">Crypto World Bank</text>
      <text x="124" y="828" font-size="9" fill="#737373">Full horizontal navigation at wide breakpoints</text>
      <rect x="420" y="804" width="56" height="24" rx="12" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
      <text x="448" y="820" text-anchor="middle" font-size="9" font-weight="600" fill="#fdba74">Apply</text>
      <text x="496" y="820" font-size="9" fill="#737373">Loans</text>
      <text x="544" y="820" font-size="9" fill="#737373">Payments</text>
      <text x="608" y="820" font-size="9" fill="#737373">Assistant</text>
      <text x="672" y="820" font-size="9" fill="#737373">Profile</text>
      <rect x="1080" y="802" width="120" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="1096" cy="816" r="4" fill="#22c55e"/>
      <text x="1108" y="820" font-size="9" fill="#d4d4d4">0x7a3f...9c2e</text>
      <rect x="1212" y="800" width="100" height="32" rx="16" fill="url(#btnBlue)"/>
      <text x="1262" y="820" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Connect Wallet</text>
    </g>
  </g>
</svg>
