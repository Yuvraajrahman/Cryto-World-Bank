    <text x="500" y="804" font-size="10" fill="#a3a3a3">$1,200</text>
    <text x="610" y="804" font-size="10" fill="#a3a3a3">$980</text>
    <text x="720" y="804" font-size="10" fill="#fca5a5">-18%</text>

