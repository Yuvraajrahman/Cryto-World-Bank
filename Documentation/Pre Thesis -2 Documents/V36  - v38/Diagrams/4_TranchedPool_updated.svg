<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="498" fill="white" stroke="#cccccc" stroke-width="1"/>

  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">TranchedPool — Senior / Junior Waterfall</text>
  <text x="410" y="55" text-anchor="middle" font-size="13" font-style="italic" fill="#333">Junior share limited to 10–30% of the pool; senior is paid first</text>

  <!-- Senior -->
  <rect x="130" y="90" width="220" height="75" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="240" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Senior Tranche</text>
  <text x="240" y="138" text-anchor="middle" font-size="11.5" fill="#333">low risk, low return</text>
  <text x="240" y="153" text-anchor="middle" font-size="11.5" fill="#333">paid first</text>

  <!-- Junior -->
  <rect x="470" y="90" width="220" height="75" rx="6" fill="#f6e3d8" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="580" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Junior Tranche</text>
  <text x="580" y="138" text-anchor="middle" font-size="11.5" fill="#333">high risk, high return</text>
  <text x="580" y="153" text-anchor="middle" font-size="11.5" fill="#333">first-loss, 10–30% cap</text>

  <!-- Pool -->
  <rect x="310" y="225" width="200" height="80" rx="6" fill="#f3f6fc" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="410" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">TranchedPool</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" fill="#333">aggregated capital</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#333">senior + junior deposits</text>

  <!-- Borrower -->
  <rect x="320" y="400" width="180" height="70" rx="6" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="410" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Borrower</text>
  <text x="410" y="448" text-anchor="middle" font-size="11.5" fill="#333">receives pooled funds</text>

  <!-- Arrows -->
  <line x1="270" y1="165" x2="370" y2="222" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow4)"/>
  <text x="270" y="200" text-anchor="middle" font-size="12" fill="#111">deposit</text>

  <line x1="550" y1="165" x2="450" y2="222" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow4)"/>
  <text x="555" y="200" text-anchor="middle" font-size="12" fill="#111">deposit</text>

  <line x1="410" y1="305" x2="410" y2="396" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="470" y="355" text-anchor="middle" font-size="12" fill="#111">loan disbursement</text>

  <!-- Waterfall label back up -->
  <line x1="325" y1="396" x2="170" y2="170" stroke="#555" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow4)"/>
  <text x="221" y="301" text-anchor="middle" font-size="11.5" fill="#333" transform="rotate(-124.4 221 301)">repayment: senior first</text>

  <line x1="495" y1="396" x2="650" y2="170" stroke="#555" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow4)"/>
  <text x="599" y="301" text-anchor="middle" font-size="11.5" fill="#333" transform="rotate(-55.6 599 301)">residual: junior last</text>

  <!-- Footer -->
  <text x="410" y="490" text-anchor="middle" font-size="12" fill="#222">Waterfall: senior principal + interest is paid out first; junior absorbs losses first but keeps any residual upside.</text>
</svg>
