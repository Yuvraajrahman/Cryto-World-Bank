# ============================================================================
# LEGACY / OPTIONAL (disabled by default as of 2026-08-03)
# ============================================================================
# Neon is now the PRIMARY database for the whole app (see backend/.env). This
# container is kept only so the old "local Postgres is primary" mode can be
# restored later without rewriting config from scratch — see the restore
# instructions in backend/.env and backend/.env.local.
#
# `scripts/start-everything.sh` no longer runs `docker compose up -d`
# automatically. Nothing needs this container to be running for the app
# (website, backend API, transactions) to work normally.
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: cwb-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cwb
      POSTGRES_PASSWORD: cwb
      POSTGRES_DB: crypto_world_bank
    volumes:
      - cwb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwb -d crypto_world_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cwb_pg_data:
