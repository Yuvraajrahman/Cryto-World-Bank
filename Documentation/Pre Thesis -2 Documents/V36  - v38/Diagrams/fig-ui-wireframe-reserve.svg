    <rect x="96" y="746" width="752" height="20" rx="10" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="96" y="746" width="556" height="20" rx="10" fill="rgba(34,197,94,0.55)"/>
    <line x1="208" y1="742" x2="208" y2="770" stroke="#ef4444" stroke-width="2"/>
    <text x="208" y="738" text-anchor="middle" font-size="9" fill="#fca5a5">15% min</text>
    <text x="820" y="760" text-anchor="end" font-size="10" fill="#86efac">18.5% current</text>

    <rect x="96" y="778" width="752" height="36" rx="10" fill="rgba(37,99,235,0.10)" stroke="rgba(59,130,246,0.28)" stroke-width="1"/>
    <text x="112" y="800" font-size="11" fill="#93c5fd">Proof of Reserve: on-chain attestation available - Chainlink PoR planned for production</text>

