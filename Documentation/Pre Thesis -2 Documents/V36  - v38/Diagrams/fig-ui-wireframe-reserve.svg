    <text x="940" y="460" font-size="22" font-weight="700" fill="#fafafa">National Banks</text>

    <rect x="940" y="478" width="364" height="64" rx="12" fill="rgba(234,88,12,0.10)" stroke="rgba(249,115,22,0.30)" stroke-width="1"/>
    <text x="956" y="502" font-size="12" font-weight="600" fill="#fafafa">Bangladesh National Bank</text>
    <text x="956" y="520" font-size="10" fill="#a3a3a3">BD | 5 Local Banks registered</text>
    <text x="1288" y="512" text-anchor="end" font-size="13" font-weight="600" fill="#fdba74" font-family="ui-monospace, monospace">4.20M</text>

    <rect x="940" y="552" width="364" height="64" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="576" font-size="12" font-weight="600" fill="#fafafa">Kenya National Bank</text>
    <text x="956" y="594" font-size="10" fill="#a3a3a3">KE | 4 Local Banks registered</text>
    <text x="1288" y="586" text-anchor="end" font-size="13" font-weight="600" fill="#93c5fd" font-family="ui-monospace, monospace">3.10M</text>

    <rect x="940" y="626" width="364" height="64" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="650" font-size="12" font-weight="600" fill="#fafafa">Vietnam National Bank</text>
    <text x="956" y="668" font-size="10" fill="#a3a3a3">VN | 3 Local Banks registered</text>
    <text x="1288" y="660" text-anchor="end" font-size="13" font-weight="600" fill="#86efac" font-family="ui-monospace, monospace">2.50M</text>

    <line x1="940" y1="708" x2="1304" y2="708" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

    <text x="940" y="732" font-size="11" font-weight="600" fill="#d4d4d4">Tier 1 lending APR</text>
    <rect x="940" y="740" width="364" height="38" rx="10" fill="rgba(234,88,12,0.12)" stroke="rgba(249,115,22,0.35)" stroke-width="1"/>
    <text x="956" y="764" font-size="12" fill="#fdba74">World to National downward rate</text>
    <text x="1288" y="764" text-anchor="end" font-size="14" font-weight="700" fill="#fdba74">3.00%</text>

    <circle cx="952" cy="798" r="5" fill="#22c55e"/>
    <text x="966" y="802" font-size="11" fill="#d4d4d4">Public read access for all actor tiers</text>

    <!-- Action buttons -->
