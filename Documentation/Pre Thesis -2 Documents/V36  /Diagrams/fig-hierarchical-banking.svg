<svg viewBox="0 0 1000 1250" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', 'Latin Modern Roman', serif">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3a55"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
    <marker id="arrowSolid" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1b263b"/>
    </marker>
    <marker id="arrowDotted" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3d6d99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1250" fill="#ffffff"/>

  <line x1="90" y1="120" x2="90" y2="965" stroke="#b9c4d4" stroke-width="2" stroke-dasharray="1,5" stroke-linecap="round"/>

  <rect x="180" y="60" width="640" height="120" rx="10" fill="#cfe0f5" stroke="#1b263b" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="500" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b263b">World Bank Reserve (Tier 1)</text>
  <text x="500" y="150" text-anchor="middle" font-size="20" fill="#333333">global reserve, reserve ratio</text>
  <circle cx="90" cy="120" r="26" fill="url(#badgeGrad)" filter="url(#softShadow)"/>
  <text x="90" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text>

  <line x1="330" y1="180" x2="330" y2="340" stroke="#1b263b" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <line x1="670" y1="340" x2="670" y2="180" stroke="#3d6d99" stroke-width="2" stroke-dasharray="2,6" stroke-linecap="round" marker-end="url(#arrowDotted)"/>
  <text x="320" y="264" text-anchor="end" font-size="18" fill="#1b263b">capital allocation</text>
  <text x="680" y="264" text-anchor="start" font-size="18" font-style="italic" fill="#3d6d99">yield / upward deposit</text>

  <rect x="230" y="340" width="540" height="110" rx="10" fill="#dbe9f9" stroke="#1b263b" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="500" y="385" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b263b">National Bank (Tier 2)</text>
  <text x="500" y="420" text-anchor="middle" font-size="20" fill="#333333">regional allocation</text>
  <circle cx="90" cy="395" r="26" fill="url(#badgeGrad)" filter="url(#softShadow)"/>
  <text x="90" y="403" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text>

  <line x1="330" y1="450" x2="330" y2="600" stroke="#1b263b" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <line x1="670" y1="600" x2="670" y2="450" stroke="#3d6d99" stroke-width="2" stroke-dasharray="2,6" stroke-linecap="round" marker-end="url(#arrowDotted)"/>
  <text x="320" y="533" text-anchor="end" font-size="18" fill="#1b263b">capital allocation</text>
  <text x="680" y="533" text-anchor="start" font-size="18" font-style="italic" fill="#3d6d99">yield / upward deposit</text>

  <rect x="180" y="600" width="640" height="150" rx="10" fill="#e6f0fb" stroke="#1b263b" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="500" y="640" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b263b">Local Bank (Tier 3)</text>
  <text x="500" y="676" text-anchor="middle" font-size="20" fill="#333333">retail lending,</text>
  <text x="500" y="711" text-anchor="middle" font-size="20" fill="#333333">InsuranceFund</text>
  <circle cx="90" cy="675" r="26" fill="url(#badgeGrad)" filter="url(#softShadow)"/>
  <text x="90" y="683" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3</text>

  <line x1="300" y1="750" x2="300" y2="900" stroke="#1b263b" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <line x1="460" y1="900" x2="460" y2="750" stroke="#3d6d99" stroke-width="2" stroke-dasharray="2,6" stroke-linecap="round" marker-end="url(#arrowDotted)"/>
  <line x1="760" y1="750" x2="760" y2="900" stroke="#3d6d99" stroke-width="2" stroke-dasharray="2,6" stroke-linecap="round" marker-end="url(#arrowDotted)"/>
  <text x="290" y="820" text-anchor="end" font-size="18" fill="#1b263b">loan disbursement</text>
  <text x="470" y="820" text-anchor="start" font-size="18" font-style="italic" fill="#3d6d99">installment repayment</text>
  <text x="770" y="820" text-anchor="start" font-size="18" font-style="italic" fill="#3d6d99">on default</text>

  <rect x="140" y="900" width="360" height="130" rx="10" fill="#ffffff" stroke="#1b263b" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="320" y="948" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b263b">Client (Tier 4)</text>
  <text x="320" y="984" text-anchor="middle" font-size="20" fill="#333333">individual / group / SME</text>
  <circle cx="90" cy="965" r="26" fill="url(#badgeGrad)" filter="url(#softShadow)"/>
  <text x="90" y="973" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">4</text>

  <rect x="580" y="900" width="420" height="290" rx="10" fill="#f0f0f0" stroke="#1b263b" stroke-width="1.5" stroke-dasharray="7,4" filter="url(#softShadow)"/>
  <text x="610" y="946" text-anchor="start" font-size="21" font-weight="bold" fill="#1b263b">Default cascade</text>
  <text x="610" y="976" text-anchor="start" font-size="18" fill="#333333">(on borrower default)</text>
  <line x1="610" y1="992" x2="950" y2="992" stroke="#c7c7c7" stroke-width="1"/>
  <text x="610" y="1027" text-anchor="start" font-size="18" fill="#333333">1.  Local Bank reserve buffer</text>
  <text x="610" y="1060" text-anchor="start" font-size="18" fill="#333333">2.  InsuranceFund draw</text>
  <text x="610" y="1093" text-anchor="start" font-size="18" fill="#333333">3.  parent tier absorbs residual</text>
  <text x="633" y="1123" text-anchor="start" font-size="18" fill="#333333">+ role suspension</text>

  <line x1="260" y1="1222" x2="305" y2="1222" stroke="#1b263b" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="315" y="1227" text-anchor="start" font-size="16" fill="#1b263b">capital / loan flow</text>
  <line x1="560" y1="1222" x2="605" y2="1222" stroke="#3d6d99" stroke-width="2" stroke-dasharray="2,6" stroke-linecap="round" marker-end="url(#arrowDotted)"/>
  <text x="615" y="1227" text-anchor="start" font-size="16" font-style="italic" fill="#3d6d99">yield / repayment / default flow</text>
</svg>
