<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1100" height="780" fill="white"/>

  <!-- Layer 5: Operations -->
  <rect x="20" y="20" width="820" height="110" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <rect x="20" y="20" width="195" height="110" rx="4" fill="#222" stroke="#222" stroke-width="1"/>
  <text x="118" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Layer 5</text>
  <text x="118" y="76" text-anchor="middle" font-size="12" fill="white">Operations Layer</text>
  <text x="118" y="93" text-anchor="middle" font-size="10" fill="#ccc">(Governance &amp;</text>
  <text x="118" y="108" text-anchor="middle" font-size="10" fill="#ccc">Operational Security)</text>
  <line x1="215" y1="20" x2="215" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="228" y="42" font-size="11" font-weight="bold" fill="#111">Key Controls</text>
  <text x="235" y="58" font-size="10.5" fill="#222">• Safe multisig governance for critical actions</text>
  <text x="235" y="73" font-size="10.5" fill="#222">• Key rotation and secure secrets management</text>
  <text x="235" y="88" font-size="10.5" fill="#222">• Bug-bounty program and responsible disclosure</text>
  <text x="235" y="103" font-size="10.5" fill="#222">• Runbooks, access reviews, and incident response</text>
  <line x1="630" y1="20" x2="630" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="642" y="55" font-size="10.5" fill="#333">Operational controls and human</text>
  <text x="642" y="70" font-size="10.5" fill="#333">processes that protect keys, systems,</text>
  <text x="642" y="85" font-size="10.5" fill="#333">and organizational access.</text>

  <!-- Layer 4: Runtime -->
  <rect x="20" y="148" width="820" height="110" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <rect x="20" y="148" width="195" height="110" rx="4" fill="#222" stroke="#222" stroke-width="1"/>
  <text x="118" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Layer 4</text>
  <text x="118" y="204" text-anchor="middle" font-size="12" fill="white">Runtime Layer</text>
  <text x="118" y="221" text-anchor="middle" font-size="10" fill="#ccc">(Monitoring &amp;</text>
  <text x="118" y="236" text-anchor="middle" font-size="10" fill="#ccc">Observability)</text>
  <line x1="215" y1="148" x2="215" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="228" y="170" font-size="11" font-weight="bold" fill="#111">Key Controls</text>
  <text x="235" y="186" font-size="10.5" fill="#222">• Tenderly real-time monitoring and simulation</text>
  <text x="235" y="201" font-size="10.5" fill="#222">• The Graph indexing for on-chain data and alerts</text>
  <text x="235" y="216" font-size="10.5" fill="#222">• WebSocket dashboard for live system visibility</text>
  <text x="235" y="231" font-size="10.5" fill="#222">• Anomaly detection and alerting on critical events</text>
  <line x1="630" y1="148" x2="630" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="642" y="183" font-size="10.5" fill="#333">Real-time visibility and anomaly</text>
  <text x="642" y="198" font-size="10.5" fill="#333">detection across the system</text>
  <text x="642" y="213" font-size="10.5" fill="#333">to identify and respond to</text>
  <text x="642" y="228" font-size="10.5" fill="#333">threats quickly.</text>

  <!-- Layer 3: AI/ML -->
  <rect x="20" y="276" width="820" height="110" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <rect x="20" y="276" width="195" height="110" rx="4" fill="#222" stroke="#222" stroke-width="1"/>
  <text x="118" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Layer 3</text>
  <text x="118" y="332" text-anchor="middle" font-size="12" fill="white">AI / ML Layer</text>
  <text x="118" y="349" text-anchor="middle" font-size="10" fill="#ccc">(Model Integrity &amp;</text>
  <text x="118" y="364" text-anchor="middle" font-size="10" fill="#ccc">Explainability)</text>
  <line x1="215" y1="276" x2="215" y2="386" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="228" y="298" font-size="11" font-weight="bold" fill="#111">Key Controls</text>
  <text x="235" y="314" font-size="10.5" fill="#222">• Chainlink Functions oracle for secure off-chain execution</text>
  <text x="235" y="329" font-size="10.5" fill="#222">• Model registry and version control</text>
  <text x="235" y="344" font-size="10.5" fill="#222">• SHAP-based explainability for all model decisions</text>
  <text x="235" y="359" font-size="10.5" fill="#222">• Hallucination guard and output validation</text>
  <line x1="630" y1="276" x2="630" y2="386" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="642" y="311" font-size="10.5" fill="#333">Ensures trustworthy AI/ML</text>
  <text x="642" y="326" font-size="10.5" fill="#333">decisions with verifiable models</text>
  <text x="642" y="341" font-size="10.5" fill="#333">and explainable, validated</text>
  <text x="642" y="356" font-size="10.5" fill="#333">outputs.</text>

  <!-- Layer 2: Application -->
  <rect x="20" y="404" width="820" height="110" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <rect x="20" y="404" width="195" height="110" rx="4" fill="#222" stroke="#222" stroke-width="1"/>
  <text x="118" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Layer 2</text>
  <text x="118" y="460" text-anchor="middle" font-size="12" fill="white">Application Layer</text>
  <text x="118" y="477" text-anchor="middle" font-size="10" fill="#ccc">(API &amp; Application</text>
  <text x="118" y="492" text-anchor="middle" font-size="10" fill="#ccc">Security)</text>
  <line x1="215" y1="404" x2="215" y2="514" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="228" y="426" font-size="11" font-weight="bold" fill="#111">Key Controls</text>
  <text x="235" y="442" font-size="10.5" fill="#222">• EIP-712 typed data sign-in to prevent replay/phishing</text>
  <text x="235" y="457" font-size="10.5" fill="#222">• JWT-based authentication and session management</text>
  <text x="235" y="472" font-size="10.5" fill="#222">• Rate limiting and throttling on all API endpoints</text>
  <text x="235" y="487" font-size="10.5" fill="#222">• Input validation and server-side authorization</text>
  <line x1="630" y1="404" x2="630" y2="514" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="642" y="439" font-size="10.5" fill="#333">Protects application endpoints</text>
  <text x="642" y="454" font-size="10.5" fill="#333">and user sessions from abuse,</text>
  <text x="642" y="469" font-size="10.5" fill="#333">impersonation, and overload.</text>

  <!-- Layer 1: Smart Contract -->
  <rect x="20" y="532" width="820" height="130" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <rect x="20" y="532" width="195" height="130" rx="4" fill="#222" stroke="#222" stroke-width="1"/>
  <text x="118" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Layer 1</text>
  <text x="118" y="590" text-anchor="middle" font-size="12" fill="white">Smart Contract Layer</text>
  <text x="118" y="607" text-anchor="middle" font-size="10" fill="#ccc">(On-Chain Security &amp;</text>
  <text x="118" y="622" text-anchor="middle" font-size="10" fill="#ccc">Correctness)</text>
  <line x1="215" y1="532" x2="215" y2="662" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="228" y="554" font-size="11" font-weight="bold" fill="#111">Key Controls</text>
  <text x="235" y="570" font-size="10.5" fill="#222">• OpenZeppelin v5 libraries for secure primitives</text>
  <text x="235" y="585" font-size="10.5" fill="#222">• UUPS upgradeable proxy pattern</text>
  <text x="235" y="600" font-size="10.5" fill="#222">• TimeLock for privileged operations</text>
  <text x="428" y="570" font-size="10.5" fill="#222">• RBAC for role-based access control</text>
  <text x="428" y="585" font-size="10.5" fill="#222">• ReentrancyGuard and checks-effects-interactions</text>
  <text x="428" y="600" font-size="10.5" fill="#222">• Comprehensive audit suite (Slither, Echidna,</text>
  <text x="428" y="614" font-size="10.5" fill="#222">  Foundry, MythX)</text>
  <line x1="630" y1="532" x2="630" y2="662" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="642" y="565" font-size="10.5" fill="#333">Secure, upgradeable, and</text>
  <text x="642" y="580" font-size="10.5" fill="#333">audited smart contracts form</text>
  <text x="642" y="595" font-size="10.5" fill="#333">the ultimate trust boundary</text>
  <text x="642" y="610" font-size="10.5" fill="#333">for assets and state.</text>

  <!-- ON-CHAIN ASSETS box -->
  <rect x="200" y="695" width="460" height="50" rx="4" fill="#ddd" stroke="#555" stroke-width="1.5"/>
  <text x="430" y="715" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">ON-CHAIN ASSETS &amp; STATE</text>
  <text x="430" y="732" text-anchor="middle" font-size="11" fill="#333">Blockchain Network (e.g., Polygon zkEVM)</text>

  <!-- Down arrow from Layer 1 to ON-CHAIN -->
  <line x1="430" y1="662" x2="430" y2="695" stroke="#333" stroke-width="2"/>
  <polygon points="430,695 424,682 436,682" fill="#333"/>

  <!-- Up arrows on the right side of layers (dashed) -->
  <!-- Arrow Layer 2 -> Layer 3 -->
  <line x1="870" y1="514" x2="870" y2="404" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="870,404 864,417 876,417" fill="#555"/>
  <!-- Arrow Layer 3 -> Layer 4 -->
  <line x1="870" y1="386" x2="870" y2="276" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="870,276 864,289 876,289" fill="#555"/>
  <!-- Arrow Layer 4 -> Layer 5 -->
  <line x1="870" y1="258" x2="870" y2="148" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="870,148 864,161 876,161" fill="#555"/>
  <!-- Arrow Layer 1 pointing up to Layer 2 (just inside) -->
  <line x1="870" y1="640" x2="870" y2="514" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="870,514 864,527 876,527" fill="#555"/>

  <!-- Right-side note box -->
  <rect x="900" y="300" width="185" height="120" rx="4" fill="white" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="993" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">To breach the</text>
  <text x="993" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Smart Contract</text>
  <text x="993" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Layer (Layer 1),</text>
  <text x="993" y="376" text-anchor="middle" font-size="11" fill="#333">an attacker must</text>
  <text x="993" y="394" text-anchor="middle" font-size="11" fill="#333">compromise</text>
  <text x="993" y="410" text-anchor="middle" font-size="11" fill="#333">every layer above it.</text>

  <!-- Lines connecting the note box to the arrows -->
  <line x1="900" y1="360" x2="870" y2="360" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
