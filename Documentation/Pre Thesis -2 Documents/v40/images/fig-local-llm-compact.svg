<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a38" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="698" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">AI Agent Request Path</text>

  <!-- Row 1: top chain -->
  <rect x="15" y="70" width="150" height="90" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="90" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Client</text>
  <text x="90" y="128" text-anchor="middle" font-size="11" fill="#333">(authenticated wallet)</text>

  <rect x="180" y="70" width="175" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="267" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">React UI</text>
  <text x="267" y="122" text-anchor="middle" font-size="11" fill="#333">(thin client,</text>
  <text x="267" y="138" text-anchor="middle" font-size="11" fill="#333">streaming chat)</text>

  <rect x="370" y="70" width="290" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="515" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Express API</text>
  <text x="515" y="112" text-anchor="middle" font-size="11" fill="#333">on-chain context injection</text>
  <text x="515" y="127" text-anchor="middle" font-size="11" fill="#333">(eth_call, 200 ms timeout)</text>
  <text x="515" y="142" text-anchor="middle" font-size="11" fill="#333">+ prompt-injection scan (L2)</text>

  <rect x="675" y="70" width="310" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="830" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Qwen3-8B</text>
  <text x="830" y="118" text-anchor="middle" font-size="11" fill="#333">(llama.cpp, Q4_K_M)</text>
  <text x="830" y="138" text-anchor="middle" font-size="11" fill="#333">MCP tool selection</text>

  <!-- Row1 arrows -->
  <line x1="165" y1="115" x2="176" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a38)"/>
  <line x1="355" y1="115" x2="366" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a38)"/>
  <line x1="660" y1="115" x2="671" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a38)"/>

  <!-- connector down to diamond -->
  <line x1="830" y1="160" x2="830" y2="213" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a38)"/>

  <!-- Diamond -->
  <polygon points="830,215 908,270 830,325 752,270" fill="#f0f0f0" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="830" y="265" text-anchor="middle" font-size="13" fill="#111">Read or write</text>
  <text x="830" y="281" text-anchor="middle" font-size="13" fill="#111">tool?</text>

  <!-- branch lines -->
  <line x1="770" y1="290" x2="230" y2="385" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a38)"/>
  <text x="500" y="345" text-anchor="middle" font-size="12" fill="#222">read</text>

  <line x1="830" y1="325" x2="430" y2="385" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a38)"/>
  <text x="660" y="360" text-anchor="middle" font-size="12" fill="#222">write</text>

  <!-- Read box -->
  <rect x="40" y="390" width="290" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="185" y="425" text-anchor="middle" font-size="13" fill="#111">Read tool → query API /</text>
  <text x="185" y="445" text-anchor="middle" font-size="13" fill="#111">DB → grounded answer</text>

  <!-- Write chain (horizontal) -->
  <rect x="345" y="390" width="145" height="90" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="417" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Human</text>
  <text x="417" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">confirmation gate</text>
  <text x="417" y="456" text-anchor="middle" font-size="10.5" fill="#333">(affirmative consent)</text>

  <rect x="505" y="390" width="145" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="577" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">EIP-7702</text>
  <text x="577" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">session key</text>
  <text x="577" y="456" text-anchor="middle" font-size="10.5" fill="#333">(scoped, capped, 24h)</text>

  <rect x="660" y="390" width="145" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="732" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Smart-contract</text>
  <text x="732" y="444" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">transaction</text>

  <rect x="815" y="390" width="170" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="900" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">AGENT_ACTION_LOG</text>
  <text x="900" y="446" text-anchor="middle" font-size="10.5" fill="#333">(append-only)</text>

  <!-- write chain arrows -->
  <line x1="490" y1="435" x2="501" y2="435" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a38)"/>
  <line x1="650" y1="435" x2="656" y2="435" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a38)"/>
  <line x1="805" y1="435" x2="811" y2="435" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a38)"/>

  <!-- merge to final box -->
  <line x1="185" y1="480" x2="185" y2="530" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="900" y1="480" x2="900" y2="530" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="185" y1="530" x2="900" y2="530" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="542" y1="530" x2="542" y2="558" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a38)"/>

  <rect x="402" y="560" width="280" height="65" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="542" y="598" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Streamed response to client</text>

  <text x="500" y="655" text-anchor="middle" font-size="12" fill="#222">Read tools return grounded answers directly; write tools require explicit consent,</text>
  <text x="500" y="673" text-anchor="middle" font-size="12" fill="#222">a scoped session key, and an append-only action log before executing on-chain.</text>
</svg>
