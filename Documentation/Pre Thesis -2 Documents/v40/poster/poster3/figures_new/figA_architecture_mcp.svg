  <rect width="1560" height="760" fill="url(#bgA)"/>
  <text x="780" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1f3864">Four-Layer System Architecture + Connected Services</text>
  <text x="780" y="56" text-anchor="middle" font-size="13" fill="#5a738c">UI · MCP agent · ML oracle · persistence · on-chain hierarchy (Ch. 4)</text>

  <!-- L4 -->
  <rect x="40" y="75" width="1040" height="135" rx="14" fill="#cfe5f7" stroke="#1f3864" stroke-width="1.5"/>
  <circle cx="85" cy="115" r="24" fill="url(#badgeA)"/>
  <text x="85" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L4</text>
  <rect x="125" y="96" width="28" height="20" rx="3" fill="none" stroke="#1f3864" stroke-width="2"/>
  <path d="M132 122 h14 M139 116 v6" stroke="#1f3864" stroke-width="2" stroke-linecap="round"/>
  <text x="165" y="108" font-size="18" font-weight="700" fill="#1f3864">Presentation</text>
  <text x="165" y="128" font-size="12" fill="#334e68">React / TypeScript / Wagmi / RainbowKit</text>

  <rect x="125" y="142" width="210" height="52" rx="10" fill="#ffffff" stroke="#1f5f9a"/>
