    <text x="520" y="532" font-size="13" font-weight="600" fill="#fafafa">12 months</text>
    <text x="640" y="514" font-size="11" fill="#a3a3a3">APR</text>
    <text x="640" y="532" font-size="13" font-weight="600" fill="#fdba74">8.00%</text>
