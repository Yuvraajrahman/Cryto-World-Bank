  <text x="150" y="296" text-anchor="middle" font-size="13" fill="#111">within minutes</text>

  <line x1="150" y1="205" x2="150" y2="243" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a34)"/>

  <rect x="280" y="105" width="190" height="100" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="375" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">4-of-7 Security</text>
  <text x="375" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Council Safe</text>
  <text x="375" y="165" text-anchor="middle" font-size="11" fill="#333">pause / upgrade / revoke</text>
  <text x="375" y="180" text-anchor="middle" font-size="11" fill="#333">roles within 2h</text>

