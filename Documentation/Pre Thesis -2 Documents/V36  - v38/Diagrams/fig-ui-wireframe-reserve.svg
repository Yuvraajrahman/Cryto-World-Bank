    <rect x="48" y="128" width="1304" height="52" rx="14" fill="rgba(34,197,94,0.10)" stroke="rgba(34,197,94,0.35)" stroke-width="1.2"/>
    <circle cx="82" cy="154" r="12" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-width="1.2"/>
    <path d="M 77 154 L 80 157 L 87 150" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="150" font-size="13" font-weight="600" fill="#bbf7d0">Public reserve summary - on-chain verified</text>
    <text x="106" y="166" font-size="11" fill="#86efac">getReserveSummary() synced from WorldBankReserve contract</text>
    <rect x="1188" y="142" width="148" height="24" rx="12" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="1262" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Live on Sepolia</text>

