    <rect x="908" y="396" width="420" height="432" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="932" y="434" font-size="10" letter-spacing="2" fill="#a3a3a3">DECISION PANEL</text>
    <text x="932" y="460" font-size="22" font-weight="700" fill="#fafafa">Risk overview</text>

    <!-- Risk gauge -->
    <circle cx="1118" cy="530" r="54" fill="rgba(234,88,12,0.10)" stroke="rgba(249,115,22,0.45)" stroke-width="3"/>
    <text x="1118" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#fdba74">0.42</text>
    <text x="1118" y="546" text-anchor="middle" font-size="10" fill="#a3a3a3">composite s</text>

    <rect x="932" y="598" width="372" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="948" y="622" font-size="12" fill="#a3a3a3">Fraud probability</text>
    <text x="1288" y="622" text-anchor="end" font-size="13" font-weight="600" fill="#fafafa" font-family="ui-monospace, monospace">0.31</text>

    <rect x="932" y="644" width="372" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="948" y="668" font-size="12" fill="#a3a3a3">Isolation Forest flag</text>
    <text x="1288" y="668" text-anchor="end" font-size="13" font-weight="600" fill="#86efac" font-family="ui-monospace, monospace">Normal</text>

    <rect x="932" y="690" width="372" height="38" rx="10" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
    <text x="948" y="714" font-size="12" fill="#bbf7d0">Oracle gate</text>
    <text x="1288" y="714" text-anchor="end" font-size="13" font-weight="600" fill="#86efac" font-family="ui-monospace, monospace">SCORE_REVEALED</text>

    <text x="932" y="752" font-size="11" font-weight="600" fill="#d4d4d4">Rejection reason (optional)</text>
    <rect x="932" y="760" width="372" height="36" rx="10" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="948" y="783" font-size="12" fill="#737373">e.g. unverified income</text>

  </g>

  <!-- Action buttons (outside clip so they sit at bottom) -->
  <g>
    <rect x="120" y="812" width="132" height="40" rx="20" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="186" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">View Documents</text>

    <rect x="948" y="812" width="168" height="40" rx="20" fill="url(#btnGreen)" filter="url(#softShadow)"/>
    <text x="1032" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Approve Loan</text>

    <rect x="1132" y="812" width="120" height="40" rx="20" fill="url(#btnRed)" opacity="0.92"/>
    <text x="1192" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Decline</text>

    <rect x="1268" y="812" width="148" height="40" rx="20" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
    <text x="1342" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Export Brief</text>
  </g>

  <text x="700" y="24" text-anchor="middle" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.35)" font-weight="600">APPROVER DASHBOARD WIREFRAME</text>
</svg>
