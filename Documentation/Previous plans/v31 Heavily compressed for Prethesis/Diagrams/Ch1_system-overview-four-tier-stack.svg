<text class="sm" x="32" y="350" text-anchor="middle" fill="#000000">Local</text>

<rect x="2" y="464" width="60" height="22" rx="3" fill="#aaaaaa"/>
<text class="sm" x="32" y="475" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Tier 4</text>
<text class="sm" x="32" y="495" text-anchor="middle" fill="#000000">Client</text>

