  <text x="75" y="572" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">CHAINLINK</text>
  <text x="75" y="586" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">INFRASTRUCTURE</text>
  <text x="75" y="600" text-anchor="middle" font-size="10" fill="#bbb">(Oracle &amp; Automation)</text>

  <rect x="155" y="524" width="590" height="90" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
