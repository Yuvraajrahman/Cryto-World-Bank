# CWB ML pipeline — MacBook Air M4, 16 GB (portable fallback)

device:
  name: macOS Apple M4
  profile: mac-m4-air-16gb
  notes: Portable fallback if Ubuntu unavailable; thermals limited — smaller SHAP batch

dataset:
  name: BCCC-DeFiFraudTrans-2025
  request_page: https://www.yorku.ca/research/bccc/ucs-technical/cybersecurity-datasets-cds/dataset-request/
  # Official York BCCC download (repo Datasets/CSVs after unzip)
  bccc_split:
    fraud: ../../../../../Datasets/CSVs/DeFiTransLyzer_fraud.csv
    legitimate: ../../../../../Datasets/CSVs/DeFiTransLyzer_legitimate.csv
  merged_cache: data/bccc.csv
  local_paths:
    - data/bccc.csv
    - data/BCCC-DeFiFraudTrans-2025.csv
    - data/bccc_defi_fraud.csv
    - ~/Downloads/bccc.csv
    - ~/Downloads/BCCC-DeFiFraudTrans-2025.csv
  download_target: data/bccc.csv
  min_rows: 1000
  label_column: fraud
  allow_synthetic_fallback: false

preprocessing:
  group_split_column: address
  scale: true
  max_missing_fraction: 0.95

training:
  sample_size: 50000
  balanced_sample: false
  test_size: 0.3
  seed: 42
  rf_trees: 80
  rf_max_depth: 12
  rf_chunks: 4
  if_estimators: 80
  shap_samples: 120
  shap_examples_export: 5
  resume: true
  n_jobs: 4

environment:
  min_python: "3.10"
  min_free_disk_gb: 2
  venv_dir: .venv

outputs:
  artifacts_dir: artifacts
  results_mmd_dir: results/mmd
  results_svg_dir: results/svg
  evidence_copy: true
  evidence_subdir: mac-m4

agent:
  repo_backend_chatbot: ../../../../backend/src/routes/chatbot.ts
  log_path: agent/agent_action_log.jsonl
