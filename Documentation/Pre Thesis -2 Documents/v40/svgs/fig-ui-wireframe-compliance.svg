    <!-- Alert detail panel -->
    <rect x="336" y="396" width="556" height="432" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="336" y="396" width="556" height="4" rx="18" fill="url(#orangeAccent)"/>

    <text x="360" y="434" font-size="11" letter-spacing="2" fill="#a3a3a3">ALERT DETAIL</text>
    <text x="360" y="458" font-size="18" font-weight="700" fill="#fafafa">AML-2041 - Unusual transfer pattern</text>
    <text x="360" y="478" font-size="12" fill="#a3a3a3">Wallet 0x9f2a...4c11 | Dhaka Local Bank client</text>

    <rect x="360" y="492" width="508" height="52" rx="10" fill="rgba(239,68,68,0.10)" stroke="rgba(239,68,68,0.30)" stroke-width="1"/>
    <text x="376" y="514" font-size="11" fill="#fca5a5">Anomaly score</text>
    <text x="376" y="534" font-size="22" font-weight="700" fill="#fca5a5">0.82</text>
    <text x="500" y="514" font-size="11" fill="#a3a3a3">Related loan</text>
    <text x="500" y="534" font-size="14" font-weight="600" fill="#fafafa">#1038</text>
    <text x="640" y="514" font-size="11" fill="#a3a3a3">Detection source</text>
    <text x="640" y="534" font-size="14" font-weight="600" fill="#fafafa">ML anomaly check</text>

    <text x="360" y="568" font-size="11" font-weight="600" fill="#d4d4d4">Anomaly signals</text>
    <rect x="360" y="576" width="508" height="88" rx="12" fill="rgba(0,0,0,0.30)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <text x="376" y="600" font-size="10" fill="#a3a3a3">Transaction count (6 mo)</text>
    <rect x="480" y="588" width="180" height="14" rx="4" fill="rgba(239,68,68,0.75)"/>
    <text x="670" y="600" font-size="10" fill="#fca5a5">-87% vs expected</text>

    <text x="376" y="628" font-size="10" fill="#a3a3a3">Transfer speed</text>
    <rect x="480" y="616" width="150" height="14" rx="4" fill="rgba(249,115,22,0.80)"/>
    <text x="670" y="628" font-size="10" fill="#fdba74">+142% spike</text>

    <text x="376" y="656" font-size="10" fill="#a3a3a3">Income consistency</text>
    <rect x="480" y="644" width="120" height="14" rx="4" fill="rgba(239,68,68,0.65)"/>
    <text x="670" y="656" font-size="10" fill="#fca5a5">-34% deviation</text>

    <text x="360" y="688" font-size="11" font-weight="600" fill="#d4d4d4">Officer notes</text>
    <rect x="360" y="696" width="508" height="56" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="376" y="728" font-size="12" fill="#737373">Add review notes before filing SAR or freezing account...</text>

    <rect x="360" y="762" width="508" height="36" rx="10" fill="rgba(37,99,235,0.10)" stroke="rgba(59,130,246,0.28)" stroke-width="1"/>
    <text x="376" y="785" font-size="11" fill="#93c5fd">Workflow: Detected &gt; Queued &gt; Officer review &gt; SAR or freeze</text>

    <!-- Workflow / actions panel -->
    <rect x="908" y="396" width="420" height="432" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="932" y="434" font-size="10" letter-spacing="2" fill="#a3a3a3">OFFICER ACTIONS</text>
    <text x="932" y="460" font-size="22" font-weight="700" fill="#fafafa">Review decision</text>

    <!-- Workflow steps -->
    <circle cx="948" cy="492" r="10" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="948" y="496" text-anchor="middle" font-size="9" font-weight="700" fill="#86efac">1</text>
    <text x="968" y="496" font-size="11" fill="#86efac">Anomaly detected</text>

    <line x1="948" y1="502" x2="948" y2="518" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="948" cy="528" r="10" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="948" y="532" text-anchor="middle" font-size="9" font-weight="700" fill="#86efac">2</text>
    <text x="968" y="532" font-size="11" fill="#86efac">Queued for review</text>

    <line x1="948" y1="538" x2="948" y2="554" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="948" cy="564" r="10" fill="rgba(234,88,12,0.25)" stroke="#f97316" stroke-width="1.5"/>
    <text x="948" y="568" text-anchor="middle" font-size="9" font-weight="700" fill="#fdba74">3</text>
    <text x="968" y="568" font-size="11" font-weight="600" fill="#fdba74">Officer review (current)</text>

    <line x1="948" y1="574" x2="948" y2="590" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="948" cy="600" r="10" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="948" y="604" text-anchor="middle" font-size="9" fill="#737373">4</text>
    <text x="968" y="604" font-size="11" fill="#737373">SAR filed or account frozen</text>

    <line x1="932" y1="628" x2="1304" y2="628" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

    <text x="932" y="652" font-size="11" font-weight="600" fill="#d4d4d4">Recommended actions</text>

    <rect x="932" y="664" width="372" height="40" rx="20" fill="url(#btnRed)" filter="url(#softShadow)"/>
    <text x="1118" y="688" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Freeze Account</text>

    <rect x="932" y="712" width="372" height="40" rx="20" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="1118" y="736" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Generate SAR Report</text>

    <rect x="932" y="760" width="180" height="40" rx="20" fill="url(#btnGreen)" opacity="0.92"/>
    <text x="1022" y="784" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Mark False Positive</text>

    <rect x="1124" y="760" width="180" height="40" rx="20" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
    <text x="1214" y="784" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Escalate Case</text>
  </g>

  <text x="700" y="24" text-anchor="middle" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.35)" font-weight="600">COMPLIANCE WIREFRAME</text>
</svg>
