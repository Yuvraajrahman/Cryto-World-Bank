<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <!-- Row 1: Box 1 -->
  <rect x="40" y="65" width="290" height="150" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="185" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">1. Build Transaction</text>
  <text x="185" y="127" text-anchor="middle" font-size="16" fill="#111111">ABI-encode function selector</text>
  <text x="185" y="151" text-anchor="middle" font-size="16" fill="#111111">+ calldata parameters</text>
  <text x="185" y="175" text-anchor="middle" font-size="16" fill="#111111">Assemble raw tx object</text>
  <!-- Icon: Box 1 -->
  <g transform="translate(67,88) scale(2) translate(-67,-88)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round">
      <circle cx="67" cy="88" r="3.2"/>
      <line x1="67" y1="83.3" x2="67" y2="81"/>
      <line x1="67" y1="92.7" x2="67" y2="95"/>
      <line x1="63.3" y1="88" x2="61" y2="88"/>
      <line x1="70.7" y1="88" x2="73" y2="88"/>
    </g>
  </g>

  <!-- Row 1: Box 2 -->
  <rect x="355" y="65" width="290" height="150" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2. Compute Hashes</text>
  <text x="500" y="127" text-anchor="middle" font-size="16" fill="#111111">keccak256: event topics &amp;</text>
  <text x="500" y="151" text-anchor="middle" font-size="16" fill="#111111">EIP-712 typed-data hash</text>
  <text x="500" y="175" text-anchor="middle" font-size="16" fill="#111111">(beyond &#167;4.2.3 commit-reveal)</text>
  <!-- Icon: Box 2 -->
  <g transform="translate(382,88) scale(2) translate(-382,-88)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round">
      <line x1="379" y1="82" x2="379" y2="94"/>
      <line x1="385" y1="82" x2="385" y2="94"/>
      <line x1="376" y1="85.5" x2="388" y2="85.5"/>
      <line x1="376" y1="90.5" x2="388" y2="90.5"/>
    </g>
  </g>

  <!-- Row 1: Box 3 -->
  <rect x="670" y="65" width="290" height="150" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="815" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3. Prepare Signer</text>
  <text x="815" y="127" text-anchor="middle" font-size="16" fill="#111111">Resolve signing authority</text>
  <text x="815" y="151" text-anchor="middle" font-size="16" fill="#111111">Client wallet vs. session key</text>
  <text x="815" y="175" text-anchor="middle" font-size="16" fill="#111111">Attach chain ID &amp; nonce</text>
  <!-- Icon: Box 3 -->
  <g transform="translate(703,88) scale(2) translate(-703,-88)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="693" cy="88" r="3"/>
      <line x1="696" y1="88" x2="703" y2="88"/>
      <line x1="700" y1="88" x2="700" y2="91"/>
      <line x1="703" y1="88" x2="703" y2="90.5"/>
    </g>
  </g>

  <!-- Arrows row 1 -->
  <line x1="330" y1="140" x2="352" y2="140" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="645" y1="140" x2="667" y2="140" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Elbow connector Box3 -> Diamond -->
  <polyline points="815,215 815,240 500,240 500,262" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Diamond: decision -->
  <polygon points="500,265 630,335 500,405 370,335" fill="#B2D5F2" stroke="#111111" stroke-width="2"/>
  <text x="500" y="329" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4. Session Key</text>
  <text x="500" y="351" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">(EIP-7702) Active?</text>
  <!-- Icon: Diamond -->
  <g transform="translate(500,289) scale(2) translate(-500,-289)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="495" cy="288" r="3.2"/>
      <line x1="498" y1="288" x2="506" y2="288"/>
      <line x1="502" y1="288" x2="502" y2="291"/>
      <line x1="506" y1="288" x2="506" y2="290.5"/>
    </g>
  </g>

  <!-- Arrow Diamond -> Box 5a (Yes) -->
  <line x1="630" y1="335" x2="697" y2="335" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="663" y="320" text-anchor="middle" font-size="16" font-style="italic" fill="#3a4a58">Yes</text>

  <!-- Box 5a: Yes branch -->
  <rect x="700" y="265" width="260" height="140" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="830" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">5a. Session Key</text>
  <text x="830" y="322" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Auto-Signs</text>
  <text x="830" y="354" text-anchor="middle" font-size="16" fill="#111111">Delegated signer executes</text>
  <text x="830" y="376" text-anchor="middle" font-size="16" fill="#111111">&#8212; no user prompt needed</text>
  <!-- Icon: Box 5a -->
  <g transform="translate(727,293) scale(2) translate(-727,-293)">
    <polygon points="728,286 723,293 726,293 724,300 731,291 727,291" fill="#154A73"/>
  </g>

  <!-- Arrow Diamond -> Box 5b (No) -->
  <line x1="500" y1="405" x2="500" y2="447" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="525" y="430" text-anchor="start" font-size="16" font-style="italic" fill="#3a4a58">No</text>

  <!-- Box 5b: No branch -->
  <rect x="250" y="450" width="500" height="90" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="500" y="476" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">5b. Client Wallet Signs</text>
  <text x="500" y="500" text-anchor="middle" font-size="16" fill="#111111">Wagmi/Viem trigger signTransaction; user approves in wallet</text>
  <!-- Icon: Box 5b -->
  <g transform="translate(278,469) scale(2) translate(-278,-469)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="271" y="464" width="14" height="10" rx="1.5"/>
      <circle cx="280" cy="469" r="1.3" fill="#154A73" stroke="none"/>
    </g>
  </g>

  <!-- Converging arrows into Box 6 -->
  <polyline points="830,405 830,545 760,545 760,578" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <polyline points="500,540 500,562 350,562 350,578" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Box 6: merged final step -->
  <rect x="150" y="580" width="700" height="120" rx="8" fill="#B2D5F2" stroke="#111111" stroke-width="2"/>
  <text x="500" y="610" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">6. Submit, Confirm &amp; Sync State</text>
  <text x="500" y="640" text-anchor="middle" font-size="16" fill="#111111">Broadcast to mempool; validator includes tx in block (Sepolia/Amoy)</text>
  <text x="500" y="663" text-anchor="middle" font-size="16" fill="#111111">LoanController/WorldBankReserve state updated; events emitted</text>
  <text x="500" y="686" text-anchor="middle" font-size="16" fill="#111111">Frontend awaits N confirmations before marking finalized</text>
  <!-- Icon: Box 6 -->
  <g transform="translate(177,603) scale(2) translate(-177,-603)">
    <g stroke="#154A73" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="177" y1="608" x2="177" y2="598"/>
      <polyline points="173,602 177,598 181,602"/>
      <line x1="171" y1="609" x2="183" y2="609"/>
    </g>
  </g>

</svg>
