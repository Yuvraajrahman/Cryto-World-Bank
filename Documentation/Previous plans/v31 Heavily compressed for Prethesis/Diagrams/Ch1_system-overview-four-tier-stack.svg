<!-- BANKING FUNCTIONS -->
<text class="sm" x="70" y="534" font-weight="600" fill="#000000">Six banking functions enforced on-chain:</text>

<rect x="70"  y="546" width="104" height="26" rx="3" fill="#000000"/>
<text class="sm" x="122" y="559" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Deposit mobilization</text>
