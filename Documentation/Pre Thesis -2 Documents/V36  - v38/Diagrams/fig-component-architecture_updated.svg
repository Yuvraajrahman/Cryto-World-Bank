<svg viewBox="0 0 1420 760" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <g id="cicon">
      <rect x="0" y="0" width="14" height="18" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.1"/>
      <rect x="-4" y="3" width="8" height="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1"/>
      <rect x="-4" y="11" width="8" height="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1"/>
    </g>
  </defs>
  <rect x="1" y="1" width="1418" height="758" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="710" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">Component Diagram — Off-Chain / On-Chain Hybrid Architecture</text>
  <text x="710" y="48" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">UML 2 Notation · System Analysis and Design</text>

  <!-- ============ BOUNDARIES ============ -->
  <!-- External Services -->
  <rect x="20" y="65" width="250" height="435" fill="none" stroke="#2b2b2b" stroke-width="1.4"/>
  <rect x="20" y="65" width="158" height="24" fill="white" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="30" y="82" font-size="13.5" font-weight="bold">External Services</text>

  <!-- Client Tier -->
  <rect x="580" y="65" width="260" height="125" fill="none" stroke="#2b2b2b" stroke-width="1.4"/>
  <rect x="580" y="65" width="112" height="24" fill="white" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="590" y="82" font-size="13.5" font-weight="bold">Client Tier</text>

  <!-- Off-Chain Backend -->
  <rect x="580" y="215" width="810" height="260" fill="none" stroke="#2b2b2b" stroke-width="1.4"/>
  <rect x="580" y="215" width="178" height="24" fill="white" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="590" y="232" font-size="13.5" font-weight="bold">Off-Chain Backend</text>

  <!-- Blockchain -->
  <rect x="580" y="520" width="500" height="175" fill="none" stroke="#2b2b2b" stroke-width="1.4"/>
  <rect x="580" y="520" width="220" height="24" fill="white" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="590" y="537" font-size="13.5" font-weight="bold">Blockchain (EVM Testnet)</text>

  <!-- ============ NODES ============ -->
  <!-- React SPA -->
  <rect x="610" y="105" width="200" height="70" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <use href="#cicon" x="778" y="115"/>
  <text x="710" y="136" text-anchor="middle" font-size="15" font-weight="bold">React SPA</text>
  <text x="710" y="153" text-anchor="middle" font-size="12" font-style="italic">«component»</text>

  <!-- Wallet (MetaMask) -->
  <rect x="1100" y="105" width="260" height="70" rx="5" fill="white" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="1230" y="136" text-anchor="middle" font-size="15" font-weight="bold">Wallet (MetaMask)</text>
  <text x="1230" y="153" text-anchor="middle" font-size="12" font-style="italic">«external»</text>

  <!-- CoinGecko API -->
  <rect x="45" y="110" width="200" height="70" rx="5" fill="white" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="145" y="141" text-anchor="middle" font-size="15" font-weight="bold">CoinGecko API</text>
  <text x="145" y="158" text-anchor="middle" font-size="12" font-style="italic">«external»</text>

  <!-- Chainlink DON -->
  <rect x="45" y="200" width="200" height="70" rx="5" fill="white" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="145" y="231" text-anchor="middle" font-size="15" font-weight="bold">Chainlink DON</text>
  <text x="145" y="248" text-anchor="middle" font-size="12" font-style="italic">«external»</text>

  <!-- Express REST API -->
  <rect x="610" y="250" width="200" height="70" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <use href="#cicon" x="778" y="260"/>
  <text x="710" y="281" text-anchor="middle" font-size="15" font-weight="bold">Express REST API</text>
  <text x="710" y="298" text-anchor="middle" font-size="12" font-style="italic">«component»</text>

  <!-- Event Listener -->
  <rect x="1100" y="250" width="210" height="70" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <use href="#cicon" x="1278" y="260"/>
  <text x="1205" y="281" text-anchor="middle" font-size="15" font-weight="bold">Event Listener</text>
  <text x="1205" y="298" text-anchor="middle" font-size="12" font-style="italic">«component»</text>

  <!-- ML Scoring Service -->
  <rect x="610" y="360" width="200" height="70" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <use href="#cicon" x="778" y="370"/>
  <text x="710" y="386" text-anchor="middle" font-size="15" font-weight="bold">ML Scoring Service</text>
  <text x="710" y="402" text-anchor="middle" font-size="11.5">RF + Isolation Forest + SHAP</text>
  <text x="710" y="417" text-anchor="middle" font-size="12" font-style="italic">«component»</text>

  <!-- Redis cylinder -->
  <path d="M 850 372 A 70 12 0 0 1 990 372 L 990 418 A 70 12 0 0 1 850 418 Z" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <ellipse cx="920" cy="372" rx="70" ry="12" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="920" y="402" text-anchor="middle" font-size="15" font-weight="bold">Redis</text>
  <text x="920" y="417" text-anchor="middle" font-size="12" font-style="italic">«cache»</text>

  <!-- PostgreSQL cylinder -->
  <path d="M 1020 372 A 80 12 0 0 1 1180 372 L 1180 418 A 80 12 0 0 1 1020 418 Z" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <ellipse cx="1100" cy="372" rx="80" ry="12" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="1100" y="402" text-anchor="middle" font-size="15" font-weight="bold">PostgreSQL</text>
  <text x="1100" y="417" text-anchor="middle" font-size="12" font-style="italic">«database»</text>

  <!-- Auth / RBAC -->
  <rect x="1210" y="360" width="140" height="70" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <use href="#cicon" x="1318" y="362"/>
  <text x="1280" y="391" text-anchor="middle" font-size="15" font-weight="bold">Auth / RBAC</text>
  <text x="1280" y="408" text-anchor="middle" font-size="12" font-style="italic">«component»</text>

  <!-- Smart Contracts -->
  <rect x="630" y="555" width="380" height="125" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.4"/>
  <use href="#cicon" x="978" y="565"/>
  <text x="820" y="577" text-anchor="middle" font-size="15" font-weight="bold">Smart Contracts</text>
  <text x="820" y="592" text-anchor="middle" font-size="12" font-style="italic">«component»</text>
  <line x1="630" y1="598" x2="1010" y2="598" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="630" y1="617" x2="1010" y2="617" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="630" y1="636" x2="1010" y2="636" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="630" y1="655" x2="1010" y2="655" stroke="#2b2b2b" stroke-width="1"/>
  <text x="820" y="613" text-anchor="middle" font-size="12">Tier I — Governance / Registry</text>
  <text x="820" y="632" text-anchor="middle" font-size="12">Tier II — Access Control</text>
  <text x="820" y="651" text-anchor="middle" font-size="12">Tier III — Business Logic</text>
  <text x="820" y="670" text-anchor="middle" font-size="12">Tier IV — Storage / State</text>

  <!-- ============ ARROWS ============ -->
  <!-- React SPA -> Express (jogs right to avoid the Off-Chain Backend tab label) -->
  <polyline points="710,175 710,203 770,203 770,242 710,242 710,246" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Express -> ML Scoring (main) + bus junction -->
  <line x1="710" y1="320" x2="710" y2="356" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
  <circle cx="710" cy="337" r="2.6" fill="#1a1a1a"/>
  <line x1="710" y1="337" x2="920" y2="337" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="920" y1="337" x2="920" y2="356" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="920" y1="337" x2="1100" y2="337" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="1080" y1="337" x2="1080" y2="356" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="1100" y1="337" x2="1280" y2="337" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="1280" y1="337" x2="1280" y2="356" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Event Listener -> PostgreSQL (log events) -->
  <line x1="1205" y1="320" x2="1205" y2="337" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="1205" y1="337" x2="1120" y2="337" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="1120" y1="337" x2="1120" y2="356" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ML Scoring -> CoinGecko API -->
  <polyline points="610,395 280,395 280,145 249,145" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ML Scoring -> Chainlink DON -->
  <polyline points="610,415 305,415 305,235 249,235" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Express -> Smart Contracts (submit approved tx) -->
  <polyline points="810,285 830,285 830,555" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Wallet -> Smart Contracts (signed tx, direct) -->
  <polyline points="1230,175 1230,192 1405,192 1405,555 955,555" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Smart Contracts -> Event Listener (async event notification) -->
  <polyline points="880,555 880,542 1362,542 1362,285 1314,285" fill="none" stroke="#444" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#ar2)"/>
  <text x="1378" y="420" text-anchor="middle" font-size="11.5" font-style="italic" fill="#333" transform="rotate(-90 1378 420)">event notification</text>

  <!-- ============ LEGEND ============ -->
  <rect x="45" y="300" width="200" height="185" fill="white" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="55" y="320" font-size="13.5" font-weight="bold">Legend</text>
  <line x1="55" y1="327" x2="235" y2="327" stroke="#2b2b2b" stroke-width="0.8"/>

  <use href="#cicon" x="63" y="335"/>
  <text x="90" y="348" font-size="11.8">«component» — internal service</text>

  <rect x="55" y="358" width="18" height="13" fill="white" stroke="#2b2b2b" stroke-width="1.1" stroke-dasharray="4,3"/>
  <text x="90" y="369" font-size="11.8">«external» — 3rd-party system</text>

  <ellipse cx="64" cy="384" rx="9" ry="4" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1"/>
  <path d="M 55 384 L 55 393 A 9 4 0 0 0 73 393 L 73 384" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1"/>
  <text x="90" y="392" font-size="11.8">database / cache store</text>

  <line x1="55" y1="408" x2="80" y2="408" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="90" y="412" font-size="11.8">synchronous invocation</text>

  <line x1="55" y1="428" x2="80" y2="428" stroke="#444" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ar2)"/>
  <text x="90" y="432" font-size="11.8">asynchronous event</text>

  <rect x="55" y="443" width="25" height="15" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="90" y="455" font-size="11.8">subsystem boundary</text>

  <text x="55" y="475" font-size="11.3" font-style="italic" fill="#333">Fill = system-owned · Dashed = external</text>

</svg>
