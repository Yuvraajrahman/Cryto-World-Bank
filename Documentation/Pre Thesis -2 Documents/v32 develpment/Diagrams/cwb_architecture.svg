  <text class="ts" x="60" y="698" dominant-baseline="central">· Committed risk scores</text>
  <text class="ts" x="60" y="716" dominant-baseline="central">· Credit Passport SBT (zk-KYC)</text>
  <text class="ts" x="60" y="734" dominant-baseline="central">· ZKP identity (Circom / Groth16)</text>
  <text class="ts" x="60" y="752" dominant-baseline="central">· ERC-4337 Paymaster (gas-free T4)</text>

  <rect x="364" y="616" width="280" height="160" rx="8" fill="none" stroke="#aaa" stroke-width="0.5"/>
  <text class="th" x="504" y="634" text-anchor="middle" dominant-baseline="central">Off-chain (PostgreSQL · 20 entities · 3NF)</text>
