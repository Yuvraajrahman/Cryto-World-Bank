
<style>

const exInfo={
  binance:'Founded 2017 by Changpeng Zhao. Proprietary matching engine handles 1.4M+ orders/second. Operates BNB Chain (L1) and BNB Smart Chain (EVM). The BNB token fuels fee discounts, gas, DeFi, and launchpad access. Quarterly token burns from revenue reduce supply. Annual revenue estimated at $20B+. Also operates a non-custodial wallet and NFT marketplace.',
  coinbase:'Founded 2012, Nasdaq-listed (COIN) since 2021. Most compliance-forward US exchange — SOC 2, NY BitLicense. Coinbase Prime serves institutional clients with custodial services. Launched Base (Ethereum L2) in 2023. Revenue ~$3B/yr. The most trusted retail brand in the US crypto market.',
  okx:'Top derivatives exchange globally. Operates OKT Chain (L1) and the OKB token. Heavy Web3 investment — OKX Wallet supports 80+ blockchains natively. Based in Seychelles, serving a globally diverse userbase. Strong in options, futures, and perpetual swaps.',
  bybit:'Launched 2018, rapidly grew to #2 in derivatives. Offers both inverse and USDT-margined perpetuals. TradingView integration. Pioneered copy trading at scale for retail users. Insurance fund exceeds $300M. No native discount token, competes purely on fee pricing.',
  kraken:'Founded 2011, one of the oldest surviving exchanges. Has never been hacked at the exchange level. Strong EUR markets. Offers staking, margin trading, and a separate Kraken Futures entity. Uses dark pools for institutional block trades. In 2023 acquired NinjaTrader for futures expansion.',
  kucoin:'The "People\'s Exchange" lists new altcoins faster than any major competitor. 700+ trading pairs. KCS token distributes 50% of daily fee income directly to holders — a genuine revenue-sharing model. Suffered a $281M hack in 2020 but covered all user losses from company funds.',
  htx:'Founded 2013 in China as Huobi, now operating from Seychelles after China\'s 2021 ban. Justin Sun (Tron founder) became an adviser in 2022. HT token offers fee discounts and voting rights. One of Asia\'s oldest and most recognized crypto brands.',
  gemini:'Founded by Tyler and Cameron Winklevoss in 2014. Operates as a NY trust company — the highest state-level regulatory standard. Launched the GUSD (Gemini dollar) stablecoin. Gemini Earn faced regulatory action in 2023. Strong focus on institutional and HNW clients.',
  uniswap:'The first major AMM on Ethereum. Uses x·y=k constant product formula — no order book, no counterparty, fully permissionless. V3 introduced concentrated liquidity enabling LPs to define custom price ranges, dramatically improving capital efficiency. UNI is governance-only. The protocol is immutable — no admin keys.',
  pancake:'Dominant DEX on BNB Chain. $0.01 gas fees drive extremely high transaction counts. CAKE has a deflationary burn mechanism. Expanded to Ethereum, zkSync, Polygon, and Linea. TVL ~$1.5B. Launched a perpetuals DEX and prediction markets alongside spot AMM.',
  dydx:'On-chain perpetual futures with off-chain order book and on-chain settlement. Migrated from Ethereum StarkEx L2 to its own Cosmos app-chain (dYdX Chain v4) for full decentralization. Governance entirely on-chain. Directly competes with Binance and OKX on perpetuals product.',
  curve:'AMM specialized for stablecoin and pegged-asset swaps. Stableswap invariant minimizes slippage near a 1:1 peg. veCRV (vote-escrowed CRV) earns 50% of all protocol swap fees. The "Curve Wars" — protocols competing to direct CRV liquidity mining emissions — became a defining DeFi dynamic in 2021-22.',
};
const archLayers=[
  {n:'User interface layer',c:'al lu',tc:'color:var(--color-text-info)',nodes:[
    {k:'webapp',l:'Web application (SPA)'},
    {k:'mobileapp',l:'Mobile app (iOS/Android)'},
    {k:'tradingapi',l:'Trading API (REST/FIX)'},

    {k:'orderbook',l:'Order book'},
    {k:'matching',l:'Matching engine'},
    {k:'riskengine',l:'Risk engine'},
    {k:'clearing',l:'Clearing & settlement'},
    {k:'custody',l:'Custody / cold storage'},

  {n:'Fiat / banking integration layer',c:'al lf',tc:'color:var(--color-text-warning)',nodes:[
    {k:'bankrail',l:'Bank rails (ACH/SEPA/SWIFT)'},
    {k:'stablecoin',l:'Stablecoin reserves (USDT/USDC)'},
    {k:'custbank',l:'Custodian banks'},
    {k:'compliance',l:'Regulatory compliance'},
  ]},
];
const archInfo={
  webapp:'Typically a React or Vue SPA with TradingView charting. Real-time price feeds arrive via WebSocket streams. REST APIs handle order placement, account management, and history. CDN-distributed globally for latency reduction. Sessions secured with 2FA (TOTP or hardware security keys like YubiKey).',
  mobileapp:'Native iOS/Android or React Native. Push notifications for fills and alerts. Biometric authentication. Binance app has 100M+ downloads — mobile now drives the majority of retail trading volume globally. Apps are often limited to spot trading while advanced derivatives remain desktop-only.',
  tradingapi:'REST + WebSocket APIs for algorithmic and institutional trading. FIX protocol support for HFT firms needing sub-millisecond latency. Rate limits prevent abuse. Permission tiers: read-only, trading, and withdrawal. Critical rule: never generate withdrawal-permission API keys for automated bots.',
  websocket:'Real-time streaming of order book depth updates, trade tickers, and user account state. Binance publishes depth snapshots every 100ms. Data flows from exchange colocation servers through regional CDN PoPs to end clients. Critical for HFT strategies that require microsecond awareness of book changes.',
  kyc:'Regulated exchanges use identity verification partners (Jumio, Onfido, Sumsub) for document + liveness checks. AML screening against OFAC/FATF sanctions lists. Blockchain analytics (Chainalysis, Elliptic) flag suspicious on-chain history. FATF Travel Rule: exchanges must share sender/receiver info on transfers over $1,000.',
  orderbook:'A data structure holding all outstanding limit orders organized by price level. Typically implemented as a sorted tree (red-black tree or skiplist). Bids on one side, asks on the other — the spread between them represents liquidity cost. High-frequency market makers update quotes thousands of times per second.',
  matching:'The core of any CEX: matches buy and sell orders by price-time priority (FIFO). Must be deterministic and extremely fast. Binance processes 1.4M+ orders/second at microsecond latency using bare-metal servers with kernel-bypass networking (DPDK/RDMA). Single-threaded design is required for determinism.',
  riskengine:'For derivatives: computes real-time mark prices from multiple price indices, calculates maintenance margin requirements, and triggers forced liquidations when account equity falls below threshold. Insurance funds absorb deficits from liquidations that cannot be closed at the bankruptcy price. Auto-deleveraging (ADL) only activates if the fund is empty.',
  clearing:'After a trade match, positions update in the exchange\'s internal database — not on-chain for a CEX. Blockchain settlement only happens on withdrawal. This "net settlement" model means millions of internal trades result in only thousands of on-chain transactions, dramatically improving throughput and cost efficiency.',
  custody:'Industry standard: 95%+ of user funds in air-gapped cold storage. Hot wallets hold only enough for daily withdrawal flow. Withdrawals require multi-sig (M-of-N keyholders) or MPC (multi-party computation, e.g. Fireblocks, Copper). Hardware Security Modules (HSMs) protect private key material from extraction.',
  amm:'Replaces the order book with a mathematical formula. Uniswap v2: x·y=k (constant product — infinite liquidity, bounded slippage). Uniswap v3: concentrated liquidity in user-defined price ranges (much better capital efficiency). Curve: stableswap invariant for near-zero slippage near a 1:1 peg. Price is fully determined by pool token ratios.',
  lpool:'Smart contracts holding token pairs (e.g. ETH/USDC). Anyone can become a liquidity provider by depositing both tokens proportionally and receiving LP tokens representing their share. LPs earn swap fees but are exposed to impermanent loss — the opportunity cost when prices diverge from the deposit ratio.',
  nodes:'Exchanges run multiple full nodes of every supported blockchain, syncing the complete transaction history. This allows real-time verification of incoming deposits without trusting third-party APIs. Full nodes also enable transaction broadcasting, address monitoring, and accurate confirmation tracking.',
  sc:'DEXes run entirely through audited, immutable smart contracts — Uniswap core contracts have no admin keys. Security audits by Trail of Bits, OpenZeppelin, and Certik are required. Formal verification (proving correctness mathematically) is best practice for high-value, high-risk contract logic.',
  wallets:'Hot wallets: always-online, connected to the withdrawal system — hold the minimum needed for daily operations. Cold wallets: air-gapped HSMs for bulk storage. HD wallets generate a unique deposit address per user from a single master seed. MPC wallet infrastructure enables distributed key management with no single point of compromise.',
  consensus:'Bitcoin PoW: confirmed after ~6 blocks (~60 min). Ethereum PoS: final in ~13 min with economic finality. Solana PoH: ~400ms blocks, near-instant finality. Exchanges calibrate minimum confirmation counts per chain based on security model and 51%-attack cost (confirmations required ≈ cost to reverse/attack).',
  bridge:'Protocols that lock tokens on one chain and mint wrapped equivalents on another. The most-hacked DeFi infrastructure: Ronin ($625M), Wormhole ($320M), Nomad ($190M). Most major CEXes internalize cross-chain moves through their own multi-chain hot wallets rather than trusting external bridges.',
  mempool:'The pending transaction pool — unconfirmed transactions waiting to be picked up by validators. Exchanges monitor the mempool to credit incoming deposits before blockchain confirmation (useful for small deposits). Gas fees (Ethereum) or priority fees (Bitcoin) determine how quickly validators include transactions.',
  bankrail:'ACH: US, 1-3 days. Fedwire: US same-day for institutional. SEPA: Europe, 1 business day. SWIFT: international, 1-5 days. Crypto-friendly banking is the most fragile layer post-2023 (Signature Bank and Silvergate both closed in March 2023). Exchanges now use Cross River Bank, Western Alliance, and international alternatives.',
  stablecoin:'USDT ($100B+ supply) and USDC ($45B+) are the monetary base for crypto trading — most pairs price against them. USDT backed by T-bills and cash equivalents (audited by BDO). USDC backed 1:1 with cash and short-term US Treasuries (Deloitte audit). During the 2022 Terra collapse, $20B+ USDT was redeemed without breaking the peg.',
  custbank:'Regulated exchanges hold fiat at FDIC-insured banks in segregated custodial accounts. After the 2023 banking crisis, most exchanges diversified to 5-10+ banking partners to avoid concentration risk. Institutional clients use qualified custodians: Fidelity Digital Assets, Anchorage Digital, or BitGo — all with SOC-2 certification.',
  compliance:'MiCA (EU Markets in Crypto-Assets, effective 2024): first comprehensive licensing regime. FinCEN (US): MSB registration required, suspicious activity reports (SARs) mandated. FATF Travel Rule: exchanges must transmit sender/receiver KYC info on transfers over $1,000. Compliance teams at major exchanges now larger than their engineering organizations.',
};

];

function h(tag,attrs,text){
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='cls')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k==='txt')e.textContent=v;
    else if(k==='st')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  });
  if(text)e.textContent=text;
  return e;
}
function ap(parent,...children){children.forEach(c=>c&&parent.appendChild(c));return parent;}
