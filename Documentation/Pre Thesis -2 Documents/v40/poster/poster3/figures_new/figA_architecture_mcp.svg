  <text x="635" y="182" font-size="11" fill="#5a738c">EIP-1193</text>

  <rect x="815" y="142" width="230" height="52" rx="10" fill="#ffffff" stroke="#1f5f9a"/>
  <circle cx="842" cy="168" r="13" fill="#e3f2fd"/>
  <path d="M835 164 l5 5 9-10" fill="none" stroke="#1565a0" stroke-width="1.8"/>
