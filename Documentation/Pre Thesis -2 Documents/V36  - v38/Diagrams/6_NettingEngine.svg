<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="498" fill="white" stroke="#cccccc" stroke-width="1"/>

  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">NettingEngine — Multilateral Batch Settlement (Future Work)</text>
  <text x="410" y="55" text-anchor="middle" font-size="13" font-style="italic" fill="#333">Batches many bilateral IBLP + TreasurySwap obligations into fewer net payments</text>

  <!-- Gross obligations -->
  <text x="150" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Gross obligations</text>
  <rect x="60" y="105" width="180" height="40" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="150" y="129" text-anchor="middle" font-size="11.5" fill="#111">Bank A → Bank B: 500k</text>

  <rect x="60" y="155" width="180" height="40" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="150" y="179" text-anchor="middle" font-size="11.5" fill="#111">Bank B → Bank C: 300k</text>

  <rect x="60" y="205" width="180" height="40" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="150" y="229" text-anchor="middle" font-size="11.5" fill="#111">Bank C → Bank A: 200k</text>

  <rect x="60" y="255" width="180" height="40" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="150" y="279" text-anchor="middle" font-size="11.5" fill="#111">Bank C → Bank B: 150k</text>

  <text x="150" y="315" text-anchor="middle" font-size="10.5" fill="#666">(IBLP loans + TreasurySwap legs)</text>

  <!-- Netting Engine -->
  <rect x="330" y="150" width="200" height="100" rx="6" fill="#f3f6fc" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="430" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">NettingEngine</text>
  <text x="430" y="205" text-anchor="middle" font-size="11" fill="#333">NETTING_BATCH +</text>
  <text x="430" y="220" text-anchor="middle" font-size="11" fill="#333">NETTING_ENTRY</text>
  <text x="430" y="236" text-anchor="middle" font-size="10.5" fill="#666">coordinator-submitted batch</text>

  <line x1="240" y1="200" x2="325" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow6)"/>

  <!-- Net obligations -->
  <text x="690" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Net obligations</text>
  <rect x="600" y="130" width="180" height="40" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="690" y="154" text-anchor="middle" font-size="11.5" fill="#111">Bank A → Bank B: 300k</text>

  <rect x="600" y="180" width="180" height="40" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="690" y="204" text-anchor="middle" font-size="11.5" fill="#111">Bank C → Bank B: 250k</text>

  <text x="690" y="245" text-anchor="middle" font-size="10.5" fill="#666">(settled in a single batch tx)</text>

  <line x1="535" y1="180" x2="595" y2="165" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow6)"/>
  <line x1="535" y1="220" x2="595" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow6)"/>
  <text x="565" y="150" text-anchor="middle" font-size="11" fill="#111">settle</text>

  <!-- Future work badge -->
  <rect x="330" y="320" width="200" height="40" rx="18" fill="#f6e3d8" stroke="#a0512e" stroke-width="1.2"/>
  <text x="430" y="345" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3a20">Not yet implemented</text>

  <!-- Footer -->
  <text x="410" y="420" text-anchor="middle" font-size="12" fill="#222">Reduces N pairwise settlements to the minimal set of net transfers per batch, cutting gas cost and</text>
  <text x="410" y="438" text-anchor="middle" font-size="12" fill="#222">on-chain transaction count. Scoped as future work (Section 6.2).</text>
</svg>
