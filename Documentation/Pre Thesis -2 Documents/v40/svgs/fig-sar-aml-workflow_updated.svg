<svg viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="628" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">SAR &amp; AML Workflow</text>

  <!-- Row 1 -->
  <circle cx="45" cy="120" r="18" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="45" y="124" text-anchor="middle" font-size="11">start</text>

  <rect x="90" y="90" width="185" height="65" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="182" y="115" text-anchor="middle" font-size="12.5" fill="#111">Isolation Forest flags wallet</text>
  <text x="182" y="133" text-anchor="middle" font-size="12.5" fill="#111">(anomaly_score &gt; 0.75)</text>

  <rect x="305" y="85" width="215" height="75" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="412" y="107" text-anchor="middle" font-size="12.5" fill="#111">Record LOAN_RISK_ASSESSMENT</text>
  <text x="412" y="124" text-anchor="middle" font-size="12.5" fill="#111">(per-loan) + SECURITY_EVENT_LOG</text>
  <text x="412" y="141" text-anchor="middle" font-size="12.5" fill="#111">(system-wide)</text>

  <rect x="550" y="90" width="200" height="65" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="650" y="113" text-anchor="middle" font-size="12.5" fill="#111">Express emits aml-alert;</text>
  <text x="650" y="131" text-anchor="middle" font-size="12.5" fill="#111">compliance dashboard consumes</text>

  <rect x="780" y="90" width="195" height="65" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="877" y="113" text-anchor="middle" font-size="12.5" fill="#111">Bank officer reviews alert</text>
  <text x="877" y="131" text-anchor="middle" font-size="12.5" fill="#111">in admin queue</text>

  <!-- Row1 arrows -->
  <line x1="63" y1="120" x2="86" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a35)"/>
  <line x1="275" y1="122" x2="301" y2="122" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a35)"/>
  <line x1="520" y1="122" x2="546" y2="122" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a35)"/>
  <line x1="750" y1="122" x2="776" y2="122" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a35)"/>

  <!-- connector down to row 2 diamond -->
  <line x1="877" y1="155" x2="877" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a35)"/>

  <!-- Row 2: decision -->
  <polygon points="877,260 955,310 877,360 799,310" fill="#f0f0f0" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="877" y="315" text-anchor="middle" font-size="14" fill="#111">Confirmed?</text>

  <!-- branch labels & lines down to row 3 -->
  <line x1="825" y1="345" x2="450" y2="450" stroke="#555" stroke-width="1.2" marker-end="url(#a35)"/>
  <text x="620" y="410" text-anchor="middle" font-size="12" fill="#333">no</text>

  <line x1="900" y1="350" x2="850" y2="450" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a35)"/>
  <text x="895" y="410" text-anchor="middle" font-size="12" fill="#333">yes</text>

  <!-- Row 3 outcome boxes -->
  <rect x="270" y="455" width="290" height="80" rx="5" fill="#f6e3d8" stroke="#a0512e" stroke-width="1.2"/>
  <text x="415" y="482" text-anchor="middle" font-size="13" fill="#333">False positive: dismiss +</text>
  <text x="415" y="500" text-anchor="middle" font-size="13" fill="#333">document reason</text>
  <text x="415" y="518" text-anchor="middle" font-size="12" fill="#333">(audit_logs)</text>

  <rect x="640" y="440" width="300" height="105" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="790" y="463" text-anchor="middle" font-size="13" fill="#111">Generate SAR (audit_logs);</text>
  <text x="790" y="481" text-anchor="middle" font-size="13" fill="#111">INSTITUTION_MESSAGE</text>
  <text x="790" y="499" text-anchor="middle" font-size="13" fill="#111">SAR_ESCALATION to National Bank;</text>
  <text x="790" y="517" text-anchor="middle" font-size="13" fill="#111">freezeAccount(clientId)</text>

  <!-- merge lines to shared end node -->
  <line x1="415" y1="535" x2="415" y2="560" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="790" y1="545" x2="790" y2="560" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="415" y1="560" x2="790" y2="560" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="602" y1="560" x2="602" y2="565" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a35)"/>

  <circle cx="602" cy="580" r="17" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.4"/>
  <text x="602" y="584" text-anchor="middle" font-size="11">end</text>

  <text x="500" y="615" text-anchor="middle" font-size="12" fill="#222">Confirmed alerts trigger a SAR filing, escalation to the National Bank, and an account freeze.</text>
</svg>
