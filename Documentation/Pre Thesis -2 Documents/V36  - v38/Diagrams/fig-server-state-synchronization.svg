<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#111111">Server-Side State Synchronization</text>

  <!-- Row 1: Box 1 -->
  <rect x="40" y="65" width="290" height="150" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="185" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">1. Event Listener Fires</text>
  <text x="185" y="127" text-anchor="middle" font-size="16" fill="#111111">Detects confirmed event</text>
  <text x="185" y="151" text-anchor="middle" font-size="16" fill="#111111">(&#167;4.2.18); decodes log topics</text>
  <text x="185" y="175" text-anchor="middle" font-size="16" fill="#111111">Matches to pending tx record</text>
  <!-- Icon: Box 1 -->
  <g transform="translate(67,88) scale(2) translate(-67,-88)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62,90 v-3 a5,5 0 0,1 10,0 v3 z"/>
      <line x1="61" y1="90" x2="73" y2="90"/>
      <circle cx="67" cy="93" r="1.1" fill="#154A73" stroke="none"/>
    </g>
  </g>

  <!-- Row 1: Box 2 -->
  <rect x="355" y="65" width="290" height="150" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2. Write to PostgreSQL</text>
  <text x="500" y="127" text-anchor="middle" font-size="16" fill="#111111">Maps event to relational schema</text>
  <text x="500" y="151" text-anchor="middle" font-size="16" fill="#111111">Updates loan/tx/reserve tables</text>
  <text x="500" y="175" text-anchor="middle" font-size="16" fill="#111111">Commits within DB transaction</text>
  <!-- Icon: Box 2 -->
  <g transform="translate(382,87.5) scale(2) translate(-382,-87.5)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round">
      <ellipse cx="382" cy="83" rx="6" ry="2"/>
      <line x1="376" y1="83" x2="376" y2="92"/>
      <line x1="388" y1="83" x2="388" y2="92"/>
      <path d="M376,92 a6,2 0 0,0 12,0"/>
    </g>
  </g>

  <!-- Row 1: Box 3 -->
  <rect x="670" y="65" width="290" height="150" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="815" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3. Compare vs. Cache</text>
  <text x="815" y="127" text-anchor="middle" font-size="16" fill="#111111">Diffs confirmed on-chain state</text>
  <text x="815" y="151" text-anchor="middle" font-size="16" fill="#111111">against cached off-chain values</text>
  <text x="815" y="175" text-anchor="middle" font-size="16" fill="#111111">Flags any short-lived mismatch</text>
  <!-- Icon: Box 3 -->
  <g transform="translate(704,87.5) scale(1.8) translate(-704,-87.5)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round">
      <line x1="697" y1="82" x2="697" y2="93"/>
      <line x1="690" y1="85" x2="704" y2="85"/>
      <line x1="690" y1="85" x2="690" y2="90"/>
      <line x1="704" y1="85" x2="704" y2="90"/>
      <circle cx="690" cy="91.5" r="1.3"/>
      <circle cx="704" cy="91.5" r="1.3"/>
    </g>
  </g>

  <!-- Arrows row 1 -->
  <line x1="330" y1="140" x2="352" y2="140" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="645" y1="140" x2="667" y2="140" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- Elbow connector Box3 -> Diamond -->
  <polyline points="815,215 815,240 500,240 500,262" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- Diamond: decision -->
  <polygon points="500,265 630,335 500,405 370,335" fill="#B2D5F2" stroke="#111111" stroke-width="2"/>
  <text x="500" y="329" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4. On-Chain vs.</text>
  <text x="500" y="351" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Cache Match?</text>
  <!-- Icon: Diamond -->
  <g transform="translate(500,289) scale(2) translate(-500,-289)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="494" y="283" width="7" height="7"/>
      <rect x="499" y="288" width="7" height="7"/>
    </g>
  </g>

  <!-- Arrow Diamond -> Box 5a (Yes) -->
  <line x1="630" y1="335" x2="697" y2="335" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="663" y="320" text-anchor="middle" font-size="16" font-style="italic" fill="#3a4a58">Yes</text>

  <!-- Box 5a: Yes branch -->
  <rect x="700" y="265" width="260" height="140" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="830" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">5a. Propagate</text>
  <text x="830" y="322" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Update</text>
  <text x="830" y="354" text-anchor="middle" font-size="16" fill="#111111">Push update via WebSocket</text>
  <text x="830" y="376" text-anchor="middle" font-size="16" fill="#111111">to dashboard clients</text>
  <!-- Icon: Box 5a -->
  <g transform="translate(727,293) scale(2) translate(-727,-293)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round">
      <circle cx="727" cy="298" r="1.2" fill="#154A73" stroke="none"/>
      <path d="M724,295 Q727,292 730,295"/>
      <path d="M721.5,293 Q727,286 732.5,293"/>
    </g>
  </g>

  <!-- Arrow Diamond -> Box 5b (No) -->
  <line x1="500" y1="405" x2="500" y2="447" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="525" y="430" text-anchor="start" font-size="16" font-style="italic" fill="#3a4a58">No</text>

  <!-- Box 5b: No branch -->
  <rect x="250" y="450" width="500" height="90" rx="8" fill="#EAF3FB" stroke="#111111" stroke-width="2"/>
  <text x="500" y="476" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">5b. Reconcile &amp; Overwrite Cache</text>
  <text x="500" y="500" text-anchor="middle" font-size="16" fill="#111111">On-chain truth wins; mismatch logged for audit</text>
  <!-- Icon: Box 5b -->
  <g transform="translate(277,469) scale(1.7) translate(-277,-469)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M271,469 A6,6 0 1,1 283,469"/>
      <polygon points="283,469 278,467.5 279.5,472.5" fill="#154A73" stroke="none"/>
    </g>
  </g>

  <!-- Converging arrows into Box 6 -->
  <polyline points="830,405 830,545 760,545 760,578" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <polyline points="500,540 500,562 350,562 350,578" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- Box 6: merged final step -->
  <rect x="150" y="580" width="700" height="120" rx="8" fill="#B2D5F2" stroke="#111111" stroke-width="2"/>
  <text x="500" y="610" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">6. Dashboard Reflects Final State</text>
  <text x="500" y="640" text-anchor="middle" font-size="16" fill="#111111">Real-time UI updates without a full page reload</text>
  <text x="500" y="663" text-anchor="middle" font-size="16" fill="#111111">Server state now matches the finalized on-chain record</text>
  <text x="500" y="686" text-anchor="middle" font-size="16" fill="#111111">Cycle complete &#8212; ready for the next client action</text>
  <!-- Icon: Box 6 -->
  <g transform="translate(177,603) scale(2) translate(-177,-603)">
    <g stroke="#154A73" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="171" y="597" width="12" height="8" rx="1"/>
      <line x1="177" y1="605" x2="177" y2="608"/>
      <line x1="173" y1="609" x2="181" y2="609"/>
    </g>
  </g>

</svg>
