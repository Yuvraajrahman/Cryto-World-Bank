  <text x="175" y="182" font-size="11" fill="#5a738c">client + approver</text>

  <rect x="355" y="142" width="210" height="52" rx="10" fill="#ffffff" stroke="#1f3864"/>
  <circle cx="382" cy="168" r="13" fill="#e3f2fd"/>
  <path d="M375 165 h14 M375 171 h10" stroke="#1f3864" stroke-width="1.6" stroke-linecap="round"/>
  <text x="405" y="164" font-size="13" font-weight="700" fill="#1f3864">Agent Chat</text>
  <text x="405" y="182" font-size="11" fill="#5a738c">SSE streaming</text>

  <rect x="585" y="142" width="210" height="52" rx="10" fill="#ffffff" stroke="#1f5f9a"/>
  <circle cx="612" cy="168" r="13" fill="#e3f2fd"/>
