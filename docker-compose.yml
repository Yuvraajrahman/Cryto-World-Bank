services:
  postgres:
    image: postgres:16-alpine
    container_name: cwb-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cwb
      POSTGRES_PASSWORD: cwb
      POSTGRES_DB: crypto_world_bank
    volumes:
      - cwb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwb -d crypto_world_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cwb_pg_data:
