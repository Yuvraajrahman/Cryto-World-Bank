  <text x="452" y="266" font-size="10" fill="#333">• Loans, SavingsVault, FixedDeposit</text>
  <text x="452" y="280" font-size="10" fill="#333">• GroupLendingPool, InterBankPool</text>
  <text x="452" y="294" font-size="10" fill="#333">• CreditPassport, Compliance (ZKP-KYC)</text>
  <text x="452" y="308" font-size="10" fill="#333">• Fraud Detection, Oracles, Automation</text>
  <text x="452" y="322" font-size="10" fill="#333">• and others</text>

