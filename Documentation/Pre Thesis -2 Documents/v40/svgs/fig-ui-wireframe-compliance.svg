      <text x="398" y="348" font-size="20" font-weight="700" fill="#fca5a5">2</text>
      <text x="398" y="366" font-size="11" fill="#737373">Anomaly score above 0.75</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="684" y="296" width="290" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
