<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="398" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Defense-in-Depth Architecture</text>

  <!-- L5 -->
  <rect x="15" y="100" width="145" height="170" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="87" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">L5</text>
  <text x="87" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Operational</text>
  <text x="87" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">security</text>
  <text x="87" y="184" text-anchor="middle" font-size="11" fill="#333">Safe multisig</text>
  <text x="87" y="199" text-anchor="middle" font-size="11" fill="#333">(2-of-3 / 3-of-5),</text>
  <text x="87" y="214" text-anchor="middle" font-size="11" fill="#333">key rotation,</text>
  <text x="87" y="229" text-anchor="middle" font-size="11" fill="#333">hardware signer</text>

  <!-- L4 -->
  <rect x="180" y="100" width="145" height="170" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="252" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">L4</text>
  <text x="252" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Runtime</text>
  <text x="252" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">monitoring</text>
  <text x="252" y="184" text-anchor="middle" font-size="11" fill="#333">Tenderly alerts</text>
  <text x="252" y="199" text-anchor="middle" font-size="11" fill="#333">(6 triggers),</text>
  <text x="252" y="214" text-anchor="middle" font-size="11" fill="#333">event listener,</text>
  <text x="252" y="229" text-anchor="middle" font-size="11" fill="#333">tx simulation</text>

  <!-- L3 -->
  <rect x="345" y="100" width="145" height="170" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="417" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">L3</text>
  <text x="417" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">AI / ML</text>
  <text x="417" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">security</text>
  <text x="417" y="184" text-anchor="middle" font-size="11" fill="#333">Random Forest +</text>
  <text x="417" y="199" text-anchor="middle" font-size="11" fill="#333">Isolation Forest +</text>
  <text x="417" y="214" text-anchor="middle" font-size="11" fill="#333">SHAP, commit-</text>
  <text x="417" y="229" text-anchor="middle" font-size="11" fill="#333">reveal oracle</text>

  <!-- L2 -->
  <rect x="510" y="100" width="145" height="170" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="582" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">L2</text>
  <text x="582" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Application</text>
  <text x="582" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">security</text>
  <text x="582" y="184" text-anchor="middle" font-size="11" fill="#333">EIP-712 JWT,</text>
  <text x="582" y="199" text-anchor="middle" font-size="11" fill="#333">rate limiting,</text>
  <text x="582" y="214" text-anchor="middle" font-size="11" fill="#333">CORS/CSP, prompt-</text>
  <text x="582" y="229" text-anchor="middle" font-size="11" fill="#333">injection scanning</text>

  <!-- L1 -->
  <rect x="675" y="100" width="145" height="170" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="747" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">L1</text>
  <text x="747" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Smart-contract</text>
  <text x="747" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">security</text>
  <text x="747" y="181" text-anchor="middle" font-size="10.5" fill="#333">ReentrancyGuard, CEI,</text>
  <text x="747" y="195" text-anchor="middle" font-size="10.5" fill="#333">RBAC + role expiry,</text>
  <text x="747" y="209" text-anchor="middle" font-size="10.5" fill="#333">UUPS, TimeLock,</text>
  <text x="747" y="223" text-anchor="middle" font-size="10.5" fill="#333">audits</text>

  <!-- Reserves (emphasized end) -->
  <rect x="840" y="115" width="145" height="140" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="912" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Reserves &amp;</text>
  <text x="912" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">loan state</text>
  <text x="912" y="211" text-anchor="middle" font-size="11" fill="#333">(protected asset)</text>

  <!-- Arrows -->
  <line x1="160" y1="185" x2="177" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a36)"/>
  <line x1="325" y1="185" x2="342" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a36)"/>
  <line x1="490" y1="185" x2="507" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a36)"/>
  <line x1="655" y1="185" x2="672" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a36)"/>
  <line x1="820" y1="185" x2="837" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a36)"/>

  <text x="500" y="310" text-anchor="middle" font-size="12" fill="#222">Five layers, from operational governance down to smart-contract code, jointly protect reserves and loan state.</text>
</svg>
