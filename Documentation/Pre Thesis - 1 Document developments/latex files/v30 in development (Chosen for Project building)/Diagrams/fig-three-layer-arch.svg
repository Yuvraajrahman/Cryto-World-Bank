  <text x="295" y="282" text-anchor="middle" font-size="10" fill="#555">↓</text>
  <text x="295" y="296" text-anchor="middle" font-size="10" fill="#333">National Banks (Tier 2)</text>
  <text x="295" y="310" text-anchor="middle" font-size="10" fill="#555">↓</text>
  <text x="295" y="324" text-anchor="middle" font-size="10" fill="#333">Local Banks (Tier 3)</text>

