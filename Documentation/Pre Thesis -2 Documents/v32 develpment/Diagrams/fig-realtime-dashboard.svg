<svg width="100%" viewBox="0 0 1000 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Real-Time Dashboard and Runtime Monitoring Pipeline</title>
  <desc>Three-stage pipeline: Ingestion and Indexing, Processing and Detection, and Real-Time Dashboard and Monitoring with consumer views.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="white"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Real-Time Dashboard and Runtime Monitoring Pipeline</text>

  <!-- ===== STAGE 1: INGESTION & INDEXING ===== -->
  <rect x="18" y="52" width="290" height="460" rx="10" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1"/>
  <text x="163" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#444" letter-spacing="1">1) INGESTION &amp; INDEXING</text>

  <!-- Smart Contracts box -->
  <rect x="40" y="200" width="130" height="100" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- code icon -->
  <text x="105" y="225" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555">&lt;/&gt;</text>
  <text x="105" y="248" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#222">Smart</text>
  <text x="105" y="263" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#222">Contracts</text>
  <text x="105" y="278" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#444">Emit Typed</text>
  <text x="105" y="291" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#444">Events</text>

  <!-- Arrow from Smart Contracts to Graph Subgraph -->
  <path d="M170 220 L195 220 L195 160 L205 160" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow from Smart Contracts to Tenderly -->
  <path d="M170 265 L195 265 L195 320 L205 320" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Graph Subgraph box -->
  <rect x="205" y="108" width="84" height="108" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- graph icon circles -->
  <circle cx="247" cy="128" r="5" fill="none" stroke="#555" stroke-width="1.2"/>
  <circle cx="234" cy="142" r="4" fill="none" stroke="#555" stroke-width="1.2"/>
  <circle cx="261" cy="142" r="4" fill="none" stroke="#555" stroke-width="1.2"/>
  <line x1="247" y1="133" x2="238" y2="138" stroke="#555" stroke-width="1"/>
  <line x1="247" y1="133" x2="257" y2="138" stroke="#555" stroke-width="1"/>
  <text x="247" y="160" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#222">The Graph</text>
  <text x="247" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#222">Subgraph</text>
  <text x="247" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">(Indexer)</text>
  <text x="247" y="198" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">Indexes events</text>
  <text x="247" y="209" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">and stores</text>

  <!-- Tenderly box -->
  <rect x="205" y="274" width="84" height="108" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- bell icon -->
  <path d="M247 291 Q247 285 254 285 Q261 285 261 291 L261 303 Q264 305 264 308 L230 308 Q230 305 233 303 Z" fill="none" stroke="#555" stroke-width="1.2"/>
  <path d="M244 308 Q244 311 247 311 Q250 311 250 308" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="247" y="326" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#222">Tenderly</text>
  <text x="247" y="338" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">(Runtime Alerts)</text>
  <text x="247" y="352" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">Monitors txns</text>
  <text x="247" y="363" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">and emits</text>
  <text x="247" y="374" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">runtime alerts</text>

  <!-- ===== STAGE 2: PROCESSING & DETECTION ===== -->
  <rect x="322" y="52" width="338" height="460" rx="10" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1"/>
  <text x="491" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#444" letter-spacing="1">2) PROCESSING &amp; DETECTION</text>

  <!-- WebSocket Server box -->
  <rect x="355" y="108" width="152" height="108" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- server icon - stacked lines -->
  <rect x="406" y="120" width="50" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.1"/>
  <rect x="406" y="133" width="50" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.1"/>
  <rect x="406" y="146" width="50" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.1"/>
  <circle cx="451" cy="125" r="2" fill="#555"/>
  <circle cx="451" cy="138" r="2" fill="#555"/>
  <circle cx="451" cy="151" r="2" fill="#555"/>
  <text x="431" y="168" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#222">WebSocket Server</text>
  <text x="431" y="181" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">(Node.js 20)</text>
  <text x="431" y="194" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">Receives indexed data</text>
  <text x="431" y="205" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">and runtime alerts</text>

  <!-- Arrow from Graph Subgraph to WebSocket -->
  <path d="M289 160 L354 160" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow from Tenderly to WebSocket (curves up) -->
  <path d="M289 320 L320 320 L320 190 L354 190" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow from WebSocket down to Anomaly Detector -->
  <path d="M431 216 L431 268" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Anomaly Detector box -->
  <rect x="355" y="268" width="152" height="118" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- shield icon -->
  <path d="M431 280 L445 286 L445 300 Q445 310 431 316 Q417 310 417 300 L417 286 Z" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="431" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555" font-weight="600">!</text>
  <text x="431" y="330" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#222">Anomaly Detector</text>
  <text x="431" y="342" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">(Isolation Forest)</text>
  <text x="431" y="356" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">Analyzes incoming data</text>
  <text x="431" y="367" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">and detects anomalous</text>
  <text x="431" y="378" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">patterns</text>

  <!-- Alert arrow from Anomaly Detector to Ops Runbook (horizontal) -->
  <path d="M507 320 L538 320" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="523" y="314" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">alert</text>

  <!-- Incident webhook dashed arrow from Anomaly Detector down -->
  <path d="M431 386 L431 430 L560 430 L560 400" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <text x="453" y="446" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777">incident webhook</text>

  <!-- Ops Runbook box -->
  <rect x="538" y="268" width="106" height="118" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- gear icon -->
  <circle cx="591" cy="299" r="10" fill="none" stroke="#555" stroke-width="1.2"/>
  <circle cx="591" cy="299" r="4" fill="none" stroke="#555" stroke-width="1.2"/>
  <line x1="591" y1="285" x2="591" y2="289" stroke="#555" stroke-width="1.5"/>
  <line x1="591" y1="309" x2="591" y2="313" stroke="#555" stroke-width="1.5"/>
  <line x1="577" y1="299" x2="581" y2="299" stroke="#555" stroke-width="1.5"/>
  <line x1="601" y1="299" x2="605" y2="299" stroke="#555" stroke-width="1.5"/>
  <line x1="581" y1="289" x2="583" y2="293" stroke="#555" stroke-width="1.5"/>
  <line x1="599" y1="305" x2="601" y2="309" stroke="#555" stroke-width="1.5"/>
  <text x="591" y="320" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#222">Ops Runbook</text>
  <text x="591" y="332" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#222">Function</text>
  <text x="591" y="344" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">(Auto Actions)</text>
  <text x="591" y="357" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">Triggers responses</text>
  <text x="591" y="368" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">and remediation</text>
  <text x="591" y="379" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">workflows</text>

  <!-- ===== STAGE 3: REAL-TIME DASHBOARD & MONITORING ===== -->
  <rect x="674" y="52" width="310" height="460" rx="10" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1"/>
  <text x="829" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#444" letter-spacing="1">3) REAL-TIME DASHBOARD &amp; MONITORING</text>

  <!-- Consumer Views label -->
  <text x="829" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">Consumer Views</text>
  <!-- dashed consumer views box -->
  <rect x="688" y="114" width="282" height="270" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Arrow from WebSocket to Redis Cache (dashed) -->
  <path d="M660 162 L687 162" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- Redis Cache box -->
  <rect x="692" y="130" width="80" height="120" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- DB / cylinder icon -->
  <ellipse cx="732" cy="148" rx="18" ry="6" fill="none" stroke="#555" stroke-width="1.1"/>
  <line x1="714" y1="148" x2="714" y2="162" stroke="#555" stroke-width="1.1"/>
  <line x1="750" y1="148" x2="750" y2="162" stroke="#555" stroke-width="1.1"/>
  <ellipse cx="732" cy="162" rx="18" ry="6" fill="none" stroke="#555" stroke-width="1.1"/>
  <text x="732" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#222">Redis Cache</text>
  <text x="732" y="196" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#888">(Latest Snapshot)</text>
  <text x="732" y="210" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">Stores latest state</text>
  <text x="732" y="221" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">and metrics for</text>
  <text x="732" y="232" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">fast retrieval</text>
  <text x="732" y="243" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">  </text>

  <!-- Arrow from Redis to React Dashboard (dashed) -->
  <path d="M772 190 L798 190" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- React Dashboard box -->
  <rect x="798" y="130" width="80" height="120" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- chart icon (bar + line) -->
  <rect x="818" y="153" width="6" height="14" fill="#555"/>
  <rect x="828" y="147" width="6" height="20" fill="#555"/>
  <rect x="838" y="158" width="6" height="9" fill="#555"/>
  <polyline points="816,150 826,144 836,155 848,143" fill="none" stroke="#555" stroke-width="1.1"/>
  <text x="838" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#222">React Dashboard</text>
  <text x="838" y="196" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#888">Charts + Alerts</text>
  <text x="838" y="210" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">Visualizes KPIs,</text>
  <text x="838" y="221" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">trends, and</text>
  <text x="838" y="232" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555">real-time alerts</text>

  <!-- Arrow from React Dashboard to Read-only View (dashed) -->
  <path d="M878 190 L904 190" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- Read-only Regulator box -->
  <rect x="904" y="130" width="56" height="120" rx="8" fill="white" stroke="#555" stroke-width="1.2"/>
  <!-- person icon -->
  <circle cx="932" cy="150" r="8" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M919 174 Q919 162 932 162 Q945 162 945 174" fill="none" stroke="#555" stroke-width="1.1"/>
  <text x="932" y="192" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#222">Read-only</text>
  <text x="932" y="203" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#222">Regulator</text>
  <text x="932" y="214" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#222">View</text>
  <text x="932" y="227" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555">Audit-friendly</text>
  <text x="932" y="238" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555">read-only</text>
  <text x="932" y="249" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555">interface</text>

  <!-- ===== LEGEND ===== -->
  <rect x="18" y="530" width="560" height="72" rx="8" fill="white" stroke="#aaaaaa" stroke-width="1"/>
  <text x="34" y="552" font-family="sans-serif" font-size="11" font-weight="700" fill="#222">LEGEND</text>
  <!-- solid arrow -->
  <line x1="34" y1="575" x2="80" y2="575" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="88" y="579" font-family="sans-serif" font-size="10.5" fill="#444">Data Flow</text>
  <!-- dashed arrow -->
  <line x1="180" y1="575" x2="226" y2="575" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <text x="234" y="572" font-family="sans-serif" font-size="10.5" fill="#444">Alert /</text>
  <text x="234" y="585" font-family="sans-serif" font-size="10.5" fill="#444">Webhook Flow</text>
  <!-- System Component box -->
  <rect x="340" y="565" width="56" height="20" rx="4" fill="white" stroke="#555" stroke-width="1.2"/>
  <text x="410" y="579" font-family="sans-serif" font-size="10.5" fill="#444">System Component</text>
  <!-- External Service box -->
  <rect x="340" y="590" width="56" height="6" rx="2" fill="#e8e8e8" stroke="#aaa" stroke-width="1"/>
  <text x="410" y="600" font-family="sans-serif" font-size="10.5" fill="#444">External Service</text>

</svg>
