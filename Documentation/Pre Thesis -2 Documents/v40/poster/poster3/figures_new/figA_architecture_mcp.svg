  <text x="865" y="182" font-size="11" fill="#5a738c">SHAP + queue</text>

  <!-- L3 -->
  <rect x="40" y="225" width="1040" height="150" rx="14" fill="#d9eaf7" stroke="#2b6cb0" stroke-width="1.4"/>
  <circle cx="85" cy="265" r="24" fill="#1f5f9a"/>
