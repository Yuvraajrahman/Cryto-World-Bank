<svg width="100%" viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">
  <title>Core Platform Architecture: 4-Layer System Diagram</title>
  <rect width="1100" height="620" fill="#ffffff"/>

  <!-- Column Headers -->
  <text x="80" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#555"/>
  <text x="460" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">CORE PLATFORM</text>
  <text x="860" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">OPTIONAL ADD-ON</text>

  <!-- KEY TECHNOLOGIES column header -->
  <text x="1010" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">KEY TECHNOLOGIES</text>

  <!-- Vertical divider between core and optional -->
  <line x1="760" y1="30" x2="760" y2="590" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ============================================================ -->
  <!-- LAYER 1: PRESENTATION LAYER -->
  <!-- ============================================================ -->
  <!-- Layer label box (left) -->
  <rect x="10" y="38" width="130" height="130" rx="4" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <text x="75" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="75" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">PRESENTATION</text>
  <text x="75" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">LAYER</text>
  <text x="75" y="124" text-anchor="middle" font-size="10" fill="#bbb">(User Interface)</text>

