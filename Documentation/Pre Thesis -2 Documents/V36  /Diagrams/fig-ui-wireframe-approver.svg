    <rect x="500" y="692" width="36" height="14" rx="4" fill="#ef4444" opacity="0.65"/>
    <text x="630" y="704" font-size="10" fill="#fca5a5">-0.02</text>

    <line x1="492" y1="590" x2="492" y2="722" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

