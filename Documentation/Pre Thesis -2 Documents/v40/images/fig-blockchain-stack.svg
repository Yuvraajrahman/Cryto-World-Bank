<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="578" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Blockchain Stack</text>

  <!-- Frontend -->
  <rect x="300" y="55" width="200" height="75" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="400" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Frontend</text>
  <text x="400" y="108" text-anchor="middle" font-size="12" fill="#333">React + wallet</text>

  <!-- Off-chain -->
  <rect x="90" y="185" width="270" height="100" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="225" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Off-chain</text>
  <text x="225" y="242" text-anchor="middle" font-size="12" fill="#333">Express · PostgreSQL · ML</text>

  <!-- Smart contracts -->
  <rect x="440" y="185" width="270" height="100" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="575" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Smart contracts</text>
  <text x="575" y="242" text-anchor="middle" font-size="12" fill="#333">Solidity 0.8.20 · 17 modules</text>

  <!-- Oracle -->
  <rect x="90" y="340" width="270" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="225" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Oracle</text>
  <text x="225" y="395" text-anchor="middle" font-size="12" fill="#333">commit–reveal (MVT)</text>

  <!-- Execution -->
  <rect x="440" y="340" width="270" height="90" rx="5" fill="#eef2fa" stroke="#2b2b2b" stroke-width="1.3"/>
  <text x="575" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Execution</text>
  <text x="575" y="395" text-anchor="middle" font-size="12" fill="#333">Sepolia / Amoy · EVM</text>

  <!-- Settlement (emphasized) -->
  <rect x="265" y="470" width="270" height="80" rx="5" fill="#dbe4f7" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="400" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Settlement</text>
  <text x="400" y="525" text-anchor="middle" font-size="12" fill="#333">Ethereum L1 anchor</text>

  <!-- Arrows -->
  <line x1="360" y1="128" x2="250" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="440" y1="128" x2="550" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="225" y1="285" x2="225" y2="337" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="575" y1="285" x2="575" y2="337" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="530" y1="430" x2="450" y2="467" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a3)"/>

  <text x="400" y="565" text-anchor="middle" font-size="12" fill="#222">Off-chain services and on-chain contracts run in parallel and settle together on Ethereum L1.</text>
</svg>
