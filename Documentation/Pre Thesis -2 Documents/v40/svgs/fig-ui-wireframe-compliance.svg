<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#120a06"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="48" y="48" width="1304" height="804" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <ellipse cx="1180" cy="120" rx="320" ry="220" fill="url(#glowOrange)"/>
  <ellipse cx="180" cy="760" rx="280" ry="200" fill="url(#glowBlue)"/>
  <ellipse cx="700" cy="450" rx="420" ry="280" fill="url(#glowOrange)" opacity="0.35"/>

  <g clip-path="url(#screenClip)">
    <!-- Top navigation -->
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="none" stroke="rgba(234,88,12,0.25)" stroke-width="1"/>

    <circle cx="88" cy="80" r="20" fill="url(#orangeAccent)"/>
    <text x="88" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">C</text>
    <text x="118" y="78" font-size="22.5" font-weight="700" fill="#fafafa">Crypto World Bank</text>
    <text x="118" y="98" font-size="11" fill="#a3a3a3">Compliance officer portal</text>

    <rect x="360" y="66" width="108" height="28" rx="14" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="414" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Compliance</text>
    <text x="490" y="84" font-size="12" fill="#737373">Alerts</text>
    <text x="550" y="84" font-size="12" fill="#737373">SAR Reports</text>
    <text x="650" y="84" font-size="12" fill="#737373">Audit Log</text>

    <rect x="1040" y="64" width="148" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="1060" cy="80" r="5" fill="#22c55e"/>
    <text x="1074" y="84" font-size="11" fill="#d4d4d4">0x4b2c...8f11</text>

    <rect x="1200" y="62" width="132" height="36" rx="18" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="1266" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect Wallet</text>

    <!-- AML alert banner -->
    <rect x="48" y="128" width="1304" height="52" rx="14" fill="rgba(239,68,68,0.10)" stroke="rgba(239,68,68,0.35)" stroke-width="1.2"/>
    <circle cx="82" cy="154" r="12" fill="rgba(239,68,68,0.25)" stroke="#ef4444" stroke-width="1.2"/>
    <text x="82" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#fca5a5">!</text>
    <text x="106" y="150" font-size="13" font-weight="600" fill="#fca5a5">AML alert flagged - officer review required</text>
    <text x="106" y="166" font-size="11" fill="#f87171">Anomaly detection triggered this case for compliance review</text>
    <rect x="1188" y="142" width="148" height="24" rx="12" fill="rgba(239,68,68,0.18)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
    <text x="1262" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#fca5a5">High priority</text>

    <!-- Page header -->
    <text x="72" y="218" font-size="11" letter-spacing="3" fill="#ea580c" font-weight="600">COMPLIANCE</text>
    <text x="72" y="248" font-size="28" font-weight="700" fill="#fafafa">AML Alert Review</text>
    <text x="72" y="272" font-size="13" fill="#a3a3a3">Review suspicious activity and file SAR reports when needed</text>

    <rect x="1210" y="196" width="118" height="34" rx="17" fill="rgba(234,88,12,0.12)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
    <text x="1269" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Refresh</text>

    <!-- Stat cards -->
    <g filter="url(#softShadow)">
      <rect x="72" y="296" width="290" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="92" y="322" font-size="10" fill="#a3a3a3">Open alerts</text>
      <text x="92" y="348" font-size="20" font-weight="700" fill="#fafafa">7</text>
      <text x="92" y="366" font-size="11" fill="#737373">Awaiting review</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="378" y="296" width="290" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
