  <text x="400" y="318" font-size="13" font-weight="700" fill="#1f3864">MCP Agent</text>
  <text x="400" y="334" font-size="11" fill="#1f3864">Qwen3-8B + tools</text>
  <text x="400" y="348" font-size="10" fill="#5a738c">confirm-gate / audit</text>

  <rect x="595" y="295" width="200" height="60" rx="10" fill="#ffffff" stroke="#2b6cb0"/>
  <circle cx="625" cy="325" r="14" fill="#e3f2fd"/>
  <path d="M617 331 V319 h16 v12 M621 325 h8" fill="none" stroke="#1565a0" stroke-width="1.5"/>
  <text x="650" y="320" font-size="13" font-weight="700" fill="#1565a0">ML Scorer</text>
  <text x="650" y="338" font-size="11" fill="#5a738c">RF+IF / SHAP</text>

  <rect x="815" y="295" width="230" height="60" rx="10" fill="#ffffff" stroke="#2b6cb0"/>
  <circle cx="845" cy="325" r="14" fill="#e3f2fd"/>
  <path d="M838 318 h14 M838 325 h14 M838 332 h10" stroke="#1565a0" stroke-width="1.6" stroke-linecap="round"/>
  <text x="870" y="320" font-size="13" font-weight="700" fill="#1565a0">Event Sync</text>
  <text x="870" y="338" font-size="11" fill="#5a738c">chain → Postgres</text>

  <!-- L2 -->
  <rect x="40" y="390" width="1040" height="110" rx="14" fill="#e3eef8" stroke="#1f5f9a" stroke-width="1.3"/>
  <circle cx="85" cy="425" r="24" fill="#4a90c2"/>
  <text x="85" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L2</text>
  <ellipse cx="145" cy="418" rx="14" ry="6" fill="none" stroke="#1f3864" stroke-width="2"/>
  <path d="M131 418 v16 c0 5 28 5 28 0 V418" fill="none" stroke="#1f3864" stroke-width="2"/>
  <text x="175" y="422" font-size="18" font-weight="700" fill="#1f3864">Persistence</text>
  <text x="175" y="442" font-size="12" fill="#1565a0">PostgreSQL (51 entities) / Redis cache</text>

  <rect x="125" y="458" width="200" height="30" rx="8" fill="#ffffff" stroke="#1f5f9a"/>
  <text x="225" y="478" text-anchor="middle" font-size="12" fill="#334e68">lending projections</text>
  <rect x="345" y="458" width="170" height="30" rx="8" fill="#ffffff" stroke="#1f5f9a"/>
  <text x="430" y="478" text-anchor="middle" font-size="12" fill="#334e68">audit logs</text>
  <rect x="535" y="458" width="200" height="30" rx="8" fill="#ffffff" stroke="#1f3864"/>
  <text x="635" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#1f3864">agent sessions</text>
  <rect x="755" y="458" width="250" height="30" rx="8" fill="#ffffff" stroke="#1f5f9a"/>
  <text x="880" y="478" text-anchor="middle" font-size="12" fill="#334e68">SECURITY_EVENT</text>

  <!-- L1 -->
  <rect x="40" y="515" width="1040" height="140" rx="14" fill="#e8f1fa" stroke="#4a90c2" stroke-width="1.3"/>
  <circle cx="85" cy="555" r="24" fill="#0e6ebd"/>
  <text x="85" y="561" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L1</text>
  <path d="M135 548 c0-6 10-6 10 0 v10 c0 6-10 6-10 0" fill="none" stroke="#1f3864" stroke-width="2"/>
  <path d="M150 548 c0-6 10-6 10 0 v10 c0 6-10 6-10 0" fill="none" stroke="#1f3864" stroke-width="2"/>
  <path d="M143 553 h10" stroke="#1f3864" stroke-width="2"/>
  <text x="175" y="552" font-size="18" font-weight="700" fill="#1f3864">On-Chain (EVM)</text>
  <text x="175" y="572" font-size="12" fill="#1565a0">Solidity 0.8.20 / OpenZeppelin / Polygon zkEVM / Sepolia</text>

  <rect x="125" y="590" width="210" height="48" rx="10" fill="#ffffff" stroke="#1f3864"/>
  <circle cx="155" cy="614" r="12" fill="#0e6ebd"/>
  <path d="M149 620 V608 L155 604 L161 608 V620" fill="none" stroke="#fff" stroke-width="1.4"/>
  <text x="178" y="610" font-size="13" font-weight="700" fill="#1f3864">WB / NB / LB</text>
  <text x="178" y="626" font-size="11" fill="#5a738c">4-tier hierarchy</text>

  <rect x="355" y="590" width="210" height="48" rx="10" fill="#ffffff" stroke="#1f5f9a"/>
  <circle cx="385" cy="614" r="12" fill="#e3f2fd"/>
  <path d="M379 618 l4 4 8-9" fill="none" stroke="#1565a0" stroke-width="1.7"/>
  <text x="408" y="610" font-size="13" font-weight="700" fill="#1565a0">LoanController</text>
  <text x="408" y="626" font-size="11" fill="#5a738c">commit-reveal</text>

  <rect x="585" y="590" width="210" height="48" rx="10" fill="#ffffff" stroke="#1f5f9a"/>
  <circle cx="615" cy="614" r="12" fill="#e3f2fd"/>
  <ellipse cx="615" cy="616" rx="7" ry="3.5" fill="none" stroke="#1565a0" stroke-width="1.4"/>
  <text x="638" y="610" font-size="13" font-weight="700" fill="#1565a0">Pool modules</text>
  <text x="638" y="626" font-size="11" fill="#5a738c">IBLP / UDF / Syn</text>

  <rect x="815" y="590" width="230" height="48" rx="10" fill="#ffffff" stroke="#1f5f9a"/>
  <circle cx="845" cy="614" r="12" fill="#e3f2fd"/>
  <path d="M845 606 v16 M837 614 h16" stroke="#1565a0" stroke-width="1.6"/>
  <circle cx="845" cy="614" r="5" fill="none" stroke="#1565a0" stroke-width="1.3"/>
  <text x="868" y="610" font-size="13" font-weight="700" fill="#1565a0">Chainlink</text>
  <text x="868" y="626" font-size="11" fill="#5a738c">feeds / PoR</text>

  <!-- arrows -->
  <line x1="22" y1="100" x2="22" y2="640" stroke="#1f3864" stroke-width="2.5" marker-end="url(#arrDn)"/>
  <text x="10" y="380" transform="rotate(-90 10 380)" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3864">request / tx</text>
  <line x1="1100" y1="640" x2="1100" y2="100" stroke="#1565a0" stroke-width="2.5" marker-end="url(#arrUp)"/>
  <text x="1116" y="380" transform="rotate(90 1116 380)" text-anchor="middle" font-size="12" font-weight="600" fill="#1565a0">confirmed state</text>

  <!-- RIGHT callouts - wider -->
  <rect x="1130" y="75" width="400" height="230" rx="12" fill="#eef5fb" stroke="#0288d1" stroke-width="1.5"/>
  <circle cx="1165" cy="108" r="18" fill="#0e6ebd"/>
  <path d="M1158 105 h14 M1158 111 h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1330" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#0288d1">1) MCP Agent Path</text>
  <text x="1150" y="148" font-size="13" fill="#334e68">Client chat → Express wallet JSON</text>
  <text x="1150" y="170" font-size="13" fill="#334e68">→ Qwen3-8B picks typed MCP tool</text>
  <text x="1150" y="192" font-size="13" fill="#334e68">→ READ: grounded API/DB answer</text>
  <rect x="1145" y="204" width="370" height="42" rx="8" fill="#0e6ebd"/>
  <text x="1160" y="222" font-size="13" font-weight="700" fill="#ffffff">→ WRITE: human confirmation gate required</text>
  <text x="1160" y="238" font-size="12" font-weight="700" fill="#ffffff">   (no silent agent writes)</text>
  <text x="1150" y="268" font-size="13" fill="#334e68">→ EIP-7702 session → on-chain tx</text>
  <text x="1150" y="288" font-size="13" fill="#334e68">→ AGENT_ACTION_LOG (append-only audit)</text>

  <rect x="1130" y="320" width="400" height="180" rx="12" fill="#eef5fb" stroke="#2b6cb0" stroke-width="1.4"/>
  <circle cx="1165" cy="353" r="18" fill="#1565a0"/>
  <path d="M1158 358 V346 h14 v12 M1162 352 h6" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="1330" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#1565a0">2) ML Commit-Reveal Oracle</text>
  <text x="1150" y="392" font-size="13" fill="#334e68">Loan request → FastAPI scores (RF+IF)</text>
  <text x="1150" y="414" font-size="13" fill="#334e68">→ commit h = keccak256(s || nonce)</text>
  <text x="1150" y="436" font-size="13" fill="#334e68">→ reveal s on-chain → immutable audit</text>
  <text x="1150" y="458" font-size="13" fill="#334e68">→ SHAP explanation → human approver</text>
  <rect x="1145" y="470" width="370" height="22" rx="6" fill="#1565a0"/>
  <text x="1160" y="486" font-size="12" font-weight="700" fill="#ffffff">Bands: approve &lt;0.4 / review 0.4–0.7 / reject ≥0.7</text>

  <rect x="1130" y="515" width="400" height="140" rx="12" fill="#eef5fb" stroke="#1f5f9a" stroke-width="1.3"/>
  <circle cx="1165" cy="548" r="18" fill="#1f3864"/>
  <path d="M1157 548 l6 6 12-13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="1330" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3864">3) Security wrap (Fig. D)</text>
  <text x="1150" y="585" font-size="13" fill="#334e68">L5 multisig → L4 monitoring → L3 ML</text>
  <text x="1150" y="608" font-size="13" fill="#334e68">→ L2 API/JWT/prompt-scan → L1 RBAC/CEI</text>
  <rect x="1145" y="620" width="340" height="24" rx="6" fill="#0e6ebd"/>
  <text x="1160" y="637" font-size="12" font-weight="700" fill="#ffffff">Every write path ends in a human gate</text>
</svg>
