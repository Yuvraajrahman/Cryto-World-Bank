      <text x="704" y="348" font-size="20" font-weight="700" fill="#fdba74">3</text>
      <text x="704" y="366" font-size="11" fill="#ea580c">This month</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="990" y="296" width="338" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
