<rect x="336" y="580" width="120" height="26" rx="3" fill="#000000"/>
<text class="sm" x="396" y="593" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Ancillary services</text>

<!-- TECH STACK -->
<text class="sm" x="70" y="630" font-weight="600" fill="#000000">Technology stack:</text>

<text class="sm" x="66" y="654" text-anchor="end" dominant-baseline="central" fill="#000000">L4</text>
<rect x="70" y="638" width="540" height="32" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="0.8"/>
<text class="sm" x="340" y="654" text-anchor="middle" dominant-baseline="central" fill="#000000">React 18 / TypeScript UI · wallet signing · optional MCP agent (Qwen3-8B, 17 banking tools)</text>

<text class="sm" x="66" y="692" text-anchor="end" dominant-baseline="central" fill="#000000">L3</text>
<rect x="70" y="676" width="540" height="32" rx="3" fill="#cccccc" stroke="#888888" stroke-width="0.8"/>
<text class="sm" x="340" y="692" text-anchor="middle" dominant-baseline="central" fill="#000000">Express.js + FastAPI · scikit-learn fraud detection · SHAP explainability · Chainlink Functions oracle</text>

<text class="sm" x="66" y="730" text-anchor="end" dominant-baseline="central" fill="#000000">L2</text>
<rect x="70" y="714" width="540" height="32" rx="3" fill="#444444" stroke="#222222" stroke-width="0.8"/>
<text class="sm" x="340" y="730" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Solidity 0.8.20 smart contracts · ERC-4337 Paymaster · ZKP identity (Circom 2.0 / Groth16) · RBAC</text>

<text class="sm" x="66" y="768" text-anchor="end" dominant-baseline="central" fill="#000000">L1</text>
<rect x="70" y="752" width="540" height="32" rx="3" fill="#000000" stroke="#000000" stroke-width="0.8"/>
<text class="sm" x="340" y="768" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Polygon zkEVM Cardona · Ethereum Sepolia · PostgreSQL (19 entities) · IPFS</text>

<!-- LEGEND -->
<rect x="70" y="800" width="540" height="96" rx="4" fill="none" stroke="#aaaaaa" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="sm" x="86" y="820" font-weight="600" fill="#000000">Flow key:</text>

<line x1="86" y1="840" x2="120" y2="840" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text class="sm" x="128" y="840" dominant-baseline="central" fill="#000000">allocateCapital — downward capital allocation (Tier 1 → 2 → 3 → 4)</text>

<line x1="86"  y1="862" x2="106" y2="862" stroke="#555555" stroke-width="1.1" marker-end="url(#arr)"/>
<line x1="106" y1="870" x2="86"  y2="870" stroke="#555555" stroke-width="1.1" marker-end="url(#arr)"/>
<text class="sm" x="114" y="866" dominant-baseline="central" fill="#000000">InterBankLendingPool — same-tier liquidity (dashed border)</text>

<line x1="86" y1="886" x2="120" y2="886" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text class="sm" x="128" y="886" dominant-baseline="central" fill="#000000">UpwardDepositFacility — surplus repatriation to parent tier</text>

