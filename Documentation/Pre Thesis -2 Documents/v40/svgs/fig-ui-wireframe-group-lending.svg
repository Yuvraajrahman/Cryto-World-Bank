<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#120a06"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="48" y="48" width="1304" height="804" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <ellipse cx="1180" cy="120" rx="320" ry="220" fill="url(#glowOrange)"/>
  <ellipse cx="180" cy="760" rx="280" ry="200" fill="url(#glowBlue)"/>
  <ellipse cx="700" cy="450" rx="420" ry="280" fill="url(#glowOrange)" opacity="0.35"/>

  <g clip-path="url(#screenClip)">
    <!-- Top navigation -->
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="48" y="48" width="1304" height="64" rx="16" fill="none" stroke="rgba(234,88,12,0.25)" stroke-width="1"/>

    <circle cx="88" cy="80" r="20" fill="url(#orangeAccent)"/>
    <text x="88" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">C</text>
    <text x="118" y="78" font-size="22.5" font-weight="700" fill="#fafafa">Crypto World Bank</text>
    <text x="118" y="98" font-size="11" fill="#a3a3a3">Solidarity group portal</text>

    <rect x="360" y="66" width="120" height="28" rx="14" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="420" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Group Lending</text>
    <text x="510" y="84" font-size="12" fill="#737373">My Loans</text>
    <text x="580" y="84" font-size="12" fill="#737373">Profile</text>

    <rect x="1040" y="64" width="148" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="1060" cy="80" r="5" fill="#22c55e"/>
    <text x="1074" y="84" font-size="11" fill="#d4d4d4">0x7a3f...9c2e</text>

    <rect x="1200" y="62" width="132" height="36" rx="18" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="1266" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect Wallet</text>

    <!-- Mutual liability banner -->
    <rect x="48" y="128" width="1304" height="52" rx="14" fill="rgba(234,88,12,0.10)" stroke="rgba(249,115,22,0.35)" stroke-width="1.2"/>
    <text x="106" y="150" font-size="13" font-weight="600" fill="#fdba74">Solidarity group - shared mutual liability</text>
    <text x="106" y="166" font-size="11" fill="#d4d4d4">All members are jointly responsible. Default affects every member Credit Passport tier.</text>
    <rect x="1188" y="142" width="148" height="24" rx="12" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <text x="1262" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">GroupLendingPool</text>

    <!-- Page header -->
    <text x="72" y="218" font-size="11" letter-spacing="3" fill="#ea580c" font-weight="600">GROUP LOAN</text>
    <text x="72" y="248" font-size="28" font-weight="700" fill="#fafafa">Apply as a Group</text>
    <text x="72" y="272" font-size="13" fill="#a3a3a3">3-20 members borrow together with shared collateral and consent</text>

    <rect x="1210" y="196" width="118" height="34" rx="17" fill="rgba(234,88,12,0.12)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
    <text x="1269" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Refresh</text>

    <!-- Stat cards -->
    <g filter="url(#softShadow)">
      <rect x="72" y="296" width="290" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="92" y="322" font-size="10" fill="#a3a3a3">Group size</text>
      <text x="92" y="348" font-size="20" font-weight="700" fill="#fafafa">4 members</text>
      <text x="92" y="366" font-size="11" fill="#737373">Min 3 - max 20</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="378" y="296" width="290" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="398" y="322" font-size="10" fill="#a3a3a3">Total loan amount</text>
      <text x="398" y="348" font-size="20" font-weight="700" fill="#fafafa">4,000 USDC</text>
      <text x="398" y="366" font-size="11" fill="#737373">12 month term</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="684" y="296" width="290" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="704" y="322" font-size="10" fill="#a3a3a3">Per-member share</text>
      <text x="704" y="348" font-size="20" font-weight="700" fill="#fdba74">1,000 USDC</text>
      <text x="704" y="366" font-size="11" fill="#ea580c">LoanTotal / N members</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="990" y="296" width="338" height="78" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="1010" y="322" font-size="10" fill="#a3a3a3">Member consents</text>
      <text x="1010" y="348" font-size="20" font-weight="700" fill="#fafafa">3 / 4</text>
      <text x="1010" y="366" font-size="11" fill="#737373">All must consent to submit</text>
    </g>

    <!-- Main form panel -->
    <rect x="72" y="396" width="820" height="432" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="72" y="396" width="820" height="4" rx="18" fill="url(#orangeAccent)"/>

    <text x="96" y="434" font-size="11" letter-spacing="2" fill="#a3a3a3">GROUP DETAILS</text>

    <text x="96" y="462" font-size="11" font-weight="600" fill="#d4d4d4">Group name</text>
    <rect x="96" y="470" width="360" height="40" rx="10" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="112" y="495" font-size="14" fill="#fafafa">Dhaka Women Entrepreneurs</text>

    <text x="488" y="462" font-size="11" font-weight="600" fill="#d4d4d4">Local Bank</text>
    <rect x="488" y="470" width="360" height="40" rx="10" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="504" y="495" font-size="14" fill="#fafafa">Dhaka Local Bank</text>

    <text x="96" y="534" font-size="11" font-weight="600" fill="#d4d4d4">Loan purpose</text>
    <rect x="96" y="542" width="752" height="40" rx="10" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="112" y="567" font-size="13" fill="#e5e5e5">Shared inventory purchase for market stall cooperative</text>

    <!-- Member list -->
    <text x="96" y="606" font-size="11" font-weight="600" fill="#d4d4d4">Group members and consent</text>

    <!-- Member 1 - lead, consented -->
    <rect x="96" y="614" width="752" height="40" rx="10" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
    <circle cx="118" cy="634" r="12" fill="rgba(234,88,12,0.3)" stroke="#f97316" stroke-width="1"/>
    <text x="118" y="638" text-anchor="middle" font-size="9" font-weight="700" fill="#fdba74">AR</text>
    <text x="140" y="630" font-size="12" font-weight="600" fill="#fafafa">Amina Rahman</text>
    <text x="140" y="646" font-size="10" fill="#a3a3a3">Lead member | 1,000 USDC share</text>
    <rect x="760" y="624" width="72" height="20" rx="10" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="796" y="638" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">Consented</text>

    <!-- Member 2 -->
    <rect x="96" y="660" width="752" height="40" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="118" cy="680" r="12" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="1"/>
    <text x="118" y="684" text-anchor="middle" font-size="9" font-weight="700" fill="#93c5fd">KH</text>
    <text x="140" y="676" font-size="12" fill="#d4d4d4">Karim Hassan</text>
    <text x="140" y="692" font-size="10" fill="#737373">1,000 USDC share</text>
    <rect x="760" y="670" width="72" height="20" rx="10" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="796" y="684" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">Consented</text>

    <!-- Member 3 -->
    <rect x="96" y="706" width="752" height="40" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="118" cy="726" r="12" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-width="1"/>
    <text x="118" y="730" text-anchor="middle" font-size="9" font-weight="700" fill="#86efac">FA</text>
    <text x="140" y="722" font-size="12" fill="#d4d4d4">Fatima Akter</text>
    <text x="140" y="738" font-size="10" fill="#737373">1,000 USDC share</text>
    <rect x="760" y="716" width="72" height="20" rx="10" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="796" y="730" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">Consented</text>

    <!-- Member 4 - pending -->
    <rect x="96" y="752" width="752" height="40" rx="10" fill="rgba(234,88,12,0.08)" stroke="rgba(249,115,22,0.30)" stroke-width="1"/>
    <circle cx="118" cy="772" r="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="118" y="776" text-anchor="middle" font-size="9" font-weight="700" fill="#a3a3a3">SD</text>
    <text x="140" y="768" font-size="12" fill="#d4d4d4">Soborno Das</text>
    <text x="140" y="784" font-size="10" fill="#737373">1,000 USDC share - awaiting consent</text>
    <rect x="756" y="762" width="80" height="20" rx="10" fill="rgba(234,88,12,0.2)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="796" y="776" text-anchor="middle" font-size="9" font-weight="600" fill="#fdba74">Pending</text>

    <!-- Share breakdown panel -->
    <rect x="916" y="396" width="412" height="432" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="940" y="434" font-size="10" letter-spacing="2" fill="#a3a3a3">SHARE BREAKDOWN</text>
    <text x="940" y="460" font-size="22" font-weight="700" fill="#fafafa">Member shares</text>

    <!-- Pie-style bar breakdown -->
    <rect x="940" y="478" width="364" height="24" rx="8" fill="rgba(0,0,0,0.35)"/>
    <rect x="940" y="478" width="91" height="24" rx="8" fill="rgba(249,115,22,0.85)"/>
    <rect x="1031" y="478" width="91" height="24" fill="rgba(59,130,246,0.75)"/>
    <rect x="1122" y="478" width="91" height="24" fill="rgba(34,197,94,0.75)"/>
    <rect x="1213" y="478" width="91" height="24" rx="0" fill="rgba(255,255,255,0.12)"/>

    <text x="940" y="522" font-size="11" fill="#a3a3a3">Each member: 25% of total (1,000 / 4,000 USDC)</text>

    <rect x="940" y="538" width="364" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="562" font-size="12" fill="#a3a3a3">Shared collateral pooled</text>
    <text x="1288" y="562" text-anchor="end" font-size="13" font-weight="600" fill="#fafafa" font-family="ui-monospace, monospace">2,500 USDC</text>

    <rect x="940" y="584" width="364" height="38" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="956" y="608" font-size="12" fill="#a3a3a3">Monthly group installment</text>
    <text x="1288" y="608" text-anchor="end" font-size="13" font-weight="600" fill="#fafafa" font-family="ui-monospace, monospace">450.00 USDC</text>

    <rect x="940" y="630" width="364" height="38" rx="10" fill="rgba(234,88,12,0.12)" stroke="rgba(249,115,22,0.35)" stroke-width="1"/>
    <text x="956" y="654" font-size="12" fill="#fdba74">APR (group rate)</text>
    <text x="1288" y="654" text-anchor="end" font-size="14" font-weight="700" fill="#fdba74">7.50%</text>

    <line x1="940" y1="686" x2="1304" y2="686" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

    <text x="940" y="708" font-size="11" font-weight="600" fill="#d4d4d4">Risk controls</text>
    <circle cx="952" cy="728" r="5" fill="#22c55e"/>
    <text x="966" y="732" font-size="11" fill="#d4d4d4">DTI check passed (0.32 &lt; 0.40)</text>
    <circle cx="952" cy="752" r="5" fill="#22c55e"/>
    <text x="966" y="756" font-size="11" fill="#d4d4d4">Max 2 simultaneous group loans</text>
    <circle cx="952" cy="776" r="5" fill="#ea580c"/>
    <text x="966" y="780" font-size="11" fill="#d4d4d4">Default: collateral first, then tier downgrade</text>

    <rect x="940" y="794" width="364" height="34" rx="10" fill="rgba(37,99,235,0.10)" stroke="rgba(59,130,246,0.28)" stroke-width="1"/>
    <text x="956" y="815" font-size="11" fill="#93c5fd">Waiting for Soborno Das consent before submission</text>

    <!-- Action buttons -->
    <rect x="96" y="812" width="188" height="40" rx="20" fill="url(#btnGreen)" opacity="0.45"/>
    <text x="190" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Submit Group Loan</text>

    <rect x="300" y="812" width="120" height="40" rx="20" fill="url(#btnRed)" opacity="0.92"/>
    <text x="360" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Cancel</text>

    <rect x="436" y="812" width="140" height="40" rx="20" fill="url(#btnBlue)" filter="url(#softShadow)"/>
    <text x="506" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Invite Member</text>

    <rect x="592" y="812" width="140" height="40" rx="20" fill="rgba(234,88,12,0.18)" stroke="rgba(249,115,22,0.55)" stroke-width="1.2"/>
    <text x="662" y="836" text-anchor="middle" font-size="12" font-weight="600" fill="#fdba74">Save Draft</text>
  </g>

  <text x="700" y="24" text-anchor="middle" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.35)" font-weight="600">GROUP LENDING WIREFRAME</text>
</svg>
